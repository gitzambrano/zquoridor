<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quoridor — motor C++/WASM</title>
<style>
  :root {
    /* Dark walnut UI: warm near-black surfaces, gold accents */
    --bg: #120d08;
    --panel: #1d1610;
    --panel-2: #251c13;
    --border: #3a2c1c;
    --text: #f3ede2;
    --text-dim: #b0a48e;
    /* tema padrão: "xadrez" (peças em tons de madeira, brancas x pretas) */
    --p0: #d9b872;
    --p0-deep: #a9843f;
    --p0-light: #f0dfa8;
    --p0-soft: rgba(217,184,114,.16);
    --p1: #d6402c;
    --p1-deep: #8f2417;
    --p1-light: #f28468;
    --p1-soft: rgba(214,64,44,.18);
    /* Walls are dark walnut slabs, almost black */
    --wall: #2c1c0c;
    --wall-hi: #4a3118;
    --wall-dim: #1c1206;
    --active: #34d399;
    --active-deep: #0f8f68;
    --board-bg: #150e07;
    --cell-bg: #1c1309;
    --cell-border: rgba(240,210,160,.07);
    --wood-grain: repeating-linear-gradient(93deg,
        rgba(255,214,150,.022) 0 2px, rgba(0,0,0,.05) 2px 5px,
        rgba(255,214,150,.014) 5px 7px, rgba(0,0,0,.032) 7px 11px);
    --wall-ghost-ok: rgba(52,211,153,.60);
    --wall-ghost-bad: rgba(239,68,68,.60);
    --gold: #e8c777;
  }
  /* tema alternativo: azul x vermelho (o esquema original) */
  [data-theme="classic"] {
    --p0: #3b82f6;
    --p0-deep: #1d4ed8;
    --p0-light: #9cc3fd;
    --p0-soft: rgba(59,130,246,.16);
    --p1: #ef4444;
    --p1-deep: #b91c1c;
    --p1-light: #f8b3b3;
    --p1-soft: rgba(239,68,68,.16);
    --wall: #262b33;
    --wall-dim: #14171c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
    user-select: none;
  }

  .app {
    width: 100%;
    max-width: 620px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    gap: 6px;
  }

  /* --- topo: cartões "premium" dos jogadores --- */
  .players-row { display: flex; gap: 8px; flex: 0 0 auto; }
  .player-card {
    flex: 1;
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 6px 14px rgba(0,0,0,.25);
    transition: border-color .18s ease, box-shadow .18s ease, transform .15s ease;
  }
  .player-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--accent, transparent); opacity: .85;
  }
  .player-card.p0 { --accent: linear-gradient(90deg, var(--p0-deep), var(--p0)); }
  .player-card.p1 { --accent: linear-gradient(90deg, var(--p1-deep), var(--p1)); }
  .player-card.active {
    border-color: var(--active);
    box-shadow: 0 0 0 1px var(--active), 0 6px 18px rgba(52,211,153,.18);
    transform: translateY(-1px);
  }
  .player-card.thinking .name .dot { animation: qr-pulse 1.1s ease-in-out infinite; }
  @keyframes qr-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.65); } }
  .player-card.winner {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 6px 18px rgba(232,199,119,.25);
  }
  .player-card.winner .name::after { content: "\1F3C6"; margin-left: 4px; font-size: .8em; }
  .player-card.draw {
    border-color: var(--text-dim);
    box-shadow: 0 0 0 1px var(--text-dim), 0 6px 14px rgba(0,0,0,.15);
  }
  .player-card.draw .name::after { content: " 🤝"; margin-left: 4px; font-size: .8em; }
  .player-card .name {
    font-size: .84rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; display: flex; align-items: center; gap: 7px;
  }
  .player-card .name .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 3px rgba(255,255,255,.05);
  }
  .player-card.p0 .name .dot { background: radial-gradient(circle at 35% 30%, var(--p0-light), var(--p0)); }
  .player-card.p1 .name .dot { background: radial-gradient(circle at 35% 30%, var(--p1-light), var(--p1)); }
  .player-card .meta {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: .76rem; color: var(--text-dim);
  }
  .walls-pill {
    display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: .8rem; color: var(--text);
    background: rgba(255,255,255,.04); border-radius: 7px; padding: 3px 7px 3px 6px;
  }
  .walls-pill .bars { display: inline-flex; gap: 2px; }
  .walls-pill .bars i {
    display: block; width: 4px; height: 11px; border-radius: 2px; background: rgba(255,255,255,.12);
  }
  .player-card.p0 .walls-pill .bars i.on { background: linear-gradient(180deg, var(--p0-light), var(--p0)); }
  .player-card.p1 .walls-pill .bars i.on { background: linear-gradient(180deg, var(--p1-light), var(--p1)); }
  .dist-tag {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    font-variant-numeric: tabular-nums; color: var(--text-dim);
    background: rgba(255,255,255,.04); border-radius: 7px; padding: 2px 8px 3px;
    line-height: 1.05;
  }
  .dist-tag .lbl { font-size: .56rem; text-transform: uppercase; letter-spacing: .04em; opacity: .75; }
  .dist-tag b { color: var(--text); font-weight: 700; font-size: .95rem; }

  /* --- tabuleiro --- */
  .board-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: flex-end; position: relative; }
  #board {
    --cell: 48px; --gap: 8px; --unit: calc(var(--cell) + var(--gap));
    display: grid;
    grid-template-columns: repeat(9, var(--cell));
    grid-template-rows: repeat(9, var(--cell));
    gap: var(--gap);
    background: linear-gradient(180deg, #191007, #100a05);
    padding: 10px;
    border-radius: 12px;
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(240,205,140,.09), inset 0 2px 14px rgba(0,0,0,.85), 0 10px 30px rgba(0,0,0,.65);
  }
  #board.wall-mode { cursor: crosshair; box-shadow: 0 8px 24px rgba(0,0,0,.55), 0 0 0 2px var(--active-deep); }
  .cell {
    background: var(--cell-bg);
    background-image: var(--wood-grain),
        linear-gradient(155deg, rgba(255,206,140,.055) 0%, rgba(0,0,0,0) 42%, rgba(0,0,0,.34) 100%);
    border-radius: 6px;
    box-shadow:
        inset 0 0 0 1px var(--cell-border),
        inset 0 1px 0 rgba(255,214,150,.05),
        inset 0 -2px 5px rgba(0,0,0,.5),
        0 1px 2px rgba(0,0,0,.55);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    cursor: default;
  }
  .cell.dest-hint { cursor: pointer; }
  .cell.dest-hint.p0 { box-shadow: inset 0 0 0 2px var(--p0-soft); background-image: var(--p0-soft), var(--wood-grain); }
  .cell.dest-hint.p1 { box-shadow: inset 0 0 0 2px var(--p1-soft); background-image: var(--p1-soft), var(--wood-grain); }
  .cell.dest-hint.p0::after { content: ""; width: 28%; height: 28%; border-radius: 50%; background: var(--p0); opacity: .38; }
  .cell.dest-hint.p1::after { content: ""; width: 28%; height: 28%; border-radius: 50%; background: var(--p1); opacity: .38; }
  .pawn {
    width: 64%; height: 64%; border-radius: 50%;
    box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.2);
    transition: transform .15s ease;
  }
  .pawn.p0 { background: radial-gradient(circle at 35% 30%, var(--p0-light), var(--p0)); }
  .pawn.p1 { background: radial-gradient(circle at 35% 30%, var(--p1-light), var(--p1)); }

  .wall-slot-h, .wall-slot-v { position: absolute; background: transparent; z-index: 3; border-radius: 3px; pointer-events: none; transition: background .06s ease, box-shadow .06s ease; }
  .wall-slot-h { width: calc(2 * var(--cell) + var(--gap)); height: var(--gap); }
  .wall-slot-v { height: calc(2 * var(--cell) + var(--gap)); width: var(--gap); }
  .wall-slot-h.placed, .wall-slot-v.placed {
    background: linear-gradient(180deg, var(--wall-hi), var(--wall) 55%, var(--wall-dim)) !important;
    box-shadow: inset 0 1px 0 rgba(255,214,150,.16), inset 0 -1px 2px rgba(0,0,0,.7),
                0 2px 5px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.55);
  }
  .wall-slot-h.legal, .wall-slot-v.legal { background: rgba(232,199,119,.22) !important; }
  .wall-slot-h.ghost-ok, .wall-slot-v.ghost-ok {
    background: rgba(74,49,24,.78) !important;
    box-shadow: 0 0 0 2px rgba(52,211,153,.85), 0 0 10px rgba(52,211,153,.35);
  }
  .wall-slot-h.ghost-bad, .wall-slot-v.ghost-bad {
    background: rgba(60,20,12,.45) !important;
    box-shadow: 0 0 0 2px rgba(239,68,68,.85);
  }

  /* --- barra de controles: 4 botões largos, texto sempre colado na base --- */
  .controls { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; margin-top: -8px; }
  .toolbar { display: flex; gap: 8px; align-items: stretch; }
  .tbtn {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 56px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    color: var(--text);
    font-size: .74rem; font-weight: 600;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .08s ease, box-shadow .12s ease;
    touch-action: none;
    padding: 4px 4px 6px;
  }
  .tbtn:active { transform: scale(.96); }
  .tbtn .icon-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .tbtn .tbtn-label { flex: 0 0 auto; line-height: 1; }
  .tbtn .swatch { border-radius: 3px; background: var(--wall-dim); }
  .tbtn.wall.h .swatch { width: 22px; height: 6px; }
  .tbtn.wall.v .swatch { width: 6px; height: 22px; }
  .tbtn.wall.selected {
    border-color: var(--text-dim); background: linear-gradient(180deg, var(--panel-2), var(--border));
    box-shadow: 0 0 0 1px rgba(255,255,255,.28) inset;
  }
  .tbtn.wall.selected .swatch { background: var(--text); }
  .tbtn.wall:disabled, .tbtn.wall.disabled { opacity: .35; cursor: default; pointer-events: none; }
  .tbtn.primary {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-color: var(--border); color: var(--text);
  }
  .tbtn.primary .tbtn-label { font-weight: 800; }

  /* --- histórico de lances --- */
  .movelist {
    flex: 0 0 auto;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    height: 116px;
    overflow-y: auto;
    font-size: .82rem;
    font-variant-numeric: tabular-nums;
  }
  .movelist .row { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
  .movelist .num { color: var(--text-dim); flex: 0 0 auto; width: 20px; }
  .movelist .mv { padding: 1px 6px; border-radius: 5px; color: var(--text-dim); }
  .movelist .mv.p0 { color: var(--p0-light); }
  .movelist .mv.p1 { color: var(--p1-light); }
  .movelist .mv.last { background: var(--panel-2); font-weight: 700; color: var(--text); }
  .movelist .ev { color: var(--gold); font-size: .74rem; margin-left: 3px; font-weight: 700; }
  .movelist .empty { color: var(--text-dim); text-align: center; padding: 8px 0; }

  /* --- modal: nova partida --- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    width: 100%; max-width: 380px; background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border); border-radius: 16px; padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .modal-card h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .modal-label { margin: 14px 0 8px; font-size: .78rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .modal-choices { display: flex; gap: 8px; }
  .choice-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 6px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--panel); color: var(--text); font-size: .82rem; font-weight: 600; cursor: pointer;
  }
  .choice-btn .choice-dot { width: 16px; height: 16px; border-radius: 50%; }
  .choice-btn.p0 .choice-dot { background: radial-gradient(circle at 35% 30%, var(--p0-light), var(--p0)); }
  .choice-btn.p1 .choice-dot { background: radial-gradient(circle at 35% 30%, var(--p1-light), var(--p1)); }
  .choice-btn .choice-sub { font-size: .68rem; color: var(--text-dim); font-weight: 500; }
  .choice-btn.selected { border-color: var(--active); box-shadow: 0 0 0 1px var(--active) inset; background: rgba(52,211,153,.1); }
  .modal-choices.strength .choice-btn { font-size: .95rem; padding: 10px 4px; }
  .theme-swatch { display: flex; gap: 3px; }
  .theme-swatch .sw { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .theme-btn[data-theme="chess"] .sw:first-child { background: radial-gradient(circle at 35% 30%, #f0dfa8, #d9b872); }
  .theme-btn[data-theme="chess"] .sw:last-child { background: radial-gradient(circle at 35% 30%, #c9856a, #a1503c); }
  .theme-btn[data-theme="classic"] .sw:first-child { background: radial-gradient(circle at 35% 30%, #9cc3fd, #3b82f6); }
  .theme-btn[data-theme="classic"] .sw:last-child { background: radial-gradient(circle at 35% 30%, #f8b3b3, #ef4444); }
  .modal-confirm {
    margin-top: 18px; width: 100%; height: 46px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, var(--active), var(--active-deep)); color: #06231a;
    font-weight: 800; font-size: .95rem; cursor: pointer;
  }
  .modal-confirm:active { transform: scale(.98); }

  @media (max-width: 639px) {
    .controls { margin-top: -10px; }
    .movelist { height: 128px; }
  }
  @media (min-width: 640px) { .app { padding-top: 18px; gap: 12px; } }
</style>
</head>
<body>

<div class="app">
  <div class="players-row">
    <div class="player-card p0" id="cardP0">
      <div class="name"><span class="dot"></span><span id="nameP0">Human</span></div>
      <div class="meta">
        <span class="walls-pill"><span class="bars" id="barsP0"></span><span id="walls0">10/10</span></span>
        <span class="dist-tag"><span class="lbl">dist</span><b id="dist0">--</b></span>
      </div>
    </div>
    <div class="player-card p1" id="cardP1">
      <div class="name"><span class="dot"></span><span id="nameP1">Zquoridor</span></div>
      <div class="meta">
        <span class="walls-pill"><span class="bars" id="barsP1"></span><span id="walls1">10/10</span></span>
        <span class="dist-tag"><span class="lbl">dist</span><b id="dist1">--</b></span>
      </div>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div id="board"></div>
  </div>

  <div class="controls">
    <div class="toolbar">
      <button class="tbtn wall h" id="wallH" type="button" title="Horizontal wall — tap or drag on board" aria-label="Horizontal wall">
        <span class="icon-wrap"><span class="swatch"></span></span><span class="tbtn-label">Horizontal</span>
      </button>
      <button class="tbtn wall v" id="wallV" type="button" title="Vertical wall — tap or drag on board" aria-label="Vertical wall">
        <span class="icon-wrap"><span class="swatch"></span></span><span class="tbtn-label">Vertical</span>
      </button>
      <button class="tbtn" id="flipBtn" type="button" title="Flip board" aria-label="Flip board">
        <span class="icon-wrap"><span style="font-size:1.2rem;line-height:1">⇅</span></span><span class="tbtn-label">Flip</span>
      </button>
      <button class="tbtn primary" id="newGame" type="button" title="New Game" aria-label="New Game">
        <span class="icon-wrap"><span style="font-size:1.2rem;line-height:1">↺</span></span><span class="tbtn-label">New Game</span>
      </button>
    </div>

    <div class="movelist" id="movelist">
      <div class="empty"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="newGameModal" hidden>
  <div class="modal-card">
    <h2>New Game</h2>
    <div class="modal-label">Play as</div>
    <div class="modal-choices" id="sideChoices">
      <button class="choice-btn p0" data-side="0" type="button">
        <span class="choice-dot"></span>First<span class="choice-sub" id="sideSubP0">light</span>
      </button>
      <button class="choice-btn p1" data-side="1" type="button">
        <span class="choice-dot"></span>Second<span class="choice-sub" id="sideSubP1">dark</span>
      </button>
    </div>
    <div class="modal-label">Piece Theme</div>
    <div class="modal-choices" id="themeChoices">
      <button class="choice-btn theme-btn" data-theme="chess" type="button">
        <span class="theme-swatch"><span class="sw"></span><span class="sw"></span></span>Wood
      </button>
      <button class="choice-btn theme-btn" data-theme="classic" type="button">
        <span class="theme-swatch"><span class="sw"></span><span class="sw"></span></span>Classic
      </button>
    </div>
    <div class="modal-label">Engine Level</div>
    <div class="modal-choices strength" id="strengthChoices">
      <button class="choice-btn" data-ms="200" type="button">⚡</button>
      <button class="choice-btn" data-ms="500" type="button">⚡⚡</button>
      <button class="choice-btn" data-ms="1500" type="button">⚡⚡⚡</button>
      <button class="choice-btn" data-ms="4000" type="button">⚡⚡⚡⚡</button>
    </div>
    <button class="modal-confirm" id="modalConfirm" type="button">Start</button>
  </div>
</div>

<script src="zquoridor.js"></script>
<script src="app.js"></script>
</body>
</html>
