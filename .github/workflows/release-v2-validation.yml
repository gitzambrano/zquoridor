name: Release 2.00 validation

on:
  push:
    branches:
      - release/v2.00
      - main

permissions:
  contents: write

concurrency:
  group: release-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repository structure and stale paths
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f docs/README.md
          test -f docs/status.md
          test -f docs/plan.md
          test -f docs/datasets.md
          test ! -e readme.md
          test ! -e status.md
          test ! -e plano-zquoridor.md
          test ! -e data/datasets.md
          if git grep -nE 'plano-zquoridor\.md|data/datasets\.md|\breadme\.md\b' -- . ':!.github/workflows/release-v2-validation.yml'; then
            echo "stale documentation path found" >&2
            exit 1
          fi
          stale_status="$(git grep -n 'status\.md' -- ':!docs/**' | grep -v 'docs/status\.md' || true)"
          if [ -n "$stale_status" ]; then
            echo "$stale_status"
            echo "bare status.md references outside docs must use docs/status.md" >&2
            exit 1
          fi
          git diff --check

      - name: Build native protocol and tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/*.sh
          ./build/build_uci.sh
          bash build/build_tests.sh
          python -m py_compile tools/external/local_arena.py tools/external/ponder_gate.py gui_web/test_ponder_worker.py

      - name: Run native regressions
        shell: bash
        run: |
          set -euo pipefail
          ./bin/test_rules_sanity
          ./bin/test_mcab_core
          ./bin/test_time_manager
          if [ -x ./bin/test_policy_ab ]; then ./bin/test_policy_ab; fi
          if [ -x ./bin/test_repetition_diff ]; then ./bin/test_repetition_diff; fi

      - name: Text protocol and ponder smoke
        shell: bash
        run: |
          set -euo pipefail
          {
            echo uci
            echo help
            echo isready
            echo ucinewgame
            echo "position startpos"
            echo "ponder movetime 30"
            echo "go movetime 30"
            echo quit
          } | ./bin/zquoridor --nnue data/nnue/nnue_weights_int8.bin | tee /tmp/zq-uci.log
          grep -q '^uciok$' /tmp/zq-uci.log
          grep -q '^Zquoridor text protocol' /tmp/zq-uci.log
          grep -q '^ponderok ' /tmp/zq-uci.log
          grep -q 'treeHit=1' /tmp/zq-uci.log
          grep -q '^bestmove ' /tmp/zq-uci.log

  wasm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: Build production WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/build_wasm.sh
          ./build/build_wasm.sh
          test -s gui_web/zquoridor.wasm
          test -s gui_web/zquoridor.js
          test -s gui_web/zquoridor.data
          test -s gui_web/zquoridor.html
          test -s index.html
          node --check gui_web/app.js
          node --check gui_web/worker.js
          grep -q '_qr_engine_ponder' gui_web/zquoridor.js

      - name: Install real-browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Ponder and browser regressions
        working-directory: gui_web
        shell: bash
        run: |
          set -euo pipefail
          python test_ponder_worker.py
          python test_gameplay_sim.py
          python test_browser_full.py
          python test_standalone.py

      - name: Check generated product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git diff --exit-code --               gui_web/zquoridor.js gui_web/zquoridor.wasm gui_web/zquoridor.data               gui_web/zquoridor.html index.html
          fi

      - name: Commit verified WebAssembly bundle
        if: github.ref == 'refs/heads/release/v2.00' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zquoridor-release-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -f             gui_web/zquoridor.js gui_web/zquoridor.wasm gui_web/zquoridor.data             gui_web/zquoridor.html index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "WASM bundle already matches sources."
          else
            git commit -m "release: rebuild verified 2.00 WebAssembly [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

  tag:
    if: github.ref == 'refs/heads/main'
    needs: [native, wasm-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version 2.00 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/2.00 >/dev/null; then
            tagged="$(git rev-list -n1 2.00)"
            test "$tagged" = "$GITHUB_SHA"
            echo "Tag 2.00 already points to $GITHUB_SHA"
          else
            git config user.name "zquoridor-release-ci"
            git config user.email "actions@users.noreply.github.com"
            git tag -a 2.00 -m "Zquoridor 2.00"
            git push origin refs/tags/2.00
          fi

      - name: Remove temporary release branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/v2.00 || true
