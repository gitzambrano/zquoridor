name: selfplay-train-smoke

on:
  push:
    branches:
      - infra/engine-lab-v1
    paths:
      - ".github/workflows/selfplay-train-smoke.yml"

permissions:
  contents: read

env:
  TITANIUM_PONDERING: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  titanium-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build exact pinned Titanium
        run: tools/external/build_pinned_titanium.sh titanium-bin

      - name: Verify pinned identity and build Zquoridor adapter
        run: |
          set -euo pipefail
          grep -qx '1ac94755f69799f01b2e06869403e701bbf0bd51' titanium-bin/titanium-sha.txt
          mkdir -p bin results/integration
          g++ -std=c++17 -O3 -DNDEBUG -march=native -pthread -Isrc \
            tools/external/zquoridor_uci.cpp -o bin/zq_main

      - name: Paired 200-ms arena smoke
        run: |
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_main \
            --zq-arg=--nnue \
            --zq-arg=checkpoints/gen8/nnue_weights_int8.bin \
            --titanium ./titanium-bin/titanium \
            --openings tools/external/openings_titanium.jsonl \
            --limit-openings 1 \
            --movetime 200 \
            --workers 1 \
            --json-out results/integration/arena.json \
            --games-out results/integration/arena-games.jsonl

      - name: Architecture-neutral teacher smoke on independent openings
        run: |
          cat > /tmp/teacher-openings.jsonl <<'EOF'
          {"moves":[]}
          {"moves":["d1"]}
          EOF
          python training/teachers/titanium_collect.py \
            --titanium ./titanium-bin/titanium \
            --openings /tmp/teacher-openings.jsonl \
            --out-dir results/integration/teacher \
            --movetime 50 \
            --workers 1 \
            --max-plies 4 \
            --val-mod 2
          test -s results/integration/teacher/manifest.json
          test -s results/integration/teacher/train/opening_000001.jsonl
          test -s results/integration/teacher/val/opening_000000.jsonl

      - name: Verify leakage guard rejects copied benchmark data
        run: |
          cp tools/external/openings_titanium.jsonl /tmp/renamed-benchmark.jsonl
          if python training/teachers/titanium_collect.py \
              --titanium ./titanium-bin/titanium \
              --openings /tmp/renamed-benchmark.jsonl \
              --out-dir /tmp/should-not-exist \
              --movetime 10 --workers 1 --max-plies 1; then
            echo 'ERROR: copied benchmark corpus was accepted as teacher data' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-lab-titanium-integration-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: results/integration/**
