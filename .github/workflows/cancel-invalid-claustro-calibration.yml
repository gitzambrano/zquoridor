name: Cancel Invalid Claustro Calibration

on:
  workflow_dispatch:
  push:
    branches: [exp/claustro-3p2-calibration-20261006]
    paths:
      - ".github/workflows/cancel-invalid-claustro-calibration.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel contaminated run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/37539395499/cancel" || true
