name: Claustrophobia Corrected Real-Time Matrix

on:
  workflow_dispatch:
  push:
    branches: [exp/claustro-3p2-calibration-20261006]
    paths:
      - ".github/workflows/claustro-corrected-realtime-matrix.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MAIN_SHA: 105f6e39b649aa737f258042bd7cd97aea09b358
  CONTACT_WEIGHTS: results/experiments/contact_soup_tri_512/soup_tri_champion/student_int8.bin

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Static real-time contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'sims_per_ms' tools/external/claustrophobia_benchmark_bridge.rs
          ! grep -q 'thread::sleep' tools/external/claustrophobia_benchmark_bridge.rs
          grep -q 'zq_set_search_deadline' tools/external/claustrophobia_benchmark_bridge.rs
          grep -q 'symmetric_clock_adapter' tools/external/local_arena.py
      - name: Probe real wall clock
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from tools.external.bot_setup import ensure_bot
          info=ensure_bot("claustrophobia", build=True)
          p=subprocess.Popen(
              [str(info["benchmark_bridge"]),str(info["checkpoint"]),"200","1.5","cpu","1000000"],
              stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
              text=True,bufsize=1)
          assert p.stdout.readline().strip()=="ready"
          rows=[]
          for budget in (50,200,500):
              p.stdin.write(f"position\t{budget}\t\n"); p.stdin.flush()
              r=json.loads(p.stdout.readline())
              assert "error" not in r, r
              assert r["move_time_ms"]==budget and r["deadline_hit"] is True, r
              assert budget*0.80 <= r["search_ms"] <= budget+max(50,0.25*budget), r
              rows.append(r)
          p.stdin.write("quit\n"); p.stdin.flush(); p.wait(timeout=10)
          assert rows[1]["sims"]>rows[0]["sims"],rows
          assert rows[2]["sims"]>rows[1]["sims"],rows
          print("REAL_TIME_PREFLIGHT_OK",json.dumps(rows))
          PY

  fixed200:
    name: 200ms-${{ matrix.subject }}-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        subject: [prod504, edge504, m100_504, edge858, m100_858]
        book: [normal, center]
        include:
          - {book: normal, openings: tools/external/openings_normal_confirm_400.jsonl, pairs: 50, seed: 20262501}
          - {book: center, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 100, seed: 20262502}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p bin
          case "${{ matrix.subject }}" in
            prod504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -I/tmp/zq-main/src                 /tmp/zq-main/tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            edge504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc                 -DZQ_EXP_EDGE_ACC_CACHE=1 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            m100_504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc                 -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1                 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8                 -DZQ_EXP_RESIDUAL_MASS_PCT=100                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              if [ "${{ matrix.subject }}" = "m100_858" ]; then
                SF="$SF -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              fi
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue ;;
          esac
      - name: Real 200 ms vs Claustrophobia
        shell: bash
        run: |
          python -u tools/run_benchmark.py             --opponents claustrophobia --pairs "${{ matrix.pairs }}" --workers 1             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/claustro-corrected/200/${{ matrix.subject }}/${{ matrix.book }}"             --zq-executable bin/subject --nnue bin/subject.nnue             --zq-move-time-ms 200 --claustrophobia-move-time-ms 200             --claustrophobia-max-sims 1000000 --claustrophobia-device cpu             --max-plies 240 --move-timeout-s 10 --bootstrap 50000 --auto-setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-200-${{ matrix.subject }}-${{ matrix.book }}
          path: results/claustro-corrected/200/${{ matrix.subject }}/${{ matrix.book }}
          retention-days: 30
      - if: always()
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune

  clock3p2:
    name: 3p2-${{ matrix.mode }}-${{ matrix.subject }}-${{ matrix.part }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        mode: [symmetric, production]
        subject: [prod504, edge504]
        part: [n0, n1, c0, c1, c2, c3]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p bin
          if [ "${{ matrix.subject }}" = "prod504" ]; then
            g++ -O3 -DNDEBUG -std=c++17 -pthread -I/tmp/zq-main/src               /tmp/zq-main/tools/external/zquoridor_uci.cpp -o bin/subject
          else
            g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc               -DZQ_EXP_EDGE_ACC_CACHE=1 tools/external/zquoridor_uci.cpp -o bin/subject
          fi
          cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue
      - name: Create deterministic opening shard
        shell: bash
        run: |
          python - <<'PY'
          import random
          from pathlib import Path
          part="${{ matrix.part }}"
          if part.startswith("n"):
              src=Path("tools/external/openings_normal_screen_100.jsonl")
              seed=20262511; idx=int(part[1:]); size=6
          else:
              src=Path("tools/external/openings_center_rush_sound_5k.jsonl")
              seed=20262512; idx=int(part[1:]); size=6
          rows=[x for x in src.read_text().splitlines() if x.strip()]
          random.Random(seed).shuffle(rows)
          sel=rows[idx*size:(idx+1)*size]
          assert len(sel)==size
          Path("clock-shard.jsonl").write_text("\n".join(sel)+"\n")
          PY
      - name: Real 3+2 vs Claustrophobia
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.mode }}" = "symmetric" ]; then EXTRA="--symmetric-clock-adapter"; fi
          python -u tools/run_benchmark.py             --opponents claustrophobia --pairs 6 --workers 1             --seed 20262513 --openings clock-shard.jsonl             --output "results/claustro-corrected/3p2/${{ matrix.mode }}/${{ matrix.subject }}/${{ matrix.part }}"             --zq-executable bin/subject --nnue bin/subject.nnue             --zq-move-time-ms 200 --claustrophobia-move-time-ms 200             --claustrophobia-max-sims 1000000 --claustrophobia-device cpu             --clock-initial-ms 180000 --clock-increment-ms 2000             --max-plies 240 --move-timeout-s 45 --bootstrap 20000             --auto-setup $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-3p2-${{ matrix.mode }}-${{ matrix.subject }}-${{ matrix.part }}
          path: results/claustro-corrected/3p2/${{ matrix.mode }}/${{ matrix.subject }}/${{ matrix.part }}
          retention-days: 30
      - if: always()
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune
