name: Active teacher smoke

on:
  push:
    branches:
      - "exp/teacher-active"
    paths:
      - "training/teachers/**"
      - "training/build_teacher_policy.py"
      - "training/train_teacher_policy.py"
      - "tools/teacher/**"
      - ".github/workflows/teacher-active-smoke.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  TITANIUM_PONDERING: "0"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test teacher helpers
        run: |
          python -m py_compile \
            training/teachers/common.py \
            training/teachers/collect.py \
            training/teachers/titanium_collect.py \
            training/teachers/select_samples.py \
            training/teachers/test_common.py \
            training/teachers/test_collect.py \
            training/build_teacher_policy.py \
            training/train_teacher_policy.py
          python training/teachers/test_common.py
          python training/teachers/test_collect.py
      - name: Build teacher, student, and encoder
        run: |
          set -euo pipefail
          tools/external/build_pinned_titanium.sh titanium-bin
          grep -qx '1ac94755f69799f01b2e06869403e701bbf0bd51' titanium-bin/titanium-sha.txt
          mkdir -p bin smoke
          g++ -std=c++17 -O3 -DNDEBUG -march=native -pthread -Isrc \
            tools/external/zquoridor_uci.cpp -o bin/zq_student
          g++ -std=c++17 -O2 -DNDEBUG -Isrc \
            tools/teacher/encode_position.cpp -o bin/teacher_encode
          test -s checkpoints/gen8/nnue_weights.bin
          test -s checkpoints/gen8/nnue_weights_int8.bin
          printf '%s\n' '{"moves":[]}' > smoke/openings.jsonl
      - name: Collect active teacher trajectory
        run: |
          set -euo pipefail
          python training/teachers/titanium_collect.py \
            --titanium ./titanium-bin/titanium \
            --openings smoke/openings.jsonl \
            --out-dir smoke/raw \
            --budgets 20,30 --repeats 1 \
            --student Zquoridor \
            --student-engine ./bin/zq_student \
            --student-engine-arg=--nnue \
            --student-engine-arg=checkpoints/gen8/nnue_weights_int8.bin \
            --student-movetime 30 \
            --workers 1 --max-plies 110 --val-mod 2
      - name: Verify and select teacher data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path('smoke/raw/manifest.json').read_text())
          assert manifest['schema']=='zquoridor.teacher.manifest.v2', manifest
          assert manifest['games']==1, manifest
          assert manifest['terminations']=={'goal':1}, manifest
          assert manifest['budgets_ms']==[20,30], manifest
          assert manifest['student']['name']=='Zquoridor', manifest
          rows=[]
          for path in Path('smoke/raw').glob('**/opening_*.jsonl'):
              rows += [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert rows, 'no teacher rows'
          assert all(row['schema']=='zquoridor.teacher.raw.v2' for row in rows)
          assert all(len(row['probes'])==2 for row in rows)
          assert all('student_probe' in row for row in rows)
          assert all('student_agrees' in row['diagnostics'] for row in rows)
          rich=sum(bool(isinstance(row.get('rich'),dict) and row['rich'].get('rootMoves')) for row in rows)
          assert rich>0, f'no rich rootMoves across {len(rows)} rows'
          print(json.dumps({
              'rows':len(rows),
              'rich_rows':rich,
              'disagreements':manifest['student']['disagreements'],
              'disagreement_fraction':manifest['student']['disagreement_fraction'],
          }, indent=2))
          PY
          python training/teachers/select_samples.py \
            --corpus smoke/raw --out smoke/disagreements.jsonl \
            --mode disagreement --min-vote 1.0
          python training/teachers/select_samples.py \
            --corpus smoke/raw --out smoke/unstable.jsonl \
            --mode unstable --min-vote 1.0
      - name: Build canonical distillation dataset
        run: |
          set -euo pipefail
          python training/build_teacher_policy.py \
            --corpus smoke/raw --encoder ./bin/teacher_encode \
            --out smoke/teacher_policy.npz
          python - <<'PY'
          import json
          import numpy as np
          d=np.load('smoke/teacher_policy.npz', allow_pickle=False)
          assert len(d['policy_idx']) > 1
          assert int(d['policy_idx'].max()) < 209
          assert len(d['policy_idx']) == len(d['weight'])
          m=json.load(open('smoke/teacher_policy.npz.manifest.json'))
          assert m['samples'] == len(d['policy_idx'])
          assert m['teachers'] == ['Titanium']
          print(json.dumps({'encoded_samples':m['samples'], 'teacher_disagreements':m['student_disagreements']}, indent=2))
          PY
      - name: Install training dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run isolated policy teaching step
        run: |
          set -euo pipefail
          python training/train_teacher_policy.py \
            --data smoke/teacher_policy.npz \
            --init-from checkpoints/gen8/nnue_weights.bin \
            --out smoke/teacher_policy_weights.bin \
            --epochs 1 --batch-size 64 --device cpu
          test -s smoke/teacher_policy_weights.bin
          test -s smoke/teacher_policy_weights_int8.bin
          python - <<'PY'
          import json
          m=json.load(open('smoke/teacher_policy_weights.bin.manifest.json'))
          assert m['mode'] == 'policy-head-only'
          assert m['frozen_value_and_trunk_verified'] is True
          assert m['epochs_ran'] == 1
          print(json.dumps({'mode':m['mode'], 'best_val_loss':m['best_val_loss']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-teacher-smoke-${{ github.run_id }}
          retention-days: 7
          path: smoke/**
