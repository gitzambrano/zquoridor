name: GUI visual audit panels

on:
  push:
    branches: [gui/micro-polish-2026-09]

jobs:
  panel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui/micro-polish-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser setup
        run: |
          python - <<'PY'
          import base64,re
          from pathlib import Path
          t=Path('gui_web/zquoridor.html').read_text(encoding='utf-8')
          m=re.search(r'const __QR_WASM_BYTES__ = __qr_b64ToBytes\("([A-Za-z0-9+/=]+)"\);',t)
          Path('gui_web/zquoridor.wasm').write_bytes(base64.b64decode(m.group(1)))
          PY
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Click panels, controls and scroll settings
        working-directory: gui_web
        run: |
          python dev_server.py 8124 >/tmp/zq-panel-server.log 2>&1 &
          sleep 1
          cat >/tmp/panel_audit.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('panel_audit'); out.mkdir(exist_ok=True)
          R={'errors':[],'desktop':{},'mobile':{}}
          def watch(p):
              p.on('pageerror',lambda e:R['errors'].append('pageerror: '+str(e)))
              p.on('console',lambda m:R['errors'].append('console: '+m.text) if m.type=='error' else None)
          def boot(p):
              p.goto('http://127.0.0.1:8124/style.html')
              p.wait_for_function("() => window.__w && document.querySelector('#status') && !document.querySelector('#status').textContent.includes('Loading')")
              p.wait_for_timeout(300)
          with sync_playwright() as w:
              b=w.chromium.launch()
              c=b.new_context(viewport={'width':1440,'height':900}); p=c.new_page(); watch(p); boot(p)
              p.click("button[data-pane='anPane']"); p.wait_for_timeout(150)
              p.click('#anEngBtn'); p.wait_for_timeout(1200)
              R['desktop']['pv_rows']=p.locator('.pvRow').count()
              p.screenshot(path=str(out/'desktop_analysis.png'),full_page=True)
              p.click("button[data-pane='edPane']"); p.wait_for_timeout(180)
              R['desktop']['editor_visible']=p.is_visible('#edPane')
              p.screenshot(path=str(out/'desktop_editor.png'),full_page=True)
              p.click("button[data-pane='playPane']")
              p.click('#btnPaths'); R['desktop']['paths_on']=p.evaluate("document.querySelector('#btnPaths').classList.contains('on')")
              p.click('#wallH'); R['desktop']['h_armed']=p.evaluate("document.querySelector('#wallH').classList.contains('on')")
              p.click('#wallH'); p.click('#wallV'); R['desktop']['v_armed']=p.evaluate("document.querySelector('#wallV').classList.contains('on')")
              p.click('#wallV')
              p.click('#btnSettings'); p.get_by_role('button',name='Board',exact=True).click(); p.locator('details.advSettings').first.locator('summary').click(); p.wait_for_timeout(150)
              p.screenshot(path=str(out/'desktop_board_settings.png'),full_page=True)
              c.close()

              mc=b.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True); m=mc.new_page(); watch(m); boot(m)
              m.locator('#btnSettings').tap(); m.get_by_role('button',name='Board',exact=True).tap(); m.locator('details.advSettings').first.locator('summary').tap(); m.wait_for_timeout(120)
              scroll=m.evaluate("""() => { let chosen=null; for(const e of document.querySelectorAll('*')) { const s=getComputedStyle(e); if((s.overflowY==='auto'||s.overflowY==='scroll') && e.scrollHeight>e.clientHeight+5 && e.offsetParent!==null){chosen=e;break;} } if(!chosen) return null; const before={cls:chosen.className,id:chosen.id,sh:chosen.scrollHeight,ch:chosen.clientHeight,top:chosen.scrollTop}; chosen.scrollTop=chosen.scrollHeight; return {...before,after:chosen.scrollTop}; }""")
              m.wait_for_timeout(150)
              R['mobile']['settings_scroll']=scroll
              R['mobile']['advanced_visible']=m.locator('details.advSettings[open]').count()>0
              R['mobile']['body_width']=[m.evaluate('document.body.scrollWidth'),390]
              m.screenshot(path=str(out/'mobile_board_settings_scrolled.png'),full_page=True)
              for name in ['Sound','Play & data','Appearance']:
                  m.get_by_role('button',name=name,exact=True).tap(); m.wait_for_timeout(80); R['mobile'][name]=True
              if m.locator('[data-close]').count(): m.locator('[data-close]').first.tap()
              m.locator("#tabBar button[data-pane='anPane']").tap(); m.wait_for_timeout(150); m.locator('#anEngBtn').tap(); m.wait_for_timeout(1200)
              R['mobile']['pv_rows']=m.locator('.pvRow').count()
              m.screenshot(path=str(out/'mobile_analysis_on.png'),full_page=True)
              mc.close(); b.close()
          Path('panel_audit.json').write_text(json.dumps(R,indent=2)); print(json.dumps(R,indent=2))
          PY
          python /tmp/panel_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: gui-panel-visual-audit
          path: |
            gui_web/panel_audit/*.png
            gui_web/panel_audit.json
