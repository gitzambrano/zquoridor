name: Confirm 2.10 vs HEAD against Claustrophobia

on:
  push:
    branches:
      - "bench/confirm-210-head-20260929"
    paths:
      - ".github/workflows/confirm-210-head.yml"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: head
            ref: e0866ab6c9577d5d25cfdf46d5209be0d4edd34c
            book: normal
            openings: tools/external/openings_screen_v1.jsonl
          - version: head
            ref: e0866ab6c9577d5d25cfdf46d5209be0d4edd34c
            book: center
            openings: tools/external/openings_center_rush_50pairs.jsonl
          - version: v210
            ref: a0def30e725b34c19eec07e54719af989f290063
            book: normal
            openings: tools/external/openings_screen_v1.jsonl
          - version: v210
            ref: a0def30e725b34c19eec07e54719af989f290063
            book: center
            openings: tools/external/openings_center_rush_50pairs.jsonl

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy

      - name: Run 100-game paired gate
        env:
          VERSION: ${{ matrix.version }}
          BOOK: ${{ matrix.book }}
          OPENINGS: ${{ matrix.openings }}
        run: |
          python tools/run_benchmark.py \
            --opponents claustrophobia \
            --pairs 50 \
            --workers 2 \
            --seed 20260914 \
            --openings "$OPENINGS" \
            --output "results/benchmarks/confirm_${VERSION}_${BOOK}" \
            --zq-move-time-ms 200 \
            --claustrophobia-move-time-ms 200 \
            --claustrophobia-max-sims 4096 \
            --claustrophobia-cpuct 1.5 \
            --claustrophobia-device cpu \
            --bootstrap 20000

      - uses: actions/upload-artifact@v4
        with:
          name: confirm-${{ matrix.version }}-${{ matrix.book }}
          path: |
            results/benchmarks/confirm_${{ matrix.version }}_${{ matrix.book }}/summary.json
            results/benchmarks/confirm_${{ matrix.version }}_${{ matrix.book }}/games.jsonl
          if-no-files-found: error
          retention-days: 7

  aggregate:
    runs-on: ubuntu-latest
    needs: bench
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: confirm-*
          path: results

      - name: Compare HEAD and 2.10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out={}
          for p in sorted(Path("results").glob("confirm-*/summary.json")):
              key=p.parent.name.replace("confirm-","")
              data=json.loads(p.read_text())
              s=data["summaries"]["claustrophobia"]
              out[key]={
                  "score_pct":s.get("score_pct"),
                  "elo":s.get("elo"),
                  "wins":s.get("wins"),
                  "draws":s.get("draws"),
                  "losses":s.get("losses"),
                  "complete_pairs":s.get("complete_pairs"),
                  "included_games":s.get("included_games"),
                  "failed_games":s.get("failed_games",0),
                  "paired_bootstrap_95":s.get("paired_bootstrap_95"),
              }
          def combined(prefix):
              rows=[out[f"{prefix}-normal"],out[f"{prefix}-center"]]
              games=sum(r.get("included_games") or 0 for r in rows)
              pts=sum((r["score_pct"]/100.0)*(r.get("included_games") or 0) for r in rows)
              return 100*pts/games if games else None
          report={"results":out,"combined":{"head":combined("head"),"v210":combined("v210")}}
          Path("comparison.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: confirm-210-head-comparison
          path: comparison.json
          if-no-files-found: error
          retention-days: 14
