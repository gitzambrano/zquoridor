name: "400 paired games Apex search 4.10 vs 4.01"
on:
  push:
    branches: [exp/apex-policy-upload-h2h-20261114]
    paths:
      - ".github/workflows/apex-search-h2h-400-20261114.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2h:
    name: "${{ matrix.book }}-pairs-${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        book: [normal, center]
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin both C++ search versions and Apex weights
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/zquoridor-401 6e8efb08f7a9442f795f4c3110db3135d70eadf9
          test "$(git -C /tmp/zquoridor-401 rev-parse HEAD)" = "6e8efb08f7a9442f795f4c3110db3135d70eadf9"
          echo "fe8473255fd219fab247b1a7d44be25384a6cfc5daa5c301def49109badb7f2b  data/nnue/nnue_weights_int8.bin" | sha256sum -c -
      - name: Compile both native searches with the same optimization flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          g++ -O3 -DNDEBUG -std=c++17 -pthread -march=native -mavx2 -mfma -I/tmp/zquoridor-401/src \
            /tmp/zquoridor-401/tools/external/zquoridor_uci.cpp -o bin/zquoridor_401
          g++ -O3 -DNDEBUG -std=c++17 -pthread -march=native -mavx2 -mfma -Isrc \
            tools/external/zquoridor_uci.cpp -o bin/zquoridor_410
          python -m py_compile tools/engine_lab/run_apex_policy_h2h.py
      - name: Run 20 paired openings with both colors, no pondering
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/engine_lab/run_apex_policy_h2h.py \
            --candidate bin/zquoridor_410 --baseline bin/zquoridor_401 \
            --candidate-weights data/nnue/nnue_weights_int8.bin \
            --baseline-weights data/nnue/nnue_weights_int8.bin \
            --book-selection "${{ matrix.book }}" \
            --normal-book tools/external/openings_normal_confirm_400.jsonl \
            --center-book tools/external/openings_center_rush_sound_5k.jsonl \
            --pairs-per-book 20 --offset "$(( ${{ matrix.shard }} * 20 ))" \
            --seed 20261117 --move-time-ms 200 \
            --output "results/search400/${{ matrix.book }}/${{ matrix.shard }}"
      - name: Upload complete legal game records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "search400-${{ matrix.book }}-${{ matrix.shard }}"
          path: "results/search400/${{ matrix.book }}/${{ matrix.shard }}/"
          if-no-files-found: warn
          retention-days: 21

  aggregate:
    name: "Check all 400 games and compute paired bootstrap"
    if: always()
    needs: h2h
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all shard game records from this same run
        uses: actions/download-artifact@v4
        with:
          pattern: search400-*
          path: results/search400-shards
          merge-multiple: false
      - name: Fail if any shard failed or any paired game is missing
        shell: bash
        env:
          SHARD_JOB_RESULT: "${{ needs.h2h.result }}"
        run: |
          set -euo pipefail
          test "$SHARD_JOB_RESULT" = "success"
          python -m py_compile tools/engine_lab/summarize_400_search_h2h.py
          python -u tools/engine_lab/summarize_400_search_h2h.py
      - name: Publish aggregated paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search400-aggregate
          path: results/search400-aggregate/
          if-no-files-found: warn
          retention-days: 21
