name: Root win fastpath check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mcab-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Build and run MCAB regression tests
        run: |
          set -euxo pipefail
          mkdir -p bin
          g++ -O2 -std=c++17 -Isrc -o bin/test_mcab_core tests/test_mcab_core.cpp
          ./bin/test_mcab_core
          g++ -O2 -std=c++17 -Isrc -o bin/test_mcab_phase9 tests/test_mcab_phase9.cpp
          ./bin/test_mcab_phase9

      - name: Compare non-winning root microbenchmark with main
        run: |
          set -euxo pipefail
          cat > /tmp/bench_mcab_root.cpp <<'CPP'
          #include <chrono>
          #include <cstdio>
          #include "search.hpp"
          #include "mcab.hpp"
          using namespace qr;
          using Mcab = mcab::MCABSearch<Negamax, State, Move, MoveList, AccPair,
                                         RepetitionTable, SearchStats>;
          int main() {
              Negamax eng;
              eng.setEvalMode(Negamax::EvalMode::NNUE);
              State root = initialState();
              RepetitionTable hist;
              constexpr int kIters = 120;
              auto t0 = std::chrono::steady_clock::now();
              long long totalSims = 0;
              for (int i = 0; i < kIters; ++i) {
                  Mcab search;
                  search.params.nodeBudget = 160;
                  search.params.leafDepth = 0;
                  search.params.treeReuse = false;
                  search.params.evalCache = false;
                  search.params.transpositionGraph = false;
                  SearchStats stats;
                  mcab::McabStats ms;
                  (void)search.chooseMoveMCAB(eng, root, 40, 0, stats, hist, &ms);
                  totalSims += ms.simulations;
              }
              double ms = std::chrono::duration<double, std::milli>(
                              std::chrono::steady_clock::now() - t0).count();
              std::printf("elapsed_ms=%.3f per_call_us=%.3f sims=%lld\n",
                          ms, ms * 1000.0 / kIters, totalSims);
              return 0;
          }
          CPP

          git worktree add /tmp/zq-main origin/main
          g++ -O2 -std=c++17 -I/tmp/zq-main/src /tmp/bench_mcab_root.cpp -o /tmp/bench-main
          g++ -O2 -std=c++17 -Isrc /tmp/bench_mcab_root.cpp -o /tmp/bench-branch

          echo "MAIN"
          /tmp/bench-main | tee /tmp/main-bench.txt
          echo "BRANCH"
          /tmp/bench-branch | tee /tmp/branch-bench.txt
