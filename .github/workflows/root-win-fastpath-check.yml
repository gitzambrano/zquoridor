name: Root win fastpath check

on:
  push:
    branches:
      - fix/root-win-in-1-fastpath-20260921

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native test suite
        shell: bash
        run: |
          set -euo pipefail
          bash build/build_tests.sh

      - name: Run relevant regressions
        shell: bash
        run: |
          set -euo pipefail
          ./bin/test_rules_sanity
          ./bin/test_mcab_core
          ./bin/test_mcab_phase9
          ./bin/test_time_manager
          if [ -x ./bin/test_policy_ab ]; then ./bin/test_policy_ab; fi

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
