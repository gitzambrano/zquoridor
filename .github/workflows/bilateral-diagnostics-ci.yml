name: bilateral-diagnostics-ci

on:
  push:
    branches: [exp/full-accumulator-v2]
    paths:
      - src/nnue.hpp
      - src/rules.hpp
      - tests/test_bilateral_accumulator.cpp
      - tests/wandering_race_suite.cpp
      - benchmarks/bench_bilateral_value.cpp
      - tools/diagnostics/probe_bilateral_value.cpp
      - tools/diagnostics/analyze_bilateral_probe.py
      - .github/workflows/bilateral-diagnostics-ci.yml
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build parity test and diagnostics
        run: |
          mkdir -p bin
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/test_bilateral_accumulator.cpp -o bin/test_bilateral_accumulator
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/wandering_race_suite.cpp -o bin/wandering_race_suite
          g++ -std=c++17 -O3 -DNDEBUG -Isrc benchmarks/bench_bilateral_value.cpp -o bin/bench_bilateral_value
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tools/diagnostics/probe_bilateral_value.cpp -o bin/probe_bilateral_value
          python -m py_compile tools/diagnostics/analyze_bilateral_probe.py
      - name: Run accumulator parity
        run: ./bin/test_bilateral_accumulator
      - name: Run value microbenchmark
        run: ./bin/bench_bilateral_value | tee bilateral-value-bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bilateral-diagnostics
          retention-days: 7
          path: bilateral-value-bench.txt
