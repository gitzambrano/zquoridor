name: Full accumulator architecture smoke

on:
  push:
    branches:
      - exp/full-accumulator
    paths:
      - ".github/workflows/full-accumulator-smoke-temp.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/full-accumulator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply architecture patch
        run: python tools/dev/apply_full_accumulator_patch.py

      - name: Check Python syntax
        run: python -m py_compile training/train_nnue.py training/quantize_nnue.py

      - name: Build correctness suite and self-play
        run: |
          bash build/build_tests.sh
          bash build/build_selfplay.sh

      - name: Install training dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate a small architecture dataset
        run: |
          mkdir -p data/selfplay/full-acc-smoke
          ./bin/selfplay --games 12 --time-ms 5 --threads 2 --max-plies 160 --heuristic --out data/selfplay/full-acc-smoke/selfplay_000.bin
          test -s data/selfplay/full-acc-smoke/selfplay_000.bin

      - name: Train and quantize a fresh full-accumulator network
        run: |
          mkdir -p data/nnue/full-acc-smoke data/checkpoints/full-acc-smoke
          python training/train_nnue.py \
            --fresh \
            --data-sources '[{"path":"data/selfplay/full-acc-smoke/selfplay_000.bin","frac":1.0,"k":1.0}]' \
            --out data/nnue/full-acc-smoke/nnue_weights.bin \
            --ckpt-dir data/checkpoints/full-acc-smoke \
            --plot-dir '' \
            --epochs 1 \
            --batch-size 256 \
            --chunk-size 4096 \
            --device cpu \
            --policy-opening-plies 0 \
            --no-early-stop
          test -s data/nnue/full-acc-smoke/nnue_weights.bin
          test -s data/nnue/full-acc-smoke/nnue_weights_int8.bin

      - name: Validate C++ inference with the new weight layout
        run: |
          ./bin/selfplay --games 2 --time-ms 5 --threads 1 --max-plies 120 \
            --nnue-weights data/nnue/full-acc-smoke/nnue_weights_int8.bin \
            --out data/selfplay/full-acc-candidate/selfplay_000.bin
          test -s data/selfplay/full-acc-candidate/selfplay_000.bin

      - name: Commit validated architecture
        run: |
          rm .github/workflows/full-accumulator-smoke-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nnue.hpp src/search.hpp tools/selfplay/selfplay.hpp training/train_nnue.py training/quantize_nnue.py status.md tools/dev/apply_full_accumulator_patch.py .github/workflows/full-accumulator-smoke-temp.yml
          git commit -m "feat(nnue): add full accumulator heads" -m "Concatenate both 256-wide perspective accumulators for 512-wide value and policy head inputs. Keep the sparse transformer shared and incremental. Update training, quantization, search, and self-play."
          git push origin HEAD:exp/full-accumulator
