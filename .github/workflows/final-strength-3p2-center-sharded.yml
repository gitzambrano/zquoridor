name: Final Strength 3+2 Center Sharded

on:
  workflow_dispatch:
  push:
    branches: [exp/transform-search-v301-20261004]
    paths:
      - ".github/workflows/final-strength-3p2-center-sharded.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MAIN_SHA: 3c8964b6cddac26fa605dcf3a04159bf640d8f87
  CONTACT_WEIGHTS: results/experiments/contact_soup_tri_512/soup_tri_champion/student_int8.bin
  CENTER_OPENINGS: tools/external/openings_center_rush_sound_5k.jsonl
  CENTER_SEED: 20262112

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/run_transform_search_confirmation.py tools/run_benchmark.py tools/external/local_arena.py
          python - <<'PY'
          from pathlib import Path
          p=Path("tools/external/openings_center_rush_sound_5k.jsonl")
          rows=[x for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows) >= 48, len(rows)
          print("center openings:", len(rows))
          PY
          git worktree add /tmp/zq-main "$MAIN_SHA"
          test -s /tmp/zq-main/data/nnue/nnue_weights_int8.bin
          test -s "/tmp/zq-main/$CONTACT_WEIGHTS"
      - if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune

  h2h-center:
    name: h2h3p2-center-${{ matrix.subject }}-s${{ matrix.shard }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        subject: [edge504, m100_504, edge858, m100_858]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Create deterministic Center shard
        shell: bash
        run: |
          python - <<'PY'
          import random
          from pathlib import Path
          src=Path("tools/external/openings_center_rush_sound_5k.jsonl")
          rows=[x for x in src.read_text(encoding="utf-8").splitlines() if x.strip()]
          rng=random.Random(20262112)
          rng.shuffle(rows)
          shard=int("${{ matrix.shard }}")
          selected=rows[shard*12:(shard+1)*12]
          assert len(selected)==12
          Path("center-shard.jsonl").write_text("\n".join(selected)+"\n",encoding="utf-8")
          print("shard",shard,"rows",len(selected))
          PY

      - name: Build Main and candidate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/zq-main "$MAIN_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
          mkdir -p bin
          cp /tmp/zq-main/bin/zquoridor bin/main
          cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/main.nnue
          case "${{ matrix.subject }}" in
            edge504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc                 -DZQ_EXP_EDGE_ACC_CACHE=1                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            m100_504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc                 -DZQ_EXP_EDGE_ACC_CACHE=1                 -DZQ_EXP_RESIDUAL_PUCT=1                 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16                 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8                 -DZQ_EXP_RESIDUAL_MASS_PCT=100                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              if [ "${{ matrix.subject }}" = "m100_858" ]; then
                SF="$SF -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              fi
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue ;;
          esac

      - name: H2H Center 3+2 shard
        shell: bash
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-clock             --name "${{ matrix.subject }}-center-s${{ matrix.shard }}"             --engine-exe bin/subject --main-exe bin/main             --nnue bin/subject.nnue --main-nnue bin/main.nnue             --pairs 12 --workers 1             --base-ms 180000 --increment-ms 2000 --move-overhead-ms 20             --seed "$CENTER_SEED" --openings center-shard.jsonl             --output "results/final-strength-sharded/h2h3p2/${{ matrix.subject }}/center/shard-${{ matrix.shard }}"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharded-h2h3p2-center-${{ matrix.subject }}-s${{ matrix.shard }}
          path: results/final-strength-sharded/h2h3p2/${{ matrix.subject }}/center/shard-${{ matrix.shard }}
          retention-days: 30
      - if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune

  external-center:
    name: ext3p2-center-${{ matrix.subject }}-${{ matrix.opponent }}-s${{ matrix.shard }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        subject: [prod504, edge504, m100_504, edge858, m100_858]
        opponent: [claustrophobia, titanium]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: |
            external_bots/claustrophobia/champion.pt
            ~/.cargo/registry
            ~/.cargo/git
          key: strength-center-shard-${{ runner.os }}-${{ hashFiles('tools/external/bot_setup.py','tools/external/claustrophobia_benchmark_bridge.rs','training/teachers/claustrophobia_ipc_eval.rs','training/teachers/claustrophobia_inference_worker.py') }}
          restore-keys: |
            strength-center-shard-${{ runner.os }}-
      - name: Install Claustrophobia runtime
        if: matrix.opponent == 'claustrophobia'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Create deterministic Center shard
        shell: bash
        run: |
          python - <<'PY'
          import random
          from pathlib import Path
          src=Path("tools/external/openings_center_rush_sound_5k.jsonl")
          rows=[x for x in src.read_text(encoding="utf-8").splitlines() if x.strip()]
          rng=random.Random(20262112)
          rng.shuffle(rows)
          shard=int("${{ matrix.shard }}")
          selected=rows[shard*12:(shard+1)*12]
          assert len(selected)==12
          Path("center-shard.jsonl").write_text("\n".join(selected)+"\n",encoding="utf-8")
          PY

      - name: Build subject
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p bin
          case "${{ matrix.subject }}" in
            prod504)
              (cd /tmp/zq-main && bash build/build_uci.sh)
              cp /tmp/zq-main/bin/zquoridor bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            edge504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc                 -DZQ_EXP_EDGE_ACC_CACHE=1                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            m100_504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc                 -DZQ_EXP_EDGE_ACC_CACHE=1                 -DZQ_EXP_RESIDUAL_PUCT=1                 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16                 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8                 -DZQ_EXP_RESIDUAL_MASS_PCT=100                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              if [ "${{ matrix.subject }}" = "m100_858" ]; then
                SF="$SF -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              fi
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue ;;
          esac

      - name: External Center 3+2 shard
        shell: bash
        run: |
          python -u tools/run_benchmark.py             --opponents "${{ matrix.opponent }}"             --pairs 12 --workers 1             --seed "$CENTER_SEED" --openings center-shard.jsonl             --output "results/final-strength-sharded/ext3p2/${{ matrix.subject }}/${{ matrix.opponent }}/center/shard-${{ matrix.shard }}"             --zq-executable bin/subject --nnue bin/subject.nnue             --zq-move-time-ms 200             --titanium-move-time-ms 200             --claustrophobia-move-time-ms 200             --clock-initial-ms 180000             --clock-increment-ms 2000             --move-timeout-s 30             --auto-setup

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharded-ext3p2-center-${{ matrix.subject }}-${{ matrix.opponent }}-s${{ matrix.shard }}
          path: results/final-strength-sharded/ext3p2/${{ matrix.subject }}/${{ matrix.opponent }}/center/shard-${{ matrix.shard }}
          retention-days: 30
      - if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune
