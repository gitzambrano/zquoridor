name: Sidestep no-tree-reuse A/B

on:
  push:
    branches:
      - "bench/sidestep-root-cause-20260929"
    paths:
      - ".github/workflows/sidestep-no-reuse.yml"

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre210_no_reuse
            ref: a742db9e1f8e7ef71174bc11784706a7508d8e1b
          - label: v210_no_reuse
            ref: a0def30e725b34c19eec07e54719af989f290063
    steps:
      - name: Checkout current harness
        uses: actions/checkout@v4
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy
      - name: Build engine
        run: |
          cd engine
          chmod +x build/build_uci.sh
          ./build/build_uci.sh
      - name: Build identical sidestep book
        run: |
          python - <<'PY'
          import json,random
          from pathlib import Path
          rows=[json.loads(x) for x in Path("tools/external/openings_center_rush_50pairs.jsonl").read_text().splitlines() if x.strip()]
          pool=[r for r in rows if r.get("category")=="sidestep_flank"]
          rng=random.Random(20260928+71); rng.shuffle(pool)
          with open("sidestep20.jsonl","w") as f:
              for i in range(20):
                  r=dict(pool[i%len(pool)])
                  r["opening_index"]=i
                  f.write(json.dumps(r)+"\n")
          PY
      - name: Run 40 games without tree reuse
        run: |
          python tools/run_benchmark.py \
            --opponents claustrophobia \
            --pairs 20 \
            --workers 2 \
            --seed 20260928 \
            --openings sidestep20.jsonl \
            --output "results/benchmarks/${{ matrix.label }}" \
            --zq-executable engine/bin/zquoridor \
            --nnue engine/data/nnue/nnue_weights_int8.bin \
            --zq-arg=--no-tree-reuse \
            --zq-move-time-ms 200 \
            --claustrophobia-move-time-ms 200 \
            --claustrophobia-max-sims 4096 \
            --claustrophobia-cpuct 1.5 \
            --claustrophobia-device cpu \
            --bootstrap 5000
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            results/benchmarks/${{ matrix.label }}/summary.json
            results/benchmarks/${{ matrix.label }}/games.jsonl
          retention-days: 14
