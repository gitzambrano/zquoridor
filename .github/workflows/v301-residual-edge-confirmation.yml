name: V3.01 Residual Edge Deep Confirmation

on:
  workflow_dispatch:
  push:
    branches: [exp/transform-search-v301-20261004]
    paths:
      - ".github/workflows/v301-residual-edge-confirmation.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BASELINE_SHA: 2b8486ec3287c8befa4d24d6962f7fe18818c461

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and weights
        run: |
          grep -q "# Zquoridor 3.01" README.md
          sha256sum data/nnue/nnue_weights_int8.bin
          python -m py_compile tools/run_transform_search_confirmation.py
      - name: Smoke-test combo
        run: |
          mkdir -p bin
          g++ -O2 -std=c++17 -Isrc             -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1             tests/test_mcab_core.cpp -o bin/test_combo
          ./bin/test_combo

  main-fixed:
    name: h2h-combo-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {book: mixed, openings: tools/external/openings_600g_300pairs.jsonl, pairs: 300, seed: 20261201}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 200, seed: 20261202}
          - {book: alternate, openings: tools/external/openings_confirmation_v1.jsonl, pairs: 200, seed: 20261203}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build combo and frozen 3.01
        run: |
          mkdir -p bin
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc             -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1             tools/external/zquoridor_uci.cpp -o bin/zq_combo
          git worktree add /tmp/zq-main "$BASELINE_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
          sha256sum /tmp/zq-main/data/nnue/nnue_weights_int8.bin
      - name: Paired 200ms H2H
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-fixed --name residual_edgeacc_v301             --engine-exe bin/zq_combo             --main-exe /tmp/zq-main/bin/zquoridor             --nnue /tmp/zq-main/data/nnue/nnue_weights_int8.bin             --main-nnue /tmp/zq-main/data/nnue/nnue_weights_int8.bin             --pairs "${{ matrix.pairs }}" --workers 2 --move-time-ms 200             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/v301-residual-edge/main/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v301-resedge-main-${{ matrix.book }}
          path: results/v301-residual-edge/main/${{ matrix.book }}
          retention-days: 14

  external:
    name: ext-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {subject: main301, opponent: claustrophobia, book: mixed, openings: tools/external/openings_600g_300pairs.jsonl, pairs: 200, seed: 20261211}
          - {subject: combo301, opponent: claustrophobia, book: mixed, openings: tools/external/openings_600g_300pairs.jsonl, pairs: 200, seed: 20261211}
          - {subject: main301, opponent: claustrophobia, book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 100, seed: 20261212}
          - {subject: combo301, opponent: claustrophobia, book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 100, seed: 20261212}
          - {subject: main301, opponent: titanium, book: mixed, openings: tools/external/openings_600g_300pairs.jsonl, pairs: 150, seed: 20261213}
          - {subject: combo301, opponent: titanium, book: mixed, openings: tools/external/openings_600g_300pairs.jsonl, pairs: 150, seed: 20261213}
          - {subject: main301, opponent: titanium, book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 100, seed: 20261214}
          - {subject: combo301, opponent: titanium, book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 100, seed: 20261214}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: |
            external_bots/claustrophobia/champion.pt
            ~/.cargo/registry
            ~/.cargo/git
          key: v301-resedge-safe-${{ runner.os }}-${{ hashFiles('tools/external/bot_setup.py', 'tools/external/claustrophobia_benchmark_bridge.rs', 'training/teachers/claustrophobia_ipc_eval.rs', 'training/teachers/claustrophobia_inference_worker.py') }}
          restore-keys: |
            v301-resedge-safe-${{ runner.os }}-
      - name: Install Claustrophobia runtime
        if: matrix.opponent == 'claustrophobia'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject from frozen 3.01
        run: |
          mkdir -p bin
          git worktree add /tmp/zq-main "$BASELINE_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
          if [ "${{ matrix.subject }}" = "main301" ]; then
            cp /tmp/zq-main/bin/zquoridor bin/zq_subject
          else
            g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc               -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1               tools/external/zquoridor_uci.cpp -o bin/zq_subject
          fi
      - name: Same-seed external benchmark
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate external --name "${{ matrix.subject }}"             --engine-exe bin/zq_subject             --nnue /tmp/zq-main/data/nnue/nnue_weights_int8.bin             --pairs "${{ matrix.pairs }}" --workers 1 --move-time-ms 200             --seed "${{ matrix.seed }}" --opponents "${{ matrix.opponent }}"             --openings "${{ matrix.openings }}"             --output "results/v301-residual-edge/external/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v301-resedge-ext-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
          path: results/v301-residual-edge/external/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}
          retention-days: 14

  clock:
    name: 3plus2-combo-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {book: mixed, openings: tools/external/openings_600g_300pairs.jsonl, pairs: 30, seed: 20261221}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 20, seed: 20261222}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build combo and frozen 3.01
        run: |
          mkdir -p bin
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc             -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1             tools/external/zquoridor_uci.cpp -o bin/zq_combo
          git worktree add /tmp/zq-main "$BASELINE_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
      - name: 3+2 paired H2H
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-clock --name residual_edgeacc_v301             --engine-exe bin/zq_combo             --main-exe /tmp/zq-main/bin/zquoridor             --nnue /tmp/zq-main/data/nnue/nnue_weights_int8.bin             --main-nnue /tmp/zq-main/data/nnue/nnue_weights_int8.bin             --pairs "${{ matrix.pairs }}" --workers 1             --base-ms 180000 --increment-ms 2000 --move-overhead-ms 20             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/v301-residual-edge/clock/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v301-resedge-clock-${{ matrix.book }}
          path: results/v301-residual-edge/clock/${{ matrix.book }}
          retention-days: 14

  aggregate:
    name: aggregate
    runs-on: ubuntu-latest
    if: always()
    needs: [main-fixed, external, clock]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v301-resedge-*
          path: artifacts
      - name: Aggregate 3.01 results
        run: |
          python - <<'PY'
          import json, math
          from collections import defaultdict
          from pathlib import Path
          rows=[]
          for p in Path("artifacts").rglob("confirmation_summary.json"):
              d=json.loads(p.read_text())
              base={"name":d["name"],"gate":d["gate"],"book":Path(d["openings"]).name,
                    "pairs":d["pairs"],"seed":d["seed"]}
              if d["gate"].startswith("main"):
                  s=d.get("summary") or {}
                  rows.append({**base,"opponent":"v3.01_main","score_pct":s.get("score_pct"),
                               "elo":s.get("elo"),"games":s.get("included_games"),
                               "failed":s.get("failed_games")})
              else:
                  for opp,s in (d.get("summaries") or {}).items():
                      rows.append({**base,"opponent":opp,"score_pct":s.get("score_pct"),
                                   "elo":s.get("elo"),"games":s.get("included_games"),
                                   "failed":s.get("failed_games")})
          by=defaultdict(dict)
          for r in rows:
              if r["gate"]=="external":
                  by[(r["book"],r["seed"],r["opponent"])][r["name"]]=r
          deltas=[]
          for key,v in sorted(by.items()):
              if "main301" in v and "combo301" in v:
                  deltas.append({"book":key[0],"seed":key[1],"opponent":key[2],
                                 "baseline_pct":v["main301"]["score_pct"],
                                 "combo_pct":v["combo301"]["score_pct"],
                                 "delta_pp":v["combo301"]["score_pct"]-v["main301"]["score_pct"]})
          fixed=[r for r in rows if r["name"]=="residual_edgeacc_v301" and r["gate"]=="main-fixed" and r["score_pct"] is not None]
          games=sum(int(r.get("games") or 0) for r in fixed)
          pooled=None
          if games:
              score=sum(float(r["score_pct"])*int(r.get("games") or 0) for r in fixed)/games
              elo=400*math.log10(score/(100-score)) if 0<score<100 else None
              pooled={"games":games,"score_pct":score,"elo":elo}
          Path("aggregate").mkdir()
          Path("aggregate/summary.json").write_text(json.dumps({
            "release":"3.01",
            "baseline_sha":"2b8486ec3287c8befa4d24d6962f7fe18818c461",
            "pooled_main_fixed":pooled,
            "external_deltas":deltas,
            "rows":rows
          },indent=2)+"\n")
          print("POOLED H2H", pooled)
          print("EXTERNAL DELTAS", deltas)
          for r in rows: print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v301-resedge-aggregate
          path: aggregate/
          retention-days: 14
