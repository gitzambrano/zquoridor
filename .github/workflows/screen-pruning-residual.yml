name: "ZQ 4.01 aggressive pruning - residual PUCT"
on:
  push:
    branches: [exp/prune-residual-401-20261014]
    paths: ["src/**", "tests/**", ".github/workflows/screen-pruning-residual.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.sha }}
      - name: Checkout pinned main 4.01
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: 806a50877f16d6e6f82b65e86d2a27a10916ad13
      - name: Test pawn safety and production MCAB invariants
        run: |
          set -euo pipefail
          mkdir -p candidate/bin baseline/bin
          g++ -O2 -std=c++17 -DZQ_EXP_RESIDUAL_PUCT=1 \
            -DZQ_EXP_RESIDUAL_ROOT_INITIAL=12 -DZQ_EXP_RESIDUAL_INNER_INITIAL=6 \
            -DZQ_EXP_RESIDUAL_MASS_PCT=100 -I candidate/src \
            candidate/tests/test_pw_pawn_visibility.cpp -o candidate/bin/test_residual
          (cd candidate && bin/test_residual)
          g++ -O2 -std=c++17 -DZQ_EXP_RESIDUAL_PUCT=1 \
            -DZQ_EXP_RESIDUAL_ROOT_INITIAL=12 -DZQ_EXP_RESIDUAL_INNER_INITIAL=6 \
            -DZQ_EXP_RESIDUAL_MASS_PCT=100 -I candidate/src \
            candidate/tests/test_mcab_core.cpp -o candidate/bin/test_mcab_residual
          (cd candidate && bin/test_mcab_residual)
      - name: Compile engines with same production NNUE
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma \
            -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=12 \
            -DZQ_EXP_RESIDUAL_INNER_INITIAL=6 -DZQ_EXP_RESIDUAL_MASS_PCT=100 \
            -I candidate/src candidate/tools/external/zquoridor_uci.cpp -o candidate/bin/zq_residual
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma \
            -I baseline/src baseline/tools/external/zquoridor_uci.cpp -o baseline/bin/zq_main
      - name: Paired 200ms Normal (40 games)
        run: |
          cd candidate
          python -u tools/match_finalists.py \
            --engine1-name residual12_6 --engine1-executable bin/zq_residual \
            --engine1-nnue data/nnue/nnue_weights_int8.bin \
            --engine2-name main401 --engine2-executable ../baseline/bin/zq_main \
            --engine2-nnue data/nnue/nnue_weights_int8.bin \
            --openings tools/external/openings_normal_confirm_400.jsonl \
            --pairs 20 --move-time-ms 200 --workers 1 --seed 20261014 \
            --bootstrap 3000 --output results/benchmarks/pruning_401/residual12_6/normal
      - name: Paired 200ms Center Rush (40 games)
        run: |
          cd candidate
          python -u tools/match_finalists.py \
            --engine1-name residual12_6 --engine1-executable bin/zq_residual \
            --engine1-nnue data/nnue/nnue_weights_int8.bin \
            --engine2-name main401 --engine2-executable ../baseline/bin/zq_main \
            --engine2-nnue data/nnue/nnue_weights_int8.bin \
            --openings tools/external/openings_center_rush_sound_5k.jsonl \
            --pairs 20 --move-time-ms 200 --workers 1 --seed 20261014 \
            --bootstrap 3000 --output results/benchmarks/pruning_401/residual12_6/center
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruning-residual12_6-401
          path: candidate/results/benchmarks/pruning_401/
          if-no-files-found: warn
          retention-days: 14
