name: race384 clean recipe smoke
on:
  push:
    branches: ["train/race384-clean-search10-v1"]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned recipe and init weights
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p="experiments/race384-clean-search10-v1/config.json"
          c=json.load(open(p))
          assert c["architecture"]=="race" and c["hidden"]==384
          assert c["epochs"]==40 and c["batch_size"]==4096
          assert c["lr"]==3e-5 and c["trunk_lr_scale"]==0.1
          assert c["data"].endswith("historical2m-search10-conservative/dataset.npz")
          print("clean 384 recipe OK")
          PY
          test -s results/experiments/historical2m-race384-anneal-s20260916/student.bin

      - name: Download small Gen10 replay artifact
        uses: actions/download-artifact@v4
        with:
          name: gen10-search-replay-128-34892170047
          path: /tmp/gen10-replay
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 34892170047
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: End-to-end race384 mini-train
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python training/run_experiment.py \
            --data /tmp/gen10-replay/replay-source.npz \
            --out-dir /tmp/race384-pilot \
            --architecture race --hidden 384 \
            --init-from results/experiments/historical2m-race384-anneal-s20260916/student.bin \
            --init-architecture race --init-hidden 384 \
            --no-from-scratch --qat \
            --epochs 2 --batch-size 512 --lr 1e-5 \
            --schedule constant --warmup-epochs 0 --min-lr 1e-5 \
            --trunk-lr-scale 0.1 --weight-decay 1e-5 \
            --policy-weight 1.0 --value-weight 1.0 --train-scope full \
            --grad-clip 1.0 --patience 2 --seed 20260947 \
            --device cpu --cpu-threads 2 --no-teaching --build --no-benchmark
          test -s /tmp/race384-pilot/student_int8.bin
