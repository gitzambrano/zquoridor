name: Unified Final 200ms and 3+2 Matrix

on:
  workflow_dispatch:
  push:
    branches: [exp/transform-search-v301-20261004]
    paths:
      - ".github/workflows/unified-final-matrix.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MAIN_SHA: 5044720a2fa1c3ef154cc9701a966ad67a07cde7
  CONTACT_WEIGHTS: results/experiments/contact_soup_tri_512/soup_tri_champion/student_int8.bin

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Syntax
        run: python -m py_compile tools/run_transform_search_confirmation.py tools/run_benchmark.py tools/external/local_arena.py

  fixed-vs-main:
    name: fixed-${{ matrix.subject }}-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        subject: [edge504, m100_504, contact858, edge858, m100_858]
        book: [normal, central]
        include:
          - {book: normal, openings: tools/external/openings_normal_confirm_400.jsonl, pairs: 300, seed: 20261901}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 200, seed: 20261902}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build main and subject
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
          mkdir -p bin
          cp /tmp/zq-main/bin/zquoridor bin/main
          cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/main.nnue
          case "${{ matrix.subject }}" in
            edge504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc -DZQ_EXP_EDGE_ACC_CACHE=1 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            m100_504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            contact858|edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF=""
              [ "${{ matrix.subject }}" = "edge858" ] && SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              [ "${{ matrix.subject }}" = "m100_858" ] && SF="-DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue ;;
          esac
      - name: 200ms vs main
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-fixed --name "${{ matrix.subject }}"             --engine-exe bin/subject --main-exe bin/main             --nnue bin/subject.nnue --main-nnue bin/main.nnue             --pairs "${{ matrix.pairs }}" --workers 1 --move-time-ms 200             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/unified-final/fixed/${{ matrix.subject }}/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-fixed-${{ matrix.subject }}-${{ matrix.book }}
          path: results/unified-final/fixed/${{ matrix.subject }}/${{ matrix.book }}
          retention-days: 14

  clock-vs-main:
    name: 3p2-main-${{ matrix.subject }}-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        subject: [edge504, m100_504, contact858, edge858, m100_858]
        book: [normal, central]
        include:
          - {book: normal, openings: tools/external/openings_normal_screen_100.jsonl, pairs: 20, seed: 20261921}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 15, seed: 20261922}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build main and subject
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
          mkdir -p bin
          cp /tmp/zq-main/bin/zquoridor bin/main
          cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/main.nnue
          case "${{ matrix.subject }}" in
            edge504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc -DZQ_EXP_EDGE_ACC_CACHE=1 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            m100_504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            contact858|edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF=""
              [ "${{ matrix.subject }}" = "edge858" ] && SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              [ "${{ matrix.subject }}" = "m100_858" ] && SF="-DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue ;;
          esac
      - name: 3+2 vs main
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-clock --name "${{ matrix.subject }}"             --engine-exe bin/subject --main-exe bin/main             --nnue bin/subject.nnue --main-nnue bin/main.nnue             --pairs "${{ matrix.pairs }}" --workers 1             --base-ms 180000 --increment-ms 2000 --move-overhead-ms 20             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/unified-final/clock/${{ matrix.subject }}/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-3p2-main-${{ matrix.subject }}-${{ matrix.book }}
          path: results/unified-final/clock/${{ matrix.subject }}/${{ matrix.book }}
          retention-days: 14

  external-200:
    name: ext200-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        subject: [prod504, edge504, m100_504, contact858, edge858, m100_858]
        opponent: [claustrophobia, titanium]
        book: [normal, central]
        include:
          - {book: normal, openings: tools/external/openings_normal_confirm_400.jsonl, pairs: 100, seed: 20261911}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 75, seed: 20261912}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Claustrophobia runtime
        if: matrix.opponent == 'claustrophobia'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p bin
          case "${{ matrix.subject }}" in
            prod504)
              (cd /tmp/zq-main && bash build/build_uci.sh)
              cp /tmp/zq-main/bin/zquoridor bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            edge504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc -DZQ_EXP_EDGE_ACC_CACHE=1 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            m100_504)
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100 tools/external/zquoridor_uci.cpp -o bin/subject
              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue ;;
            contact858|edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF=""
              [ "${{ matrix.subject }}" = "edge858" ] && SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              [ "${{ matrix.subject }}" = "m100_858" ] && SF="-DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue ;;
          esac
      - name: 200ms external
        run: |
          python -u tools/run_benchmark.py             --opponents "${{ matrix.opponent }}" --pairs "${{ matrix.pairs }}"             --workers 1 --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/unified-final/external200/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}"             --zq-executable bin/subject --nnue bin/subject.nnue             --zq-move-time-ms 200 --titanium-move-time-ms 200 --claustrophobia-move-time-ms 200             --auto-setup
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-ext200-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
          path: results/unified-final/external200/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}
          retention-days: 14
