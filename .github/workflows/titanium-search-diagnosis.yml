name: titanium-search-diagnosis

on:
  push:
    branches:
      - exp/titanium-search-diagnosis
    paths:
      - ".github/workflows/titanium-search-diagnosis.yml"
      - "tools/external/**"
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: baseline
            zq_args: ""
          - name: pure-ab
            zq_args: "--zq-arg=--no-mcab"
          - name: leaf1
            zq_args: "--zq-arg=--leaf-depth --zq-arg=1"
          - name: leaf2
            zq_args: "--zq-arg=--leaf-depth --zq-arg=2"
          - name: progressive-widening
            zq_args: "--zq-arg=--progressive-widening"
          - name: clear-tt
            zq_args: "--zq-arg=--clear-tt-per-move"
          - name: no-tree-reuse
            zq_args: "--zq-arg=--no-tree-reuse"
          - name: cpuct150
            zq_args: "--zq-arg=--cpuct --zq-arg=1.50"
          - name: scale200
            zq_args: "--zq-arg=--score-scale --zq-arg=200"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Locate weights
        id: weights
        shell: bash
        run: |
          set -euo pipefail
          W="bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin"
          test -s "$W"
          echo "path=$W" >> "$GITHUB_OUTPUT"

      - name: Build pinned Titanium
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/titaniummachine1/titanium-engine.git /tmp/titanium-engine
          git -C /tmp/titanium-engine checkout 1ac94755f69799f01b2e06869403e701bbf0bd51
          RUSTFLAGS="-C target-cpu=native" cargo build --release \
            --manifest-path /tmp/titanium-engine/Cargo.toml --bin titanium

      - name: Build Zquoridor diagnostic adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin results
          g++ -std=c++17 -O3 -DNDEBUG -march=native -pthread \
            -Isrc tools/external/zquoridor_uci.cpp -o bin/zq_diag

      - name: Run ${{ matrix.name }} vs Titanium
        shell: bash
        env:
          W: ${{ steps.weights.outputs.path }}
          TITANIUM_PONDERING: "0"
          VARIANT: ${{ matrix.name }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=( ${{ matrix.zq_args }} )
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_diag --zq-arg=--nnue --zq-arg="$W" \
            "${EXTRA_ARGS[@]}" \
            --titanium /tmp/titanium-engine/target/release/titanium \
            --openings tools/external/openings_titanium.jsonl \
            --limit-openings 20 --movetime 200 --workers 1 \
            --json-out "results/${VARIANT}.json" \
            --games-out "results/${VARIANT}-games.jsonl" \
            | tee "results/${VARIANT}.log"

      - name: Upload ${{ matrix.name }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanium-search-${{ matrix.name }}
          retention-days: 30
          path: results/

  summarize:
    if: always()
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: titanium-search-*
          path: collected

      - name: Compare variants
        shell: bash
        run: |
          python - <<'PY' | tee comparison.txt
          import json
          from pathlib import Path

          rows = []
          for p in Path('collected').glob('**/*.json'):
              if p.name.endswith('-games.json'):
                  continue
              try:
                  d = json.loads(p.read_text())
              except Exception:
                  continue
              if 'wins' not in d:
                  continue
              name = p.stem
              rows.append((name, d))

          rows.sort(key=lambda x: x[1]['score_pct'], reverse=True)
          print(f"{'variant':<22} {'W-D-L':<12} {'score':>7} {'Elo':>9} {'95% Elo':>21} {'back%':>8} {'lat%':>8} {'emptyback':>10}")
          for name, d in rows:
              wdl = f"{d['wins']}-{d['draws']}-{d['losses']}"
              ci = f"[{d['elo_95_low']:+.0f},{d['elo_95_high']:+.0f}]"
              print(f"{name:<22} {wdl:<12} {d['score_pct']:6.1f}% {d['elo']:+8.1f} {ci:>21} {d['zq_backward_pawn_pct']:7.2f}% {d['zq_lateral_pawn_pct']:7.2f}% {d['zq_both_emptyhand_backward_pct']:9.2f}%")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: titanium-search-comparison
          retention-days: 30
          path: comparison.txt
