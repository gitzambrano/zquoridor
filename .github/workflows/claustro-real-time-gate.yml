name: Claustrophobia Real-Time Gate

on:
  workflow_dispatch:
  push:
    branches: [exp/claustro-3p2-calibration-20261006]
    paths:
      - ".github/workflows/claustro-real-time-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static anti-fixed-sims gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'sims_per_ms' tools/external/claustrophobia_benchmark_bridge.rs
          ! grep -q 'thread::sleep' tools/external/claustrophobia_benchmark_bridge.rs
          grep -q 'zq_set_search_deadline' tools/external/claustrophobia_benchmark_bridge.rs
          grep -q 'symmetric_clock_adapter' tools/external/local_arena.py

      - name: Build patched Claustrophobia and probe wall clock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          from tools.external.bot_setup import ensure_bot

          info=ensure_bot("claustrophobia", build=True)
          cmd=[str(info["benchmark_bridge"]), str(info["checkpoint"]),
               "200", "1.5", "cpu", "1000000"]
          p=subprocess.Popen(cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                             stderr=subprocess.PIPE, text=True, bufsize=1)
          assert p.stdout.readline().strip()=="ready"
          rows=[]
          for budget in (50, 200, 500):
              p.stdin.write(f"position\t{budget}\t\n"); p.stdin.flush()
              line=p.stdout.readline().strip()
              row=json.loads(line)
              assert "error" not in row, row
              assert row["move_time_ms"]==budget, row
              assert row["sims"] > 0, row
              assert row["deadline_hit"] is True, row
              # Cooperative stop is checked at MCTS wave boundaries.
              assert row["search_ms"] >= budget * 0.80, row
              assert row["search_ms"] <= budget + max(50, 0.25*budget), row
              rows.append(row)
          p.stdin.write("quit\n"); p.stdin.flush()
          p.wait(timeout=10)
          assert rows[1]["sims"] > rows[0]["sims"], rows
          assert rows[2]["sims"] > rows[1]["sims"], rows
          Path("realtime-probe.json").write_text(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          PY

      - name: Build ZQuoridor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc             tools/external/zquoridor_uci.cpp -o bin/zquoridor
          cp data/nnue/nnue_weights_int8.bin bin/zquoridor.nnue

      - name: Mini fixed 200 ms game gate
        shell: bash
        run: |
          python -u tools/run_benchmark.py             --opponents claustrophobia --pairs 2 --workers 1 --seed 202610061             --openings tools/external/openings_confirmation_v1.jsonl             --output results/realtime-gate/fixed200             --zq-executable bin/zquoridor --nnue bin/zquoridor.nnue             --zq-move-time-ms 200 --claustrophobia-move-time-ms 200             --claustrophobia-max-sims 1000000             --max-plies 80 --move-timeout-s 10 --auto-setup

      - name: Mini symmetric clock gate
        shell: bash
        run: |
          python -u tools/run_benchmark.py             --opponents claustrophobia --pairs 1 --workers 1 --seed 202610062             --openings tools/external/openings_confirmation_v1.jsonl             --output results/realtime-gate/clock             --zq-executable bin/zquoridor --nnue bin/zquoridor.nnue             --zq-move-time-ms 200 --claustrophobia-move-time-ms 200             --claustrophobia-max-sims 1000000             --clock-initial-ms 5000 --clock-increment-ms 500             --symmetric-clock-adapter             --max-plies 50 --move-timeout-s 10 --auto-setup

      - name: Validate recorded timing
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("results/realtime-gate").rglob("games.jsonl"):
              for line in path.read_text().splitlines():
                  if not line.strip(): continue
                  g=json.loads(line)
                  if g.get("status")!="ok": continue
                  for t in g.get("move_times",[]):
                      if t.get("player")!="claustrophobia": continue
                      payload=json.loads(t["search_last"])
                      assert "search_ms" in payload and "deadline_hit" in payload and "sims" in payload
          print("REAL_TIME_GATE_OK")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claustro-real-time-gate
          path: |
            realtime-probe.json
            results/realtime-gate/
          retention-days: 30
