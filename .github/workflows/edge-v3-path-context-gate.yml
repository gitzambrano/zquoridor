name: EdgeAcc V3 Path Context Gate

on:
  workflow_dispatch:
  push:
    branches: [exp/transform-search-v301-20261004]
    paths:
      - ".github/workflows/edge-v3-path-context-gate.yml"

permissions:
  contents: read

env:
  MAIN_SHA: 3c8964b6cddac26fa605dcf3a04159bf640d8f87
  CONTACT_WEIGHTS: results/experiments/contact_soup_tri_512/soup_tri_champion/student_int8.bin

jobs:
  gate:
    name: v3-gate-${{ matrix.net }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        net: [n504, contact858]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Materialize Contact weights
        if: matrix.net == 'contact858'
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p results/experiments/contact_soup_tri_512/soup_tri_champion
          cp "/tmp/zq-main/$CONTACT_WEIGHTS" "$CONTACT_WEIGHTS"

      - name: Build OFF, Edge v1, Edge v3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin out
          FLAGS=""
          WEIGHTS="data/nnue/nnue_weights_int8.bin"
          if [ "${{ matrix.net }}" = "contact858" ]; then
            FLAGS="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
            WEIGHTS="$CONTACT_WEIGHTS"
          fi
          COMMON="-O3 -DNDEBUG -std=c++17 -pthread -Isrc $FLAGS"
          g++ $COMMON tests/test_edge_acc_large_tree.cpp -o bin/off
          g++ $COMMON -DZQ_EXP_EDGE_ACC_CACHE=1 tests/test_edge_acc_large_tree.cpp -o bin/v1
          g++ $COMMON -DZQ_EXP_EDGE_ACC_PATH_CONTEXT=1 tests/test_edge_acc_large_tree.cpp -o bin/v3
          echo "WEIGHTS=$WEIGHTS" >> "$GITHUB_ENV"

      - name: Run and measure
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f "%e" -o out/off.seconds ./bin/off "$WEIGHTS" > out/off.txt
          /usr/bin/time -f "%e" -o out/v1.seconds ./bin/v1 "$WEIGHTS" > out/v1.txt
          /usr/bin/time -f "%e" -o out/v3.seconds ./bin/v3 "$WEIGHTS" > out/v3.txt
          cat out/off.txt
          cat out/v1.txt
          cat out/v3.txt
          echo "OFF=$(cat out/off.seconds)s"
          echo "V1=$(cat out/v1.seconds)s"
          echo "V3=$(cat out/v3.seconds)s"

      - name: Require exact semantic identity
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def rows(path):
              out=[]
              for line in Path(path).read_text().splitlines():
                  if not (line.startswith("CASE ") or line.startswith("REUSE ")):
                      continue
                  kv=dict(re.findall(r'(\w+)=([^ ]+)',line))
                  label=line.split()[1] if line.startswith("CASE ") else "step="+kv["step"]
                  out.append((line.split()[0],label,kv,line))
              return out

          off=rows("out/off.txt")
          v1=rows("out/v1.txt")
          v3=rows("out/v3.txt")
          assert len(off)==len(v1)==len(v3)==10

          common=["nodes","best","pool","sims","expanded","fp","rootN"]
          for name,test in [("v1",v1),("v3",v3)]:
              bad=[]
              for a,b in zip(off,test):
                  fields=common+(["treeHit","reused"] if a[0]=="REUSE" else [])
                  diff={k:(a[2].get(k),b[2].get(k)) for k in fields if a[2].get(k)!=b[2].get(k)}
                  if a[:2]!=b[:2] or diff: bad.append((a[1],diff,a[3],b[3]))
              if bad:
                  for x in bad: print("MISMATCH",name,x)
                  raise SystemExit(f"EDGE_V3_GATE_FAIL variant={name} mismatches={len(bad)}")

          hits=0
          for _,_,kv,_ in v3:
              hits += int(kv.get("hits","0"))
          t={k:float(Path(f"out/{k}.seconds").read_text()) for k in ("off","v1","v3")}
          print("EDGE_V3_GATE_OK checkpoints=10 hits=",hits)
          print("TIMES",t)
          print("V3_vs_V1_speedup", t["v1"]/t["v3"])
          print("V3_vs_OFF_speedup", t["off"]/t["v3"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-v3-path-gate-${{ matrix.net }}
          path: out/
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune
