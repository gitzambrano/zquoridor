name: race wall-regime feature smoke

on:
  push:
    branches: ["features/race10-wall-regime-v1"]
    paths:
      - "training/student_model.py"
      - "training/run_experiment.py"
      - "src/nnue.hpp"
      - "experiments/race10-wall-regime-v1/**"
      - ".github/workflows/race10-wall-regime-smoke.yml"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python smoke dependencies
        run: |
          python -m pip install --quiet numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Python syntax and feature-layout checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile training/student_model.py training/run_experiment.py
          python - <<'PY'
          import sys, numpy as np
          sys.path.insert(0, "training")
          from student_model import encode_features, FEATURES
          data={
              "own_pawn":np.array([4,13],dtype=np.uint8),
              "opp_pawn":np.array([76,67],dtype=np.uint8),
              "walls_h":np.array([0,1],dtype=np.uint64),
              "walls_v":np.array([0,0],dtype=np.uint64),
              "own_dist":np.array([8,2],dtype=np.uint8),
              "opp_dist":np.array([8,12],dtype=np.uint8),
              "walls_left_own":np.array([10,0],dtype=np.uint8),
              "walls_left_opp":np.array([10,8],dtype=np.uint8),
          }
          x=encode_features(data,np.array([0,1]),"race_regime")
          assert FEATURES["race_regime"]==588 and x.shape==(2,588)
          assert x[0,456:].sum()==1 and x[1,456:].sum()==1
          # second row: margin -10 -> bucket 6; own-zero/opponent-positive -> regime 1
          assert x[1,456 + 6*4 + 1] == 1.0
          print("race_regime Python layout OK")
          PY
      - name: C++ compile with race-regime flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          g++ -O2 -std=c++17             -DZQ_NNUE_RACE_FEATURES=1             -DZQ_NNUE_RACE_REGIME_FEATURES=1             -DZQ_NNUE_HIDDEN=512             tests/nnue_incremental_check.cpp -o bin/check-regime
          g++ -O2 -std=c++17 -pthread             -DZQ_NNUE_RACE_FEATURES=1             -DZQ_NNUE_RACE_REGIME_FEATURES=1             -DZQ_NNUE_HIDDEN=512             -Isrc tools/external/zquoridor_uci.cpp -o bin/zq-regime

      - name: Download small Gen10 replay artifact
        uses: actions/download-artifact@v4
        with:
          name: gen10-search-replay-128-34892170047
          path: /tmp/gen10-replay
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 34892170047
      - name: End-to-end mini-train smoke
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/gen10-replay/replay-source.npz
          python training/run_experiment.py \
            --data /tmp/gen10-replay/replay-source.npz \
            --out-dir /tmp/race_regime-pilot \
            --architecture race_regime --hidden 512 \
            --init-from results/experiments/race512-search10-ft-s20260917/student.bin \
            --init-architecture race --init-hidden 512 \
            --no-from-scratch --qat \
            --epochs 2 --batch-size 512 --lr 1e-5 \
            --schedule constant --warmup-epochs 1 --min-lr 1e-5 \
            --trunk-lr-scale 0.1 --weight-decay 1e-5 \
            --policy-weight 1.0 --value-weight 1.0 --train-scope full \
            --grad-clip 1.0 --patience 2 --seed 20260941 \
            --device cpu --cpu-threads 2 \
            --no-teaching --build --no-benchmark
          test -s /tmp/race_regime-pilot/student.bin
          test -s /tmp/race_regime-pilot/student_int8.bin
