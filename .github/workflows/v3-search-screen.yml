name: V3 Search Screening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3-search-screen.yml"
      - "tools/run_v3_search_screening.py"

permissions:
  contents: read

jobs:
  screen:
    name: screen-${{ matrix.candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate:
          - main
          - lmr210
          - lmr200
          - policy_lmr
          - policy_lmr_aggr
          - lmp15
          - lmr_lmp
          - cpuct072
          - full_aggr
          - pw16
          - pw12_full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache external bot build
        uses: actions/cache@v4
        with:
          path: |
            external_bots/claustrophobia/champion.pt
            external_bots/claustrophobia/repo/target
            ~/.cargo/registry
            ~/.cargo/git
          key: v3-screen-claustrophobia-${{ runner.os }}-${{ hashFiles('tools/external/bot_setup.py', 'tools/external/claustrophobia_benchmark_bridge.rs', 'training/teachers/claustrophobia_ipc_eval.rs', 'training/teachers/claustrophobia_inference_worker.py') }}
          restore-keys: |
            v3-screen-claustrophobia-${{ runner.os }}-

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run paired screen
        run: |
          python -u tools/run_v3_search_screening.py \
            --candidate "${{ matrix.candidate }}" \
            --pairs 50 \
            --workers 1 \
            --move-time-ms 200 \
            --seed 20261003

      - name: Upload candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-search-screen-${{ matrix.candidate }}
          path: results/benchmarks/v3-search-aggressive-20261003/${{ matrix.candidate }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: aggregate-screen
    runs-on: ubuntu-latest
    needs: screen
    if: always()
    steps:
      - name: Download screen artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v3-search-screen-*
          path: artifacts

      - name: Build aggregate table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in Path("artifacts").rglob("screen_summary.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              v3 = data.get("vs_v3_main") or {}
              cl = data.get("vs_claustrophobia") or {}
              rows.append({
                  "candidate": data["candidate"],
                  "args": data.get("candidate_args", []),
                  "v3_score_pct": v3.get("score_pct"),
                  "v3_elo": v3.get("elo"),
                  "v3_elo_ci_95": v3.get("elo_ci_95"),
                  "claustrophobia_score_pct": cl.get("score_pct"),
                  "claustrophobia_elo": cl.get("elo"),
                  "claustrophobia_elo_ci_95": cl.get("elo_ci_95"),
                  "v3_failed_games": v3.get("failed_games"),
                  "claustrophobia_failed_games": cl.get("failed_games"),
              })

          rows.sort(
              key=lambda r: (
                  -1e9 if r["v3_score_pct"] is None else -float(r["v3_score_pct"]),
                  r["candidate"],
              )
          )
          Path("aggregate").mkdir()
          Path("aggregate/summary.json").write_text(
              json.dumps({"schema": "zquoridor.v3_search_screen.aggregate.v1", "rows": rows}, indent=2) + "\n",
              encoding="utf-8",
          )

          headers = ["candidate", "vs V3 %", "vs V3 Elo", "vs Claustrophobia %", "vs Claustrophobia Elo"]
          lines = ["| " + " | ".join(headers) + " |", "|" + "|".join(["---"] * len(headers)) + "|"]
          for r in rows:
              def f(v, digits=2):
                  return "—" if v is None else f"{float(v):.{digits}f}"
              lines.append(
                  f"| {r['candidate']} | {f(r['v3_score_pct'])} | {f(r['v3_elo'],1)} | "
                  f"{f(r['claustrophobia_score_pct'])} | {f(r['claustrophobia_elo'],1)} |"
              )
          Path("aggregate/summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: v3-search-screen-aggregate
          path: aggregate/
          retention-days: 14
