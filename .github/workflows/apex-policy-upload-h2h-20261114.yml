name: "Apex uploaded policy identity and paired H2H (200 ms)"
on:
  push:
    branches: [exp/apex-policy-upload-h2h-20261114]
    paths:
      - ".github/workflows/apex-policy-upload-h2h-20261114.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2h:
    name: "${{ matrix.book }}-shard-${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        book: [normal, center]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract official original 4.01 policy from historical repository commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          git show 6e8efb08f7a9442f795f4c3110db3135d70eadf9:data/nnue/nnue_weights_int8.bin > bin/nnue_weights_original401.bin
          echo "45fa3ea7db3127a0b907a23d268b0c55c2020e1018513d54bb920cdbe134abe0  bin/nnue_weights_original401.bin" | sha256sum -c -
          echo "fe8473255fd219fab247b1a7d44be25384a6cfc5daa5c301def49109badb7f2b  data/nnue/nnue_weights_int8.bin" | sha256sum -c -
      - name: Build exactly one v4.10 search executable
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -DNDEBUG -std=c++17 -pthread -march=native -mavx2 -mfma -Isrc \
            tools/external/zquoridor_uci.cpp -o bin/zquoridor_410
          python -m py_compile tools/engine_lab/run_apex_policy_h2h.py
      - name: Paired color-reversal 200ms search with two policy heads
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/engine_lab/run_apex_policy_h2h.py \
            --candidate bin/zquoridor_410 --baseline bin/zquoridor_410 \
            --candidate-weights data/nnue/nnue_weights_int8.bin \
            --baseline-weights bin/nnue_weights_original401.bin \
            --book-selection "${{ matrix.book }}" \
            --pairs-per-book 8 \
            --offset "$(( ${{ matrix.shard }} * 8 ))" \
            --seed 20261114 --move-time-ms 200 \
            --output "results/apex-policy-h2h/${{ matrix.book }}-shard-${{ matrix.shard }}"
      - name: Upload paired games and audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "apex-policy-${{ matrix.book }}-shard-${{ matrix.shard }}"
          path: "results/apex-policy-h2h/${{ matrix.book }}-shard-${{ matrix.shard }}/"
          if-no-files-found: warn
          retention-days: 14
