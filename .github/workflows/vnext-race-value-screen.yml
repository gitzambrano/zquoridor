name: vnext-race-value-screen

on:
  workflow_dispatch:
  push:
    branches:
      - exp/vnext-search-2026-09
    paths:
      - ".github/workflows/vnext-race-value-screen.yml"
      - "tools/experiments/apply_mcab_race_value.py"

jobs:
  screen:
    name: race-value (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: either-b10
            activation: either-empty
            blend: "0.10"
            scale: "1.5"
          - name: either-b20
            activation: either-empty
            blend: "0.20"
            scale: "1.5"
          - name: either-b35
            activation: either-empty
            blend: "0.35"
            scale: "1.5"
          - name: mover-b20
            activation: mover-empty
            blend: "0.20"
            scale: "1.5"
          - name: low2-b20
            activation: total-le2
            blend: "0.20"
            scale: "1.5"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/experiments/apply_mcab_race_value.py \
            --activation '${{ matrix.activation }}' \
            --blend '${{ matrix.blend }}' \
            --tempo-scale '${{ matrix.scale }}'
          git diff --check
          git config user.name "zquoridor-benchmark"
          git config user.email "benchmark@invalid.local"
          git add src/mcab.hpp
          git commit -m "exp(mcab): race-aware leaf value ${{ matrix.name }}"

      - name: Direct head-to-head at 200ms
        shell: bash
        env:
          W: ${{ github.workspace }}/bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin
        run: |
          set -euo pipefail
          test -s "$W"
          mkdir -p results
          python tools/arena/run_arena.py \
            --ref1 HEAD --ref2 HEAD^ \
            --games 240 --report-games 40 --time 200 --threads 14 \
            --seed 202609072 --random-plies 4 \
            --e1-nnue "$W" --e2-nnue "$W" \
            --e1-mcab-no-progressive-widening --e2-mcab-no-progressive-widening \
            2>&1 | tee "results/${{ matrix.name }}.log"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-race-value-${{ matrix.name }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
