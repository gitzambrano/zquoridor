name: vnext-fast-emptyhand-qsearch

on:
  push:
    branches:
      - exp/vnext-search-2026-09
    paths:
      - ".github/workflows/vnext-fast-emptyhand-qsearch.yml"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ab
            extra: "--e1-no-mcab --e2-no-mcab"
          - name: hybrid
            extra: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847
      - name: Materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/experiments/apply_qsearch_emptyhand_pawn.py
          git diff --check
          git config user.name "zquoridor-benchmark"
          git config user.email "benchmark@invalid.local"
          git add src/search.hpp
          git commit -m "exp(search): extend empty-hand qsearch with pawn progress"
      - name: Fast direct screen — ${{ matrix.name }}
        shell: bash
        env:
          W: ${{ github.workspace }}/bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          test -s "$W"
          mkdir -p results
          read -r -a EXTRA_ARGS <<< "$EXTRA"
          python tools/arena/run_arena.py \
            --ref1 HEAD --ref2 HEAD^ \
            --games 160 --report-games 20 --time 200 --threads 14 \
            --seed 202609071 --random-plies 4 \
            --e1-nnue "$W" --e2-nnue "$W" \
            "${EXTRA_ARGS[@]}" \
            2>&1 | tee "results/${{ matrix.name }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-fast-emptyhand-qsearch-${{ matrix.name }}
          retention-days: 30
          path: results/
