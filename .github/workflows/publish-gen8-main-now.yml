name: Publish Gen8 main now

on:
  push:
    branches: [release/gen8-main-publish10]
    paths:
      - '.github/workflows/publish-gen8-main-now.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/gen8-main-publish10
          fetch-depth: 0

      - name: Restore exact Gen8 artifact
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: _gen8_artifact
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Install production weights and checkpoint
        run: |
          set -euo pipefail
          FLOAT=_gen8_artifact/nnue/candidates/gen8-search-ci/nnue_weights.bin
          INT8=_gen8_artifact/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin
          echo 'add43055e32154f76d376c594718cdf1bb09d8f777f55481061e486c1705393c  '"$FLOAT" | sha256sum -c -
          echo 'b03f392ab6d13974149320ec793472b957f613b16070a95863f29e5604359818  '"$INT8" | sha256sum -c -
          mkdir -p data/nnue checkpoints/gen8
          cp "$FLOAT" data/nnue/nnue_weights.bin
          cp "$INT8" data/nnue/nnue_weights_int8.bin
          cp "$FLOAT" checkpoints/gen8/nnue_weights.bin
          cp "$INT8" checkpoints/gen8/nnue_weights_int8.bin
          cp _gen8_artifact/checkpoints/gen8-search-ci-candidate/train_config_*.json checkpoints/gen8/
          cat > checkpoints/gen8/README.md <<'EOF'
          # Gen8 production checkpoint
          Exact Gen8 baseline promoted to main.

          - Source workflow run: `33973129847`
          - Source artifact: `gen8-search-ci-completed` (`9971548567`)
          - Search baseline merged in main: `fix/strong-selfplay-wandering` at `12ea0136e0c1d73ac63847b4d72d0171b4ff9473`
          - Float SHA-256: `add43055e32154f76d376c594718cdf1bb09d8f777f55481061e486c1705393c`
          - Int8 SHA-256: `b03f392ab6d13974149320ec793472b957f613b16070a95863f29e5604359818`
          - Architecture: 354 inputs, hidden 256, policy 209, QA 255, QB 64.

          `nnue_weights.bin` is the recoverable float checkpoint and `nnue_weights_int8.bin` is the production quantized network. The two `train_config_*.json` files are the checkpoint metadata preserved by the original Gen8 run. The original workflow did not upload optimizer/PyTorch state, so no optimizer state is fabricated here.
          EOF
          cat > checkpoints/gen8/PRODUCTION_MANIFEST.txt <<EOF
          generation=Gen8
          source_run=33973129847
          source_artifact=9971548567
          source_search_commit=12ea0136e0c1d73ac63847b4d72d0171b4ff9473
          float_sha256=$(sha256sum data/nnue/nnue_weights.bin | awk '{print $1}')
          int8_sha256=$(sha256sum data/nnue/nnue_weights_int8.bin | awk '{print $1}')
          EOF

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Rebuild standalone web with Gen8
        run: |
          set -euo pipefail
          sed -i 's/^emcc -O3 /em++ -O3 /' build/build_wasm.sh
          sed -i 's/command -v emcc/command -v em++/' build/build_wasm.sh
          sed -i 's/emcc não encontrado/em++ não encontrado/' build/build_wasm.sh
          bash build/build_wasm.sh
          cmp data/nnue/nnue_weights_int8.bin gui_web/zquoridor.data
          node --check gui_web/app.js
          node --check gui_web/board.js
          git diff --check

      - name: Commit published product
        run: |
          set -euo pipefail
          git config user.name "zquoridor-release-ci"
          git config user.email "actions@users.noreply.github.com"
          git add build/build_wasm.sh data/nnue/nnue_weights.bin data/nnue/nnue_weights_int8.bin gui_web/zquoridor.html index.html
          git add -f checkpoints/gen8
          git diff --cached --check
          git commit -m "release: publish Gen8 production engine and checkpoints"
          git push origin HEAD:release/gen8-main-publish10
