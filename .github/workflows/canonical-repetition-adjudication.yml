name: Canonical repetition adjudication

on:
  push:
    branches: ["fix/canonical-repetition-adjudication-v1"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python referee and benchmark tests
        run: |
          python -m unittest tests.test_local_benchmark
          python -m py_compile tools/external/local_arena.py tools/external/titanium_arena.py tools/external/titanium_arena_fixed.py tools/run_benchmark.py
      - name: C++ correctness and arena smoke
        run: |
          bash build/build_tests.sh
          ./bin/test_rules_sanity
          ./bin/test_mcab_core
          python tools/arena/run_arena.py --games 4 --threads 1 --random-plies 8 --time 20 --report-games 2
