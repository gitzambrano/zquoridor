name: Sidestep Critical Divergences

on:
  push:
    branches:
      - "bench/sidestep-root-diagnostic-20260929"
    paths:
      - ".github/workflows/sidestep-critical-divergences.yml"
      - "benchmarks/root_probe_nnue.cpp"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre210
            ref: a742db9e1f8e7ef71174bc11784706a7508d8e1b
          - label: v210
            ref: a0def30e725b34c19eec07e54719af989f290063
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: engine
      - name: Build probe
        run: |
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Iengine/src \
            benchmarks/root_probe_nnue.cpp -o root_probe

      - name: Probe critical histories
        env:
          LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          positions = [
            {
              "id": "28_white_ply20",
              "opening": 28,
              "history": "e2 e8 e3 e7 e4 e6 f4 f6 f5h e6 e4 e6v e3h e5 c3h d5h f4v e8v b4v b6h".split(),
              "pre_move": "d5", "v210_move": "a2h", "nodes": 7200,
              "effect": "pre wins all 4 white games; 2.10 loses all 4"
            },
            {
              "id": "29_black_ply17",
              "opening": 29,
              "history": "e2 e8 e3 e7 e4 e6 d4 e5 d4v c5h e4h e5h g4h a5h g5v d2v g7v".split(),
              "pre_move": "c3h", "v210_move": "c2h", "nodes": 6000,
              "effect": "pre wins all 3 black games; 2.10 loses 2 of 3"
            },
            {
              "id": "32_white_ply10",
              "opening": 32,
              "history": "e2 e8 e3 e7 e4 e6 f4 d6 e4v f6h".split(),
              "pre_move": "f5", "v210_move": "d4h", "nodes": 7150,
              "effect": "pre wins all 3 white games; 2.10 loses all 3"
            },
            {
              "id": "27_black_ply9_gain",
              "opening": 27,
              "history": "e2 e8 e3 e7 e4 e6 d4 d6 d5h".split(),
              "pre_move": "a6h", "v210_move": "c6h", "nodes": 6650,
              "effect": "2.10 gain: current wins all 3; pre loses 1 of 3"
            }
          ]

          out=[]
          for pos in positions:
              cp=subprocess.run(
                  ["./root_probe","engine/data/nnue/nnue_weights_int8.bin","--nodes",str(pos["nodes"]),*pos["history"]],
                  check=True,text=True,capture_output=True)
              parsed={**pos,"label":os.environ["LABEL"],"edges":[]}
              for line in cp.stdout.splitlines():
                  p=line.split("\t")
                  if p[0]=="ROOT":
                      parsed["chosen_20k"]=p[1]; parsed["root_value"]=float(p[2])
                  elif p[0]=="EDGE":
                      parsed["edges"].append({
                        "move":p[1],"prior":float(p[2]),"child_value":float(p[3]),
                        "visits":float(p[4]),"q":float(p[5])
                      })
              out.append(parsed)
          Path("critical.json").write_text(json.dumps(out,indent=2)+"\n")
          for x in out:
              em={e["move"]:e for e in x["edges"]}
              print("POSITION",x["id"],"chosen20k",x["chosen_20k"],"root",x["root_value"])
              for m in [x["pre_move"],x["v210_move"]]:
                  e=em[m]
                  print(" MOVE",m,"P",round(e["prior"],6),"V",round(e["child_value"],6),
                        "N",int(e["visits"]),"Q",round(e["q"],6))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sidestep-critical-${{ matrix.label }}
          path: critical.json
          retention-days: 14

  aggregate:
    runs-on: ubuntu-latest
    needs: probe
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sidestep-critical-*
          path: probes
      - name: Compare critical moves
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(label):
              p=next(Path("probes").glob(f"sidestep-critical-{label}/critical.json"))
              return {x["id"]:x for x in json.loads(p.read_text())}
          a,b=load("pre210"),load("v210")
          report=[]
          for pid in a:
              x,y=a[pid],b[pid]
              ax={e["move"]:e for e in x["edges"]}; by={e["move"]:e for e in y["edges"]}
              row={"id":pid,"opening":x["opening"],"effect":x["effect"],
                   "pre_move":x["pre_move"],"v210_move":x["v210_move"],
                   "root_pre":x["root_value"],"root_v210":y["root_value"],
                   "chosen20k_pre":x["chosen_20k"],"chosen20k_v210":y["chosen_20k"]}
              for tag,m in [("old",x["pre_move"]),("new",x["v210_move"])]:
                  row[tag]={
                    "move":m,
                    "prior_pre":ax[m]["prior"],"prior_v210":by[m]["prior"],
                    "value_pre":ax[m]["child_value"],"value_v210":by[m]["child_value"],
                    "q_pre":ax[m]["q"],"q_v210":by[m]["q"],
                    "visits_pre":ax[m]["visits"],"visits_v210":by[m]["visits"]
                  }
              report.append(row)
          Path("critical_comparison.json").write_text(json.dumps(report,indent=2)+"\n")
          for r in report:
              print("CASE",r["id"],r["effect"])
              print(" root",round(r["root_pre"],4),"->",round(r["root_v210"],4),
                    "20k",r["chosen20k_pre"],"->",r["chosen20k_v210"])
              for tag in ["old","new"]:
                  e=r[tag]
                  print(" ",tag,e["move"],
                    "P",round(e["prior_pre"],4),"->",round(e["prior_v210"],4),
                    "V",round(e["value_pre"],4),"->",round(e["value_v210"],4),
                    "Q",round(e["q_pre"],4),"->",round(e["q_v210"],4),
                    "N",int(e["visits_pre"]),"->",int(e["visits_v210"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sidestep-critical-comparison
          path: critical_comparison.json
          retention-days: 14
