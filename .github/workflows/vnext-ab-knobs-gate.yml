name: vnext-ab-knobs-gate

on:
  push:
    branches:
      - exp/vnext-search-2026-09
    paths:
      - ".github/workflows/vnext-ab-knobs-gate.yml"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qs-one-ply
            e1: "--e1-qs-max-extra 1"
          - name: policy-depth2
            e1: "--e1-policy-order-min-depth 2"
          - name: policy-depth4
            e1: "--e1-policy-order-min-depth 4"
          - name: lmr-safer
            e1: "--e1-lmr-min-depth 4 --e1-lmr-min-move-index 4 --e1-lmr-divisor 2.75"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847
      - name: Direct AB gate — ${{ matrix.name }}
        shell: bash
        env:
          W: ${{ github.workspace }}/bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin
          CANDIDATE: ${{ matrix.e1 }}
        run: |
          set -euo pipefail
          test -s "$W"
          mkdir -p results
          read -r -a CANDIDATE_ARGS <<< "$CANDIDATE"
          python tools/arena/run_arena.py \
            --ref1 HEAD --ref2 HEAD \
            --games 1000 --report-games 50 --time 200 --threads 14 \
            --e1-nnue "$W" --e2-nnue "$W" \
            --e1-no-mcab --e2-no-mcab \
            "${CANDIDATE_ARGS[@]}" \
            2>&1 | tee "results/${{ matrix.name }}.log"
      - name: Extract result
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          python - <<'PY' | tee "results/${NAME}-summary.txt"
          import os, re
          from pathlib import Path
          text=Path(f"results/{os.environ['NAME']}.log").read_text(errors="replace")
          m=re.search(r"Diferenca Elo Engine 1 vs 2\s*:\s*([+-]?\d+(?:\.\d+)?)\s*\(Margem\s*[±+\-]?\s*(\d+(?:\.\d+)?)\)", text)
          if not m: raise SystemExit("could not parse Elo")
          elo=float(m.group(1)); margin=float(m.group(2))
          print(f"candidate Elo = {elo:+.1f} ±{margin:.1f}")
          print(f"lower bound = {elo-margin:+.1f}")
          print("PASS" if elo-margin > 0 else "NOT PROVEN")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-ab-${{ matrix.name }}
          retention-days: 30
          path: results/
