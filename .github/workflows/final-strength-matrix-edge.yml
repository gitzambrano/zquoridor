              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue
              ;;
            edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              if [ "${{ matrix.subject }}" = "m100_858" ]; then
                SF="$SF -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              fi
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue
              ;;
          esac
      - name: Paired external 200 ms
        shell: bash
        run: |
          python -u tools/run_benchmark.py             --opponents "${{ matrix.opponent }}"             --pairs "${{ matrix.pairs }}" --workers 1             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/final-strength/ext200/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}"             --zq-executable bin/subject --nnue bin/subject.nnue             --zq-move-time-ms 200             --titanium-move-time-ms 200             --claustrophobia-move-time-ms 200             --auto-setup
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-ext200-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
          path: results/final-strength/ext200/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}
          retention-days: 30
      - name: Cleanup worktree
        if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune

