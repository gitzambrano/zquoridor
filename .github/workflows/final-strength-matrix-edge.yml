              cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue
              ;;
            edge858|m100_858)
              CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
              SF="-DZQ_EXP_EDGE_ACC_CACHE=1"
              if [ "${{ matrix.subject }}" = "m100_858" ]; then
                SF="$SF -DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
              fi
              g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF                 tools/external/zquoridor_uci.cpp -o bin/subject
              cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue
              ;;
          esac
      - name: Paired H2H native 3+2
        shell: bash
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-clock             --name "${{ matrix.subject }}"             --engine-exe bin/subject --main-exe bin/main             --nnue bin/subject.nnue --main-nnue bin/main.nnue             --pairs "${{ matrix.pairs }}" --workers 1             --base-ms 180000 --increment-ms 2000 --move-overhead-ms 20             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/final-strength/h2h3p2/${{ matrix.subject }}/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-h2h3p2-${{ matrix.subject }}-${{ matrix.book }}
          path: results/final-strength/h2h3p2/${{ matrix.subject }}/${{ matrix.book }}
          retention-days: 30
      - name: Cleanup worktree
        if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/zq-main 2>/dev/null || true
          git worktree prune

  external-200:
    name: ext200-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
    needs: preflight
