    timeout-minutes: 1500
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        subject: [prod504, edge504, m100_504, edge858, m100_858]
        opponent: [claustrophobia, titanium]
        book: [normal, center]
        include:
