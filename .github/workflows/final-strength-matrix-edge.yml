      - uses: dtolnay/rust-toolchain@stable
      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: |
            external_bots/claustrophobia/champion.pt
            ~/.cargo/registry
            ~/.cargo/git
          key: strength-ext-${{ runner.os }}-${{ hashFiles('tools/external/bot_setup.py','tools/external/claustrophobia_benchmark_bridge.rs','training/teachers/claustrophobia_ipc_eval.rs','training/teachers/claustrophobia_inference_worker.py') }}
          restore-keys: |
            strength-ext-${{ runner.os }}-
      - name: Install Claustrophobia runtime
        if: matrix.opponent == 'claustrophobia'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/zq-main "$MAIN_SHA"
