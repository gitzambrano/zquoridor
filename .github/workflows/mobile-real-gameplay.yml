name: Mobile real gameplay

on:
  push:
    branches:
      - test/mobile-real-gameplay

permissions:
  contents: write

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Full existing browser regression
        working-directory: gui_web
        run: python test_browser_full.py

      - name: Real mobile gameplay on source
        working-directory: gui_web
        run: python test_mobile_gameplay.py --page style.html --shots gameplay-shots

      - name: Build standalone
        working-directory: gui_web
        run: python build_standalone.py

      - name: Existing standalone smoke
        working-directory: gui_web
        run: python test_standalone.py

      - name: Real mobile gameplay on standalone
        working-directory: gui_web
        run: python test_mobile_gameplay.py --page zquoridor.html --shots gameplay-shots

      - name: Upload gameplay screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-session-screenshots
          path: gui_web/gameplay-shots/
          if-no-files-found: error

      - name: Commit regenerated standalone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_web/zquoridor.html docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh browser bundle after gameplay gate [skip ci]"
            git push
          fi
