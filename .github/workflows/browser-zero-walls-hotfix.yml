name: Browser zero-wall hotfix

on:
  push:
    branches: [fix/browser-zero-walls-freeze]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-zero-walls-freeze
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply the hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/endgame_race.hpp')
          s = p.read_text(encoding='utf-8')
          old = '    constexpr int NSLOTS = 1024;'
          new = '''#if defined(__EMSCRIPTEN__)\n    // Bound the browser cache. Each allocated slot uses approximately 128 KiB.\n    // A 1024-slot cache can exceed 128 MiB and exhaust the WASM worker.\n    constexpr int NSLOTS = 128;\n#else\n    constexpr int NSLOTS = 1024;\n#endif'''
          assert s.count(old) == 1, 'race cache declaration drifted'
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('gui_web/app.js')
          s = p.read_text(encoding='utf-8-sig')
          old = '''const ANW = {\n  wk: null, ready: false, failed: false,\n  pending: new Map(), nextId: 1,\n  ok() {'''
          new = '''const ANW = {\n  wk: null, ready: false, failed: false,\n  pending: new Map(), nextId: 1,\n  fail(msg) {\n    this.failed = true;\n    this.ready = false;\n    if (this.wk) {\n      try { this.wk.terminate(); } catch (e) { /* worker already stopped */ }\n    }\n    this.wk = null;\n    const callbacks = [...this.pending.values()];\n    this.pending.clear();\n    const err = { type: 'error', msg: msg || 'engine worker stopped' };\n    for (const cb of callbacks) cb(err);\n  },\n  ok() {'''
          assert s.count(old) == 1, 'ANW object header drifted'
          s = s.replace(old, new)

          old = "        if (m.type === 'fatal') { this.failed = true; return; }"
          new = "        if (m.type === 'fatal') { this.fail(m.msg); return; }"
          assert s.count(old) == 1, 'fatal handler drifted'
          s = s.replace(old, new)

          old = "      this.wk.onerror = () => { this.failed = true; };"
          new = "      this.wk.onerror = e => { this.fail((e && e.message) || 'engine worker error'); };"
          assert s.count(old) == 1, 'worker onerror handler drifted'
          s = s.replace(old, new)

          old = "    this.pending.set(id, res => cb(res && res.type !== 'error' ? res : null));"
          new = '''    this.pending.set(id, res => {\n      if (res && res.type === 'error') {\n        if (!this.failed) this.fail(res.msg || 'engine worker search failed');\n        cb(null);\n        return;\n      }\n      cb(res);\n    });'''
          assert s.count(old) == 1, 'bestMove callback drifted'
          s = s.replace(old, new)

          old = "      if (!res || res.move == null) { engineLocalMove(gen, finish); return; }"
          new = '''      if (!res || res.move == null) {\n        if (ANW.failed) {\n          engineThinking = false;\n          syncAll();\n          setStatus('Engine worker stopped - reload to continue');\n          toast('err', 'Engine worker stopped. Reload the page to continue.');\n          return;\n        }\n        engineLocalMove(gen, finish);\n        return;\n      }'''
          assert s.count(old) == 1, 'engine fallback branch drifted'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('status.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 3. History Notes (durable lessons only)\n\n'
          note = '''- **Browser zero-wall freeze hotfix (2026-09-11)**: the exact empty-handed\n  race cache used 1024 lazily allocated slots. Each slot stores four arrays\n  for 13,122 states and uses approximately 128 KiB. A browser worker could\n  therefore retain more than 128 MiB in this cache alone near the final-wall\n  transition. The native engine keeps 1024 slots. Emscripten builds use 128\n  slots, which caps these arrays at approximately 16 MiB without changing\n  solver correctness. The web worker facade now also resolves pending requests\n  when the worker stops. A failed worker search no longer falls through to the\n  same long search on the browser main thread.\n\n'''
          assert marker in s, 'status history marker not found'
          if note not in s:
              s = s.replace(marker, marker + note, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check gui_web/app.js
          git diff --check

      - name: Run race solver tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Isrc tests/test_endgame_race.cpp -o /tmp/test_endgame_race
          /tmp/test_endgame_race
          g++ -std=c++17 -O2 -Isrc tests/test_endgame_race_fuzz.cpp -o /tmp/test_endgame_race_fuzz
          /tmp/test_endgame_race_fuzz

      - name: Stress the Emscripten cache bound
        run: |
          cat >/tmp/race_mem.cpp <<'CPP'
          #include <cstdint>
          #include <cstdio>
          #include "src/endgame_race.hpp"
          int main() {
              uint64_t x = 0x9E3779B97F4A7C15ULL;
              for (int i = 0; i < 1024; ++i) {
                  x ^= x << 7; x ^= x >> 9; x ^= x << 8;
                  uint64_t h = x;
                  x ^= x << 7; x ^= x >> 9; x ^= x << 8;
                  uint64_t v = x;
                  (void)qr::raceExactDTM(h, v, 4, 76, i & 1);
              }
              std::printf("hits=%llu misses=%llu\n",
                          (unsigned long long)qr::g_raceCacheHits,
                          (unsigned long long)qr::g_raceCacheMisses);
              return 0;
          }
          CPP
          g++ -std=c++17 -O2 -D__EMSCRIPTEN__ -I. /tmp/race_mem.cpp -o /tmp/race_mem
          /usr/bin/time -v /tmp/race_mem 2>/tmp/race_mem.time
          cat /tmp/race_mem.time
          python - <<'PY'
          import re
          text = open('/tmp/race_mem.time', encoding='utf-8').read()
          m = re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', text)
          assert m, text
          rss_kib = int(m.group(1))
          print('max_rss_kib=', rss_kib)
          assert rss_kib < 90000, f'Emscripten cache stress used {rss_kib} KiB'
          PY

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.69'
          actions-cache-folder: 'emsdk-cache'

      - name: Rebuild the WASM browser engine
        working-directory: gui_web
        run: |
          em++ @wasm_args.rsp
          python build_standalone.py
          node --check app.js
          node --check worker.js
          git diff --check

      - name: Check the worker failure path in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cd gui_web
          python dev_server.py 8129 >/tmp/zq-hotfix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              p = b.new_page()
              p.goto('http://127.0.0.1:8129/style.html', wait_until='domcontentloaded')
              p.wait_for_function("() => window.__w && document.querySelector('#status') && !document.querySelector('#status').textContent.includes('Loading')", timeout=15000)
              result = p.evaluate("""() => {
                  window.__drained = null;
                  ANW.pending.set(987654, res => { window.__drained = res && res.type; });
                  ANW.fail('synthetic worker failure');
                  return { failed: ANW.failed, ready: ANW.ready,
                           pending: ANW.pending.size, drained: window.__drained };
              }""")
              print(result)
              assert result == {'failed': True, 'ready': False, 'pending': 0, 'drained': 'error'}
              b.close()
          PY

      - name: Commit the verified hotfix
        run: |
          git config user.name "zquoridor-hotfix-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/browser-zero-walls-hotfix.yml
          git add src/endgame_race.hpp gui_web/app.js gui_web/zquoridor.js gui_web/zquoridor.wasm gui_web/zquoridor.data gui_web/zquoridor.html index.html status.md
          git diff --cached --check
          git commit -m "fix(web): bound zero-wall solver memory and worker failure"
          git push origin HEAD:fix/browser-zero-walls-freeze
