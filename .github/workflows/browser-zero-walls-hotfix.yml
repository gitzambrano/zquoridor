name: Browser zero-wall hotfix finalizer

on:
  push:
    branches: [fix/browser-zero-walls-freeze]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-zero-walls-freeze
          fetch-depth: 0

      - name: Apply already-verified source hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/endgame_race.hpp')
          s = p.read_text(encoding='utf-8')
          old = '    constexpr int NSLOTS = 1024;'
          new = '''#if defined(__EMSCRIPTEN__)\n    // Bound the browser cache. Each allocated slot uses approximately 128 KiB.\n    // A 1024-slot cache can exceed 128 MiB and exhaust the WASM worker.\n    constexpr int NSLOTS = 128;\n#else\n    constexpr int NSLOTS = 1024;\n#endif'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('gui_web/app.js')
          s = p.read_text(encoding='utf-8-sig')
          old = '''const ANW = {\n  wk: null, ready: false, failed: false,\n  pending: new Map(), nextId: 1,\n  ok() {'''
          new = '''const ANW = {\n  wk: null, ready: false, failed: false,\n  pending: new Map(), nextId: 1,\n  fail(msg) {\n    this.failed = true;\n    this.ready = false;\n    if (this.wk) {\n      try { this.wk.terminate(); } catch (e) { /* worker already stopped */ }\n    }\n    this.wk = null;\n    const callbacks = [...this.pending.values()];\n    this.pending.clear();\n    const err = { type: 'error', msg: msg || 'engine worker stopped' };\n    for (const cb of callbacks) cb(err);\n  },\n  ok() {'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = "        if (m.type === 'fatal') { this.failed = true; return; }"
          new = "        if (m.type === 'fatal') { this.fail(m.msg); return; }"
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = "      this.wk.onerror = () => { this.failed = true; };"
          new = "      this.wk.onerror = e => { this.fail((e && e.message) || 'engine worker error'); };"
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = "    this.pending.set(id, res => cb(res && res.type !== 'error' ? res : null));"
          new = '''    this.pending.set(id, res => {\n      if (res && res.type === 'error') {\n        if (!this.failed) this.fail(res.msg || 'engine worker search failed');\n        cb(null);\n        return;\n      }\n      cb(res);\n    });'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = "      if (!res || res.move == null) { engineLocalMove(gen, finish); return; }"
          new = '''      if (!res || res.move == null) {\n        if (ANW.failed) {\n          engineThinking = false;\n          syncAll();\n          setStatus('Engine worker stopped - reload to continue');\n          toast('err', 'Engine worker stopped. Reload the page to continue.');\n          return;\n        }\n        engineLocalMove(gen, finish);\n        return;\n      }'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('status.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 3. History Notes (durable lessons only)\n\n'
          note = '''- **Browser zero-wall freeze hotfix (2026-09-11)**: the exact empty-handed\n  race cache used 1024 lazily allocated slots. Each slot stores four arrays\n  for 13,122 states and uses approximately 128 KiB. A browser worker could\n  therefore retain more than 128 MiB in this cache alone near the final-wall\n  transition. The native engine keeps 1024 slots. Emscripten builds use 128\n  slots, which caps these arrays at approximately 16 MiB without changing\n  solver correctness. The web worker facade now also resolves pending requests\n  when the worker stops. A failed worker search no longer falls through to the\n  same long search on the browser main thread.\n\n'''
          assert marker in s
          if note not in s:
              s = s.replace(marker, marker + note, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check gui_web/app.js
          git diff --check

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.69'
          actions-cache-folder: 'emsdk-cache'

      - name: Rebuild browser bundle
        working-directory: gui_web
        run: |
          em++ @wasm_args.rsp
          python build_standalone.py
          python - <<'PY'
          from pathlib import Path
          for name in ('zquoridor.js', 'zquoridor.html', '../index.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              had_nl = text.endswith('\n')
              text = '\n'.join(line.rstrip() for line in text.splitlines())
              if had_nl:
                  text += '\n'
              p.write_text(text, encoding='utf-8')
          PY
          node --check app.js
          node --check worker.js
          git diff --check

      - name: Commit verified hotfix
        run: |
          git config user.name "zquoridor-hotfix-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/browser-zero-walls-hotfix.yml
          git add src/endgame_race.hpp gui_web/app.js gui_web/zquoridor.js gui_web/zquoridor.data gui_web/zquoridor.html index.html status.md
          git add -f gui_web/zquoridor.wasm
          git diff --cached --check
          git commit -m "fix(web): bound zero-wall solver memory and worker failure"
          git push origin HEAD:fix/browser-zero-walls-freeze
