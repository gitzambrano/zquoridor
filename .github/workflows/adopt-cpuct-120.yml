name: adopt-cpuct-120

on:
  push:
    branches: [fix/strong-selfplay-wandering]
    paths: [.github/workflows/adopt-cpuct-120.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strong-selfplay-wandering
          fetch-depth: 0
      - name: Patch production default
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/mcab.hpp')
          s = p.read_text()
          old = 'double cPuct = 1.5;'
          new = 'double cPuct = 1.20;'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('cPuct production default not found')
          p.write_text(s)
          PY
      - name: Compile MCAB regression
        run: |
          mkdir -p bin
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/test_mcab_core.cpp -o bin/test_mcab_core
          ./bin/test_mcab_core
      - name: Commit production search default
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcab.hpp
          git commit -m 'search: lower production cPuct to 1.20'
          git push origin HEAD:fix/strong-selfplay-wandering
