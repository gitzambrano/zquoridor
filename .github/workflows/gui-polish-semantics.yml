name: GUI semantic micro-polish

on:
  push:
    branches:
      - gui/micro-polish-2026-09

permissions:
  contents: write

jobs:
  polish-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gui/micro-polish-2026-09
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply semantic micro-polish
        run: python tools/gui/apply_polish_semantics.py

      - name: JavaScript syntax checks
        run: |
          node --check gui_web/app.js
          node --check gui_web/board.js

      - name: Verify renderer ownership
        run: |
          ! grep -q 'data-board-contrast=.*#board{filter' gui_web/style.html
          ! grep -q '#boardWrap::after' gui_web/style.html
          grep -q "paintMaterialTexture" gui_web/board.js
          grep -q "last-move halo\|haloR" gui_web/board.js
          grep -q "font-size:12px" gui_web/style.html

      - name: Recover generated WASM from current standalone
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          p = Path('gui_web/zquoridor.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'const __QR_WASM_BYTES__ = __qr_b64ToBytes\("([A-Za-z0-9+/=]+)"\);', text)
          if not m:
              raise SystemExit('embedded WASM payload not found')
          wasm = base64.b64decode(m.group(1))
          Path('gui_web/zquoridor.wasm').write_bytes(wasm)
          md = re.search(r'const __QR_DATA_BYTES__ = __qr_b64ToBytes\("([A-Za-z0-9+/=]+)"\)\.buffer;', text)
          if md:
              Path('gui_web/zquoridor.data').write_bytes(base64.b64decode(md.group(1)))
          print(f'recovered zquoridor.wasm ({len(wasm)} bytes)')
          PY

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild standalone and Pages bundle
        run: python gui_web/build_standalone.py

      - name: Run targeted semantic regression
        working-directory: gui_web
        run: python test_micro_polish_semantics.py

      - name: Run complete GUI browser suites
        working-directory: gui_web
        run: |
          python dev_server.py 8123 >/tmp/zq-dev-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          python test_gui_features.py
          python test_deep_click.py
          python test_features_e2e.py
          python test_wall_matrix.py
          python test_gameplay_sim.py
          python test_browser_full.py
          python test_standalone.py

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified semantic polish
        run: |
          git config user.name "zquoridor-gui-polish"
          git config user.email "actions@users.noreply.github.com"
          git add gui_web/style.html gui_web/board.js gui_web/test_micro_polish_semantics.py gui_web/zquoridor.html index.html
          git rm tools/gui/apply_polish_semantics.py .github/workflows/gui-polish-semantics.yml
          git commit -m "gui: finish micro-polish semantics"
          git push origin HEAD:gui/micro-polish-2026-09
