name: "ZQ 4.01 TT fix: production AB gates only"
on:
  push:
    branches: [exp/tt-repetition-gatefix-401-20261014]
    paths:
      - "src/**"
      - "tests/test_tt_repetition_guard.cpp"
      - "tools/generate_ab_gate_openings.py"
      - ".github/workflows/screen-tt-gates-401.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - gate: mover_empty
            baseline_name: prod401
            baseline_ref: 806a50877f16d6e6f82b65e86d2a27a10916ad13
            baseline_macro: "0"
          - gate: both_empty
            baseline_name: prod401
            baseline_ref: 806a50877f16d6e6f82b65e86d2a27a10916ad13
            baseline_macro: "0"
          - gate: mover_empty
            baseline_name: tt_old
            baseline_ref: 452bc5ced79488e49fd20759750ebe0ebc611dbd
            baseline_macro: "1"
          - gate: both_empty
            baseline_name: tt_old
            baseline_ref: 452bc5ced79488e49fd20759750ebe0ebc611dbd
            baseline_macro: "1"
    steps:
      - name: Checkout corrected TT
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.sha }}
      - name: Checkout frozen comparator
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ matrix.baseline_ref }}
      - name: Validate repetition/TT contamination and exact AB gate cases
        run: |
          set -euo pipefail
          mkdir -p candidate/bin baseline/bin
          g++ -O2 -std=c++17 -DZQ_EXP_TT_REPETITION_GUARD=1 \
            -I candidate/src candidate/tests/test_tt_repetition_guard.cpp \
            -o candidate/bin/tt_gate_test
          (cd candidate && bin/tt_gate_test)
          g++ -O2 -std=c++17 -DZQ_EXP_TT_REPETITION_GUARD=1 \
            -I candidate/src candidate/tests/test_repetition_diff.cpp \
            -o candidate/bin/tt_diff_test
          (cd candidate && bin/tt_diff_test)
          (cd candidate && python -u tools/generate_ab_gate_openings.py \
            --gate ${{ matrix.gate }} --count 40 --seed 20261015 \
            --output results/benchmarks/tt_gates_401/book_${{ matrix.gate }}.jsonl)
      - name: Build corrected TT and control binaries using same production NNUE
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma \
            -DZQ_EXP_TT_REPETITION_GUARD=1 -I candidate/src \
            candidate/tools/external/zquoridor_uci.cpp -o candidate/bin/zq_tt_fixed
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma \
            -DZQ_EXP_TT_REPETITION_GUARD=${{ matrix.baseline_macro }} \
            -I baseline/src baseline/tools/external/zquoridor_uci.cpp \
            -o baseline/bin/zq_control
      - name: Paired H2H 200ms at actual production AB gate (60 games)
        run: |
          cd candidate
          python -u tools/match_finalists.py \
            --engine1-name tt_fixed --engine1-executable bin/zq_tt_fixed \
            --engine1-nnue data/nnue/nnue_weights_int8.bin \
            --engine2-name ${{ matrix.baseline_name }} \
            --engine2-executable ../baseline/bin/zq_control \
            --engine2-nnue data/nnue/nnue_weights_int8.bin \
            --openings results/benchmarks/tt_gates_401/book_${{ matrix.gate }}.jsonl \
            --pairs 30 --move-time-ms 200 --workers 1 \
            --seed 20261015 --bootstrap 5000 \
            --output results/benchmarks/tt_gates_401/${{ matrix.gate }}_${{ matrix.baseline_name }}
      - name: Upload proof and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tt-gate-${{ matrix.gate }}-${{ matrix.baseline_name }}
          path: candidate/results/benchmarks/tt_gates_401/
          if-no-files-found: warn
          retention-days: 21
