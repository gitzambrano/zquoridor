name: qsearch-pawn-progress

on:
  push:
    branches: [exp/qsearch-pawn-progress]
    paths:
      - ".github/workflows/qsearch-pawn-progress.yml"
      - "tools/external/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Locate weights
        id: weights
        shell: bash
        run: |
          set -euo pipefail
          W="bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin"
          test -s "$W"
          echo "path=$W" >> "$GITHUB_OUTPUT"

      - name: Build pinned Titanium
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/titaniummachine1/titanium-engine.git /tmp/titanium-engine
          git -C /tmp/titanium-engine checkout 1ac94755f69799f01b2e06869403e701bbf0bd51
          RUSTFLAGS="-C target-cpu=native" cargo build --release \
            --manifest-path /tmp/titanium-engine/Cargo.toml --bin titanium

      - name: Build baseline Zquoridor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin results
          g++ -std=c++17 -O3 -DNDEBUG -march=native -pthread \
            -Isrc tools/external/zquoridor_uci.cpp -o bin/zq_base

      - name: Patch pawn-progress qsearch and build candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/search.hpp')
          s = p.read_text()
          old = '''        if (qply >= effCap) return best;

        if (s.wallsLeft[side] <= 0) return best;  // sem muro pra jogar, nada a estender
'''
          new = '''        if (qply >= effCap) return best;

        // EXPERIMENT: a pawn step that strictly shortens our own shortest
        // path is a noisy move, analogous to Titanium's our_path_gain > 0.
        // Strict progress excludes lateral/backward wandering by construction.
        {
            int sideDistBefore = cachedShortestPathLen(sideCache);
            MoveList pawnMoves;
            pawnStepMoves(s, side, pawnMoves);
            for (size_t i = 0; i < pawnMoves.size(); i++) {
                const Move& m = pawnMoves[i];
                State ns = applyMove(s, m);
                PlayerPathCache sideCacheAfter;
                computeDistCached(ns.wallsH, ns.wallsV, ns.pawn[side], side,
                                  &xdistCache, sideCacheAfter);
                if (cachedShortestPathLen(sideCacheAfter) >= sideDistBefore) continue;

                AccPair* childAcc = nullptr;
                if (curAcc) {
                    childAcc = curAcc + 1;
                    makeChildAccPair(*curAcc, *childAcc, s, m, &xdistCache);
                }
                reptbl.push(ns.hash, /*irreversible=*/false);
                int score = -quiescence(ns, -beta, -localAlpha, qply + 1,
                                        stats, reptbl, !rootParity, childAcc);
                reptbl.pop();
                if (stopped) return 0;
                if (score > best) best = score;
                if (score > localAlpha) localAlpha = score;
                if (localAlpha >= beta) return best;
            }
        }

        if (s.wallsLeft[side] <= 0) return best;
'''
          if old not in s:
              raise SystemExit('qsearch insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
          g++ -std=c++17 -O3 -DNDEBUG -march=native -pthread \
            -Isrc tools/external/zquoridor_uci.cpp -o bin/zq_pawnq

      - name: Baseline wall-q2 — 40 games
        shell: bash
        env:
          W: ${{ steps.weights.outputs.path }}
          TITANIUM_PONDERING: "0"
        run: |
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_base --zq-arg=--nnue --zq-arg="$W" --zq-arg=--no-mcab \
            --titanium /tmp/titanium-engine/target/release/titanium \
            --openings tools/external/openings_titanium.jsonl --limit-openings 20 \
            --movetime 200 --workers 1 --json-out results/base.json \
            --games-out results/base-games.jsonl | tee results/base.log

      - name: Pawn progress q2 — 40 games
        shell: bash
        env:
          W: ${{ steps.weights.outputs.path }}
          TITANIUM_PONDERING: "0"
        run: |
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_pawnq --zq-arg=--nnue --zq-arg="$W" --zq-arg=--no-mcab \
            --zq-arg=--qs-max-extra --zq-arg=2 \
            --titanium /tmp/titanium-engine/target/release/titanium \
            --openings tools/external/openings_titanium.jsonl --limit-openings 20 \
            --movetime 200 --workers 1 --json-out results/pawnq2.json \
            --games-out results/pawnq2-games.jsonl | tee results/pawnq2.log

      - name: Pawn progress q3 — 40 games
        shell: bash
        env:
          W: ${{ steps.weights.outputs.path }}
          TITANIUM_PONDERING: "0"
        run: |
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_pawnq --zq-arg=--nnue --zq-arg="$W" --zq-arg=--no-mcab \
            --zq-arg=--qs-max-extra --zq-arg=3 \
            --titanium /tmp/titanium-engine/target/release/titanium \
            --openings tools/external/openings_titanium.jsonl --limit-openings 20 \
            --movetime 200 --workers 1 --json-out results/pawnq3.json \
            --games-out results/pawnq3-games.jsonl | tee results/pawnq3.log

      - name: Pawn progress q4 — 40 games
        shell: bash
        env:
          W: ${{ steps.weights.outputs.path }}
          TITANIUM_PONDERING: "0"
        run: |
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_pawnq --zq-arg=--nnue --zq-arg="$W" --zq-arg=--no-mcab \
            --zq-arg=--qs-max-extra --zq-arg=4 \
            --titanium /tmp/titanium-engine/target/release/titanium \
            --openings tools/external/openings_titanium.jsonl --limit-openings 20 \
            --movetime 200 --workers 1 --json-out results/pawnq4.json \
            --games-out results/pawnq4-games.jsonl | tee results/pawnq4.log

      - name: Compare
        shell: bash
        run: |
          python - <<'PY' | tee results/comparison.txt
          import json
          for n in ('base','pawnq2','pawnq3','pawnq4'):
              d=json.load(open(f'results/{n}.json'))
              print(n,
                    f"W/D/L={d['wins']}/{d['draws']}/{d['losses']}",
                    f"score={d['score_pct']:.1f}%", f"Elo={d['elo']:+.1f}",
                    f"P0={d['by_color']['0']['score_pct']:.1f}%",
                    f"P1={d['by_color']['1']['score_pct']:.1f}%",
                    f"back={d['zq_backward_pawn_pct']:.2f}%",
                    f"emptyBack={d['zq_both_emptyhand_backward_pct']:.2f}%")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsearch-pawn-progress-validation
          retention-days: 30
          path: results/
