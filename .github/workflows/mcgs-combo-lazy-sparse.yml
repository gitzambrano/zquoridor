name: "MCGS combination lazy-sparse: 200ms H2H and Claustrophobia"
on:
  push:
    branches: [exp/mcgs-lazy-sparse-20261018]
    paths: [.github/workflows/mcgs-combo-lazy-sparse.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict independent oracles and production MCAB regressions
        run: |
          set -euo pipefail
          mkdir -p bin
          g++ -O2 -std=c++17 -march=native -mavx2 -mfma -DZQ_EXP_SPARSE_POLICY=1  -I src tests/test_mcgs_opt_correctness.cpp -o bin/test_lazy
          g++ -O2 -std=c++17 -march=native -mavx2 -mfma -DZQ_EXP_SPARSE_POLICY=1  -I src tests/test_mcgs_sparse_equivalence.cpp -o bin/test_sparse_exact
          g++ -O2 -std=c++17 -march=native -mavx2 -mfma -DZQ_EXP_SPARSE_POLICY=1  -I src tests/test_mcab_core.cpp -o bin/test_mcab_core
      - name: Correctness gate including all legal logits, both mirrored perspectives, and PUCT sum invariants
        run: |
          set -euo pipefail
          bin/test_lazy
          bin/test_sparse_exact
          bin/test_mcab_core
  matched-games:
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - family: normal
            kind: h2h
            opponent: main
            engine: candidate
            pairs: 100
            source: tools/external/openings_normal_confirm_400.jsonl
          - family: normal
            kind: h2h
            opponent: lazy
            engine: candidate
            pairs: 50
            source: tools/external/openings_normal_confirm_400.jsonl
          - family: normal
            kind: external
            opponent: claustrophobia
            engine: candidate
            pairs: 50
            source: tools/external/openings_normal_confirm_400.jsonl
          - family: normal
            kind: external
            opponent: claustrophobia
            engine: main
            pairs: 50
            source: tools/external/openings_normal_confirm_400.jsonl
          - family: normal
            kind: external
            opponent: claustrophobia
            engine: lazy
            pairs: 50
            source: tools/external/openings_normal_confirm_400.jsonl
          - family: center
            kind: h2h
            opponent: main
            engine: candidate
            pairs: 100
            source: tools/external/openings_center_rush_sound_5k.jsonl
          - family: center
            kind: h2h
            opponent: lazy
            engine: candidate
            pairs: 50
            source: tools/external/openings_center_rush_sound_5k.jsonl
          - family: center
            kind: external
            opponent: claustrophobia
            engine: candidate
            pairs: 50
            source: tools/external/openings_center_rush_sound_5k.jsonl
          - family: center
            kind: external
            opponent: claustrophobia
            engine: main
            pairs: 50
            source: tools/external/openings_center_rush_sound_5k.jsonl
          - family: center
            kind: external
            opponent: claustrophobia
            engine: lazy
            pairs: 50
            source: tools/external/openings_center_rush_sound_5k.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 50a3237ea249c30077ee1e21d7902aa48d125f6d
      - uses: actions/checkout@v4
        with:
          path: lazy
          ref: 082abc4df338a3c46340aa7c77707c1259f7db16
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.kind == 'external'
      - name: Install Claustrophobia CPU inference
        if: matrix.kind == 'external'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build candidate and BOTH frozen control engines with matching ISA/weights
        run: |
          set -euo pipefail
          mkdir -p candidate/bin baseline/bin lazy/bin
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma -DZQ_EXP_SPARSE_POLICY=1 -I candidate/src candidate/tools/external/zquoridor_uci.cpp -o candidate/bin/zq_combo
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma -I baseline/src baseline/tools/external/zquoridor_uci.cpp -o baseline/bin/zq_main
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma -I lazy/src lazy/tools/external/zquoridor_uci.cpp -o lazy/bin/zq_lazy
      - name: Prepare identically seeded fresh openings without screening/previous-deep positions
        run: |
          set -euo pipefail
          cd candidate
          python -u tools/make_mcgs_followup_book.py \
            --source ${{ matrix.source }} --pairs 100 --seed 20261105 \
            --output results/benchmarks/mcgs_combos/book_${{ matrix.family }}.jsonl
      - name: Direct candidate H2H versus frozen main or frozen Lazy (same 200ms for both)
        if: matrix.kind == 'h2h'
        run: |
          set -euo pipefail
          cd candidate
          if [ "${{ matrix.opponent }}" = "main" ]; then
            opponent_exe=../baseline/bin/zq_main
          else
            opponent_exe=../lazy/bin/zq_lazy
          fi
          python -u tools/match_finalists.py \
            --engine1-name lazy-sparse --engine1-executable bin/zq_combo \
            --engine1-nnue data/nnue/nnue_weights_int8.bin \
            --engine2-name ${{ matrix.opponent }} --engine2-executable "$opponent_exe" \
            --engine2-nnue data/nnue/nnue_weights_int8.bin \
            --openings results/benchmarks/mcgs_combos/book_${{ matrix.family }}.jsonl \
            --pairs ${{ matrix.pairs }} --move-time-ms 200 --workers 1 \
            --seed 20261106 --bootstrap 10000 \
            --output results/benchmarks/mcgs_combos/lazy-sparse/h2h/${{ matrix.opponent }}/${{ matrix.family }}
      - name: Candidate/main/Lazy vs exact same pinned Claustrophobia CPU (200ms real movetime)
        if: matrix.kind == 'external'
        run: |
          set -euo pipefail
          cd candidate
          case "${{ matrix.engine }}" in
            candidate) exe=bin/zq_combo;;
            main) exe=../baseline/bin/zq_main;;
            lazy) exe=../lazy/bin/zq_lazy;;
            *) exit 2;;
          esac
          python -u tools/run_benchmark.py \
            --opponents claustrophobia --pairs 50 --workers 1 \
            --openings results/benchmarks/mcgs_combos/book_${{ matrix.family }}.jsonl \
            --zq-executable "$exe" --nnue data/nnue/nnue_weights_int8.bin \
            --zq-move-time-ms 200 --claustrophobia-move-time-ms 200 \
            --claustrophobia-device cpu --clock-initial-ms 0 --max-plies 240 \
            --seed 20261106 --bootstrap 10000 \
            --output results/benchmarks/mcgs_combos/lazy-sparse/claustrophobia/${{ matrix.engine }}/${{ matrix.family }}
      - name: Require exactly the expected complete paired games, correct engines and clocks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("candidate/results/benchmarks/mcgs_combos/lazy-sparse")
          family="${{ matrix.family }}"
          kind="${{ matrix.kind }}"
          if kind=="h2h":
              opp="${{ matrix.opponent }}"
              r=json.loads((root/"h2h"/opp/family/"summary.json").read_text())
              assert r["engine1"]=="lazy-sparse" and r["engine2"]==opp
              assert r["move_time_ms"]==200 and r["base_ms"]==0 and r["increment_ms"]==0
              games=2*int("${{ matrix.pairs }}")
              s=r["summary"]
          else:
              r=json.loads((root/"claustrophobia"/"${{ matrix.engine }}"/family/"summary.json").read_text())
              assert r["clock"]=={"initial_ms":0,"increment_ms":2000,"protocol":"fixed-movetime-v2"},r["clock"]
              assert r["budgets"]["zquoridor"]["value"]==200
              assert r["budgets"]["claustrophobia"]["value"]==200
              games=100
              s=r["summaries"]["claustrophobia"]
          assert s["recorded_games"]==games and s["complete_pairs"]==games//2 and s["failed_games"]==0,s
          print("PASS",kind,"${{ matrix.opponent }}","${{ matrix.engine }}",family,games,s["score_pct"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcgs-combo-lazy-sparse-${{ matrix.kind }}-${{ matrix.opponent }}-${{ matrix.engine }}-${{ matrix.family }}
          path: candidate/results/benchmarks/mcgs_combos/
          retention-days: 21
          if-no-files-found: warn
