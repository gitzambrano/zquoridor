name: Sidestep Cpuct Sweep

on:
  push:
    branches:
      - "bench/sidestep-network-probe-20260929"
    paths:
      - ".github/workflows/sidestep-cpuct-sweep.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cpuct: ["0.40","0.80","1.20","1.60","2.40","3.20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy
      - name: Build engine and identical sidestep book
        run: |
          chmod +x build/build_uci.sh
          ./build/build_uci.sh
          python - <<'PY'
          import json, random
          from pathlib import Path
          rows=[json.loads(x) for x in Path("tools/external/openings_center_rush_50pairs.jsonl").read_text().splitlines() if x.strip()]
          pool=[r for r in rows if r.get("category")=="sidestep_flank"]
          rng=random.Random(20260928+71); rng.shuffle(pool)
          selected=[]
          for i in range(20):
              src=dict(pool[i%len(pool)])
              selected.append(src)
          with Path("selected_openings.jsonl").open("w") as f:
              for r in selected: f.write(json.dumps(r,separators=(",",":"))+"\n")
          PY
      - name: Run 40 games
        run: |
          python tools/run_benchmark.py \
            --opponents claustrophobia \
            --pairs 20 \
            --workers 2 \
            --seed 20260928 \
            --openings selected_openings.jsonl \
            --output "results/benchmarks/sidestep_cpuct_${{ matrix.cpuct }}" \
            --zq-move-time-ms 200 \
            --claustrophobia-move-time-ms 200 \
            --claustrophobia-max-sims 4096 \
            --claustrophobia-cpuct 1.5 \
            --claustrophobia-device cpu \
            --zq-arg=--cpuct \
            --zq-arg="${{ matrix.cpuct }}" \
            --bootstrap 5000
      - name: Print score
        run: |
          python - <<'PY'
          import json,glob
          p=glob.glob("results/benchmarks/sidestep_cpuct_*/summary.json")[0]
          s=json.load(open(p))["summaries"]["claustrophobia"]
          print("SCORE",s["score_pct"],"ELO",s["elo"],"CI",s["paired_bootstrap_95"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sidestep-cpuct-${{ matrix.cpuct }}
          path: results/benchmarks/sidestep_cpuct_${{ matrix.cpuct }}/summary.json
          retention-days: 7
