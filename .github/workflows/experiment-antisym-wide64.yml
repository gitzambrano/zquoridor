name: experiment-antisym-wide64

on:
  push:
    branches: [exp/antisym-value-v3-wide64]
    paths:
      - .github/workflows/experiment-antisym-wide64.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  train-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/antisym-value-v3-wide64
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply width-64 architecture
        run: python tools/dev/apply_antisym_wide64.py
      - name: Architecture checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile training/train_nnue.py training/quantize_nnue.py
          mkdir -p bin
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/test_bilateral_accumulator.cpp -o bin/test_bilateral_accumulator
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/test_antisym_value_v3.cpp -o bin/test_antisym_value_v3
          g++ -std=c++17 -O3 -DNDEBUG -Isrc benchmarks/bench_bilateral_value.cpp -o bin/bench_bilateral_value
          ./bin/test_bilateral_accumulator
          ./bin/test_antisym_value_v3
          ./bin/bench_bilateral_value | tee value-bench.txt
      - name: Commit experiment source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nnue.hpp training/train_nnue.py training/quantize_nnue.py
          if ! git diff --cached --quiet; then
            git commit -m 'nnue: widen antisymmetric value head to 64'
            git push origin HEAD:exp/antisym-value-v3-wide64
          fi
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check matplotlib
      - name: Fetch comparison refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
      - uses: actions/download-artifact@v4
        with:
          pattern: bilateral-teacher-*
          path: data/selfplay/antisym-wide64
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33992518366
      - uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: baseline
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847
      - name: Train
        shell: bash
        run: |
          set -euo pipefail
          python training/audit_selfplay.py data/selfplay/antisym-wide64 --fail-on-legacy
          mapfile -t FILES < <(find data/selfplay/antisym-wide64 -type f -name '*.bin' | sort)
          test ${#FILES[@]} -eq 10
          VAL="${FILES[9]}"
          SOURCES=$(python - <<'PY'
          import glob,json
          fs=sorted(glob.glob('data/selfplay/antisym-wide64/*.bin'))
          print(json.dumps([{'path':f,'frac':1.0,'k':1.0} for f in fs[:-1]],separators=(',',':')))
          PY
          )
          python training/train_nnue.py \
            --fresh --data-sources "$SOURCES" --val-data "$VAL" \
            --out data/nnue/candidates/antisym-wide64/nnue_weights.bin \
            --ckpt-dir data/checkpoints/antisym-wide64 --plot-dir data/plots/antisym-wide64 \
            --epochs 60 --batch-size 8192 --lr 3e-4 \
            --wl-gamma 0.995 --wall-poor-wl-weight 3.0 \
            --policy-opening-plies 0 --monitor val_outcome \
            | tee training.log
      - name: Wandering and calibration diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/wandering_race_suite.cpp -o bin/wandering_race_suite
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tools/diagnostics/probe_bilateral_value.cpp -o bin/probe_bilateral_value
          ./bin/wandering_race_suite data/nnue/candidates/antisym-wide64/nnue_weights_int8.bin | tee results/wandering.txt
          ./bin/probe_bilateral_value data/nnue/candidates/antisym-wide64/nnue_weights_int8.bin > results/value-probe.csv
          python tools/diagnostics/analyze_bilateral_probe.py results/value-probe.csv --max-antisym-error 1e-6 | tee results/value-analysis.txt
      - name: Arena vs Gen8 search baseline
        shell: bash
        run: |
          set -o pipefail
          BASE=$(find baseline -type f -path '*gen8-search-ci*' -name '*int8.bin' | head -1)
          python tools/arena/run_arena.py \
            --ref1 '' --ref2 'origin/fix/strong-selfplay-wandering' \
            --games 1200 --time 20 --threads 4 --random-plies 4 \
            --e1-nnue data/nnue/candidates/antisym-wide64/nnue_weights_int8.bin \
            --e2-nnue "$BASE" \
            | tee results/arena-vs-gen8.log
      - uses: actions/upload-artifact@v4
        with:
          name: antisym-wide64-completed
          path: |
            data/nnue/candidates/antisym-wide64/*
            data/checkpoints/antisym-wide64/*
            data/plots/antisym-wide64/*
            results/*
            training.log
            value-bench.txt
          retention-days: 14
