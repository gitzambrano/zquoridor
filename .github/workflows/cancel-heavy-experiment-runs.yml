name: Cancel Heavy Experiment Runs

on:
  push:
    branches: [exp/transform-search-v301-20261004]
    paths:
      - ".github/workflows/cancel-heavy-experiment-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel all heavy experiment runs except EdgeAcc parity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for RUN_ID in             37359549202             37341544657             37285748465             37386201696             37386162399
          do
            echo "Cancelling $RUN_ID"
            code=$(curl -sS -o /tmp/resp -w "%{http_code}"               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel")
            cat /tmp/resp || true
            echo
            echo "HTTP $code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              exit 1
            fi
          done
          echo "Heavy experiment runs cancelled; EdgeAcc parity run preserved."
