name: antisym-value-v3-experiment

on:
  push:
    branches: [exp/antisym-value-v3]
    paths:
      - .github/workflows/antisym-value-v3-experiment.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  train-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_RUN: '33992518366'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/antisym-value-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for shared v2 teacher artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            NAMES=$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN/artifacts" --paginate --jq '.artifacts[].name' || true)
            if grep -qx 'bilateral-teacher-0' <<<"$NAMES" && grep -qx 'bilateral-teacher-1' <<<"$NAMES"; then
              echo "Both shared teacher artifacts are ready."
              exit 0
            fi
            echo "Waiting for v2 teacher artifacts ($i/90)..."
            sleep 60
          done
          echo 'Timed out waiting for teacher artifacts.' >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: bilateral-teacher-*
          path: data/selfplay/antisym-v3
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Restore Gen8 baseline
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: baseline
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847
      - name: Install training dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check matplotlib
      - name: Validate identical teacher population
        shell: bash
        run: |
          set -euo pipefail
          python training/audit_selfplay.py data/selfplay/antisym-v3 --fail-on-legacy
          test "$(find data/selfplay/antisym-v3 -type f -name '*.bin' | wc -l)" -eq 10
          python - <<'PY'
          import glob, hashlib, os
          fs=sorted(glob.glob('data/selfplay/antisym-v3/*.bin'))
          print('teacher_files', len(fs))
          print('teacher_bytes', sum(os.path.getsize(f) for f in fs))
          for f in fs:
              print(os.path.basename(f), hashlib.sha256(open(f,'rb').read()).hexdigest())
          PY
      - name: Architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/test_bilateral_accumulator.cpp -o bin/test_bilateral_accumulator
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/test_antisym_value_v3.cpp -o bin/test_antisym_value_v3
          ./bin/test_bilateral_accumulator
          ./bin/test_antisym_value_v3
      - name: Train v3 from fresh weights on same data as v2
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find data/selfplay/antisym-v3 -type f -name '*.bin' | sort)
          VAL="${FILES[9]}"
          SOURCES=$(python - <<'PY'
          import glob,json
          fs=sorted(glob.glob('data/selfplay/antisym-v3/*.bin'))
          print(json.dumps([{'path':f,'frac':1.0,'k':1.0} for f in fs[:-1]],separators=(',',':')))
          PY
          )
          python training/train_nnue.py \
            --fresh \
            --data-sources "$SOURCES" \
            --val-data "$VAL" \
            --out data/nnue/candidates/antisym-v3/nnue_weights.bin \
            --ckpt-dir data/checkpoints/antisym-v3 \
            --plot-dir data/plots/antisym-v3 \
            --epochs 60 \
            --batch-size 8192 \
            --lr 3e-4 \
            --wl-gamma 0.995 \
            --wall-poor-wl-weight 3.0 \
            --policy-opening-plies 0 \
            --monitor val_outcome
          test -s data/nnue/candidates/antisym-v3/nnue_weights_int8.bin
      - name: Calibration and wandering diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/results
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tools/diagnostics/probe_bilateral_value.cpp -o bin/probe_bilateral_value
          g++ -std=c++17 -O3 -DNDEBUG -Isrc tests/wandering_race_suite.cpp -o bin/wandering_race_suite
          ./bin/probe_bilateral_value data/nnue/candidates/antisym-v3/nnue_weights_int8.bin > data/results/value-probe.csv
          python tools/diagnostics/analyze_bilateral_probe.py data/results/value-probe.csv --max-antisym-error 1e-6 | tee data/results/value-analysis.txt
          ./bin/wandering_race_suite data/nnue/candidates/antisym-v3/nnue_weights_int8.bin | tee data/results/wandering-suite.txt
      - name: Arena v3 vs Gen8 baseline
        shell: bash
        run: |
          set -o pipefail
          python tools/arena/run_arena.py \
            --ref1 'exp/antisym-value-v3' --ref2 'fix/strong-selfplay-wandering' \
            --games 1200 --time 20 --threads 4 --random-plies 4 \
            --e1-nnue data/nnue/candidates/antisym-v3/nnue_weights_int8.bin \
            --e2-nnue baseline/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin \
            | tee data/results/antisym-v3-vs-gen8.log
      - name: Wait for v2 candidate for direct architecture match
        id: v2wait
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            NAMES=$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN/artifacts" --paginate --jq '.artifacts[].name' || true)
            if grep -qx 'bilateral-v2-completed' <<<"$NAMES"; then exit 0; fi
            echo "Waiting for v2 candidate ($i/60)..."
            sleep 60
          done
          exit 1
      - name: Download v2 candidate
        if: steps.v2wait.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: bilateral-v2-completed
          path: v2-completed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Arena v3 vs v2 direct
        if: steps.v2wait.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          V2=$(find v2-completed -type f -path '*bilateral-v2*' -name 'nnue_weights_int8.bin' | head -1)
          test -n "$V2"
          python tools/arena/run_arena.py \
            --ref1 'exp/antisym-value-v3' --ref2 'exp/full-accumulator-v2' \
            --games 1000 --time 20 --threads 4 --random-plies 4 \
            --e1-nnue data/nnue/candidates/antisym-v3/nnue_weights_int8.bin \
            --e2-nnue "$V2" \
            | tee data/results/antisym-v3-vs-v2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antisym-v3-completed
          retention-days: 7
          path: |
            data/nnue/candidates/antisym-v3/*.bin
            data/checkpoints/antisym-v3/*
            data/plots/antisym-v3/*
            data/results/*
