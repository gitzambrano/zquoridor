name: Delete stale branch

on:
  push:
    paths:
      - ".github/workflows/delete-stale-branch.yml"

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/search/tmgr-leela-final-v1"
