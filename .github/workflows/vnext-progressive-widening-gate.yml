name: vnext-progressive-widening-gate

on:
  push:
    branches:
      - exp/vnext-search-2026-09
    paths:
      - ".github/workflows/vnext-progressive-widening-gate.yml"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pw8
            initial: 8
            coefficient: 2.0
            exponent: 0.5
          - name: pw16
            initial: 16
            coefficient: 2.0
            exponent: 0.5
          - name: pw24
            initial: 24
            coefficient: 2.0
            exponent: 0.5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Progressive widening vs production — ${{ matrix.name }}
        shell: bash
        env:
          W: ${{ github.workspace }}/bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin
        run: |
          set -euo pipefail
          test -s "$W"
          mkdir -p results
          python tools/arena/run_arena.py \
            --ref1 HEAD --ref2 HEAD \
            --games 1000 --report-games 50 --time 200 --threads 14 \
            --e1-nnue "$W" --e2-nnue "$W" \
            --e1-mcab-progressive-widening \
            --e1-mcab-widening-initial ${{ matrix.initial }} \
            --e1-mcab-widening-coefficient ${{ matrix.coefficient }} \
            --e1-mcab-widening-exponent ${{ matrix.exponent }} \
            --e2-mcab-no-progressive-widening \
            2>&1 | tee "results/${{ matrix.name }}.log"

      - name: Extract result
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          python - <<'PY' | tee "results/${NAME}-summary.txt"
          import os, re
          from pathlib import Path
          text = Path(f"results/{os.environ['NAME']}.log").read_text(errors="replace")
          m = re.search(r"Diferenca Elo Engine 1 vs 2\s*:\s*([+-]?\d+(?:\.\d+)?)\s*\(Margem\s*[±+\-]?\s*(\d+(?:\.\d+)?)\)", text)
          if not m:
              raise SystemExit("could not parse final Elo result")
          elo=float(m.group(1)); margin=float(m.group(2))
          print(f"candidate Elo = {elo:+.1f} ±{margin:.1f}")
          print(f"lower bound = {elo-margin:+.1f}")
          print("PASS" if elo-margin > 0 else "NOT PROVEN")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnext-progressive-widening-${{ matrix.name }}
          retention-days: 30
          path: results/
