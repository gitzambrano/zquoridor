name: gen9-search-20k

on:
  push:
    branches:
      - fix/strong-selfplay-wandering
    paths:
      - ".github/workflows/gen9-search-20k.yml"

jobs:
  selfplay:
    name: selfplay-${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Restore Gen8 bootstrap weights
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Use Gen8 only inside this runner
        shell: bash
        run: |
          set -euo pipefail
          cp bootstrap/nnue/candidates/gen8-search-ci/nnue_weights.bin data/nnue/nnue_weights.bin
          cp bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin data/nnue/nnue_weights_int8.bin
          bash build/build_selfplay.sh

      - name: Generate 5000 search-driven games
        shell: bash
        run: |
          set -euo pipefail
          python tools/selfplay/run_selfplay.py \
            --games 5000 \
            --chunk-games 1250 \
            --time-ms 20 \
            --threads 4 \
            --seed $((20260905 + ${{ matrix.part }} * 100000)) \
            --mode montecarlo \
            --mc-obvious-plies 0 \
            --mc-temp-decay-plies 0 \
            --epsilon-midgame 0.01 \
            --out "data/selfplay/gen9-part-${{ matrix.part }}/selfplay_{shard:03d}.bin"

      - name: Validate and namespace shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          python training/audit_selfplay.py data/selfplay/gen9-part-${{ matrix.part }} --fail-on-legacy
          n=0
          for f in data/selfplay/gen9-part-${{ matrix.part }}/selfplay_*.bin; do
            printf -v dst 'upload/selfplay_%02d_%03d.bin' "${{ matrix.part }}" "$n"
            cp "$f" "$dst"
            n=$((n + 1))
          done
          test "$n" -eq 4

      - name: Upload self-play partition
        uses: actions/upload-artifact@v4
        with:
          name: gen9-selfplay-${{ matrix.part }}
          path: upload/*.bin
          retention-days: 7
          if-no-files-found: error

  train:
    name: train-and-arena
    needs: selfplay
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check matplotlib

      - name: Preserve official Gen7 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/baselines/gen7
          cp data/nnue/nnue_weights.bin data/baselines/gen7/nnue_weights.bin
          cp data/nnue/nnue_weights_int8.bin data/baselines/gen7/nnue_weights_int8.bin

      - name: Restore Gen8 bootstrap weights
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Make Gen8 the ephemeral training champion
        shell: bash
        run: |
          set -euo pipefail
          cp bootstrap/nnue/candidates/gen8-search-ci/nnue_weights.bin data/nnue/nnue_weights.bin
          cp bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin data/nnue/nnue_weights_int8.bin

      - name: Restore all 20000 self-play games
        uses: actions/download-artifact@v4
        with:
          pattern: gen9-selfplay-*
          path: data/selfplay/gen9-search-20k
          merge-multiple: true

      - name: Verify combined generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find data/selfplay/gen9-search-20k -maxdepth 1 -name 'selfplay_*.bin' | wc -l)" -eq 16
          python training/audit_selfplay.py data/selfplay/gen9-search-20k --fail-on-legacy
          bash build/build_selfplay.sh

      - name: Train Gen9 from Gen8 and gate against Gen8
        id: train_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python training/strong_cycle.py \
            --generation gen9-search-20k \
            --reuse-selfplay \
            --games 20000 \
            --chunk-games 1250 \
            --time-ms 20 \
            --threads 4 \
            --focus-copies 2 \
            --focus-max-fraction 0.10 \
            --epochs 60 \
            --lr 2e-5 \
            --wl-gamma 0.99 \
            --arena-games 1000 \
            --arena-time-ms 20 \
            --arena-threads 4 \
            --arena-random-plies 4 \
            2>&1 | tee data/gen9-vs-gen8.log

      - name: Arena Gen9 against official Gen7
        shell: bash
        run: |
          set -euo pipefail
          test -s data/nnue/candidates/gen9-search-20k/nnue_weights_int8.bin
          python tools/arena/run_arena.py \
            --ref1 "" \
            --ref2 "" \
            --games 1000 \
            --time 20 \
            --threads 4 \
            --random-plies 4 \
            --e1-nnue data/nnue/candidates/gen9-search-20k/nnue_weights_int8.bin \
            --e2-nnue data/baselines/gen7/nnue_weights_int8.bin \
            | tee data/gen9-vs-gen7.log

      - name: Upload Gen9 experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen9-search-20k-completed
          retention-days: 7
          if-no-files-found: warn
          path: |
            data/selfplay/gen9-search-20k/*.bin
            data/selfplay/gen9-search-20k-focus/*
            data/nnue/candidates/gen9-search-20k/*.bin
            data/nnue/champions/gen9-search-20k-*/*.bin
            data/checkpoints/gen9-search-20k-candidate/train_config_*.json
            data/plots/gen9-search-20k-candidate/training_curves.png
            data/logs/gen9-search-20k-*.log
            data/gen9-vs-gen8.log
            data/gen9-vs-gen7.log

      - name: Report gate status without promotion
        shell: bash
        run: |
          echo "Gen9 was not promoted or copied into repository production weights."
          echo "Gen9-vs-Gen8 gate outcome: ${{ steps.train_gate.outcome }}"
