name: Engine lab

on:
  push:
    branches:
      - main
      - "infra/engine-lab-*"
    paths:
      - ".github/workflows/engine-lab.yml"
      - "tools/external/**"
      - "training/teachers/**"
      - "docs/engine-lab.md"
  pull_request:
    paths:
      - ".github/workflows/engine-lab.yml"
      - "build/build_tests.*"
      - "src/time_manager.hpp"
      - "tests/test_time_manager.cpp"
      - "tools/arena/**"
      - "tools/external/**"
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        default: smoke
        type: choice
        options: [smoke, selfplay, train, arena, titanium, teacher]
      games:
        description: Self-play games
        required: false
        default: "96"
        type: string
      paired_openings:
        description: Paired openings for Titanium benchmark
        required: false
        default: "40"
        type: string
      movetime_ms:
        description: Fixed move time in milliseconds
        required: false
        default: "200"
        type: string
      workers:
        description: Parallel workers
        required: false
        default: "2"
        type: string
      trainer:
        description: Python trainer path for train mode
        required: false
        default: training/train_nnue.py
        type: string
      source_run_id:
        description: Optional same-repo Actions run containing an input artifact
        required: false
        default: ""
        type: string
      source_artifact:
        description: Optional artifact name from source_run_id
        required: false
        default: ""
        type: string
      teacher_openings:
        description: Independent teacher opening JSONL path; never use frozen benchmark openings
        required: false
        default: source/openings.jsonl
        type: string
      extra_args:
        description: Extra CLI arguments for selfplay/train/arena
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and frozen-identity sanity
        run: |
          python -m py_compile tools/arena/run_arena.py tools/external/titanium_arena.py tools/external/titanium_arena_fixed.py tools/external/analyze_paired_arena.py training/teachers/titanium_collect.py
          bash -n tools/external/build_pinned_titanium.sh
          test -s checkpoints/gen8/nnue_weights.bin
          test -s checkpoints/gen8/nnue_weights_int8.bin
          grep -q '^generation=Gen8$' checkpoints/gen8/PRODUCTION_MANIFEST.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tools/external/openings_titanium.jsonl')
          rows = [json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows) == 40, len(rows)
          assert all(isinstance(r.get('moves'), list) for r in rows)
          print(f'frozen Titanium openings: {len(rows)}')
          PY
      - name: Pair-aware analysis unit smoke
        run: |
          cat > /tmp/pairs.jsonl <<'EOF'
          {"opening_index":0,"zq_player":0,"result":1.0}
          {"opening_index":0,"zq_player":1,"result":0.0}
          {"opening_index":1,"zq_player":0,"result":1.0}
          {"opening_index":1,"zq_player":1,"result":1.0}
          EOF
          python tools/external/analyze_paired_arena.py --games /tmp/pairs.jsonl --out /tmp/paired.json --bootstrap 1000
          python - <<'PY'
          import json
          r=json.load(open('/tmp/paired.json'))
          assert r['paired_openings'] == 2
          assert r['games'] == 4
          assert abs(r['score_pct'] - 75.0) < 1e-9
          PY
      - name: Build permanent runners
        run: |
          bash build/build_selfplay.sh
          bash build/build_arena.sh
          mkdir -p bin
          g++ -std=c++17 -O2 -DNDEBUG -pthread -Isrc tools/external/zquoridor_uci.cpp -o bin/zquoridor_external
      - name: Build tests and run fast infrastructure regressions
        run: |
          bash build/build_tests.sh
          ./bin/test_rules_sanity
          ./bin/test_mcab_core
          ./bin/test_time_manager
          echo 'Full search regressions (including test_policy_ab) stay in candidate/search gates.'
      - name: Game-clock smoke
        shell: bash
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo wtime 180000 btime 180000 winc 2000 binc 2000\nquit\n' |
            ./bin/zquoridor_external --nnue data/nnue/nnue_weights_int8.bin |
            tee /tmp/time-uci.log
          grep -q '^bestmove ' /tmp/time-uci.log
          grep -q 'string budget=' /tmp/time-uci.log
          ./bin/arena.exe --games 4 --random-plies 4 --report-games 0 \
            --tc-base-ms 1000 --tc-inc-ms 100 --move-overhead-ms 5 \
            --e1-nnue data/nnue/nnue_weights_int8.bin \
            --e2-nnue data/nnue/nnue_weights_int8.bin
      - name: Record time-manager smoke result
        if: ${{ always() && github.ref_name == 'infra/engine-lab-time-manager-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/time-manager-v1
          printf 'status=${{ job.status }}\nsource_sha=%s\n' "$GITHUB_SHA" > results/time-manager-v1/smoke.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/time-manager-v1/smoke.txt
          git commit -m "ci: record time manager smoke result"
          git push origin HEAD:"$GITHUB_REF_NAME"

  selfplay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'selfplay' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download optional input artifact
        if: ${{ inputs.source_run_id != '' && inputs.source_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Build self-play
        run: bash build/build_selfplay.sh
      - name: Generate self-play
        shell: bash
        run: |
          mkdir -p results/selfplay
          python tools/selfplay/run_selfplay.py \
            --games "${{ inputs.games }}" \
            --time-ms "${{ inputs.movetime_ms }}" \
            --threads "${{ inputs.workers }}" \
            ${{ inputs.extra_args }} \
            --out 'results/selfplay/selfplay_{shard:03d}.bin'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-lab-selfplay-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: results/selfplay/**

  train:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'train' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install common training dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download optional input artifact
        if: ${{ inputs.source_run_id != '' && inputs.source_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Run selected trainer
        shell: bash
        run: python "${{ inputs.trainer }}" ${{ inputs.extra_args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-lab-train-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/**
            data/nnue/**
            data/checkpoints/**

  arena:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'arena' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Download optional input artifact
        if: ${{ inputs.source_run_id != '' && inputs.source_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Build arena
        run: bash build/build_arena.sh
      - name: Run internal arena
        shell: bash
        run: python tools/arena/run_arena.py ${{ inputs.extra_args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-lab-arena-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/**
            data/arena/**

  titanium:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'titanium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TITANIUM_PONDERING: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Download optional candidate artifact
        if: ${{ inputs.source_run_id != '' && inputs.source_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Build pinned Titanium from source
        run: tools/external/build_pinned_titanium.sh titanium-bin
      - name: Resolve identities and build adapter
        shell: bash
        run: |
          set -euo pipefail
          TI="titanium-bin/titanium"
          grep -qx '1ac94755f69799f01b2e06869403e701bbf0bd51' titanium-bin/titanium-sha.txt
          W=""
          if [ -d candidate ]; then W="$(find candidate -type f -name 'nnue_weights_int8.bin' | head -n1)"; fi
          if [ -z "$W" ]; then W="checkpoints/gen8/nnue_weights_int8.bin"; fi
          test -s "$W"
          mkdir -p bin results/titanium
          g++ -std=c++17 -O3 -DNDEBUG -march=native -pthread -Isrc tools/external/zquoridor_uci.cpp -o bin/zq_candidate
          printf '%s\n' "$TI" > results/titanium/titanium_path.txt
          printf '%s\n' "$W" > results/titanium/weights_path.txt
          git rev-parse HEAD > results/titanium/candidate_sha.txt
          cp titanium-bin/titanium-sha.txt results/titanium/
          sha256sum "$W" > results/titanium/weights.sha256
          sha256sum tools/external/titanium_arena.py tools/external/titanium_arena_fixed.py tools/external/openings_titanium.jsonl > results/titanium/harness.sha256
      - name: Titanium two-game smoke
        shell: bash
        run: |
          TI="$(cat results/titanium/titanium_path.txt)"; W="$(cat results/titanium/weights_path.txt)"
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_candidate --zq-arg=--nnue --zq-arg="$W" \
            --titanium "$TI" --openings tools/external/openings_titanium.jsonl \
            --limit-openings 1 --movetime "${{ inputs.movetime_ms }}" --workers 1 \
            --json-out results/titanium/smoke.json --games-out results/titanium/smoke-games.jsonl
      - name: Titanium paired benchmark
        shell: bash
        run: |
          TI="$(cat results/titanium/titanium_path.txt)"; W="$(cat results/titanium/weights_path.txt)"
          python tools/external/titanium_arena_fixed.py \
            --zq ./bin/zq_candidate --zq-arg=--nnue --zq-arg="$W" \
            --titanium "$TI" --openings tools/external/openings_titanium.jsonl \
            --limit-openings "${{ inputs.paired_openings }}" \
            --movetime "${{ inputs.movetime_ms }}" --workers "${{ inputs.workers }}" \
            --json-out results/titanium/result.json --games-out results/titanium/games.jsonl
          python tools/external/analyze_paired_arena.py \
            --games results/titanium/games.jsonl \
            --out results/titanium/paired.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-lab-titanium-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: results/titanium/**

  teacher:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'teacher' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TITANIUM_PONDERING: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Download optional independent opening corpus
        if: ${{ inputs.source_run_id != '' && inputs.source_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Build pinned Titanium from source
        run: tools/external/build_pinned_titanium.sh titanium-bin
      - name: Collect architecture-neutral teacher data
        shell: bash
        run: |
          set -euo pipefail
          grep -qx '1ac94755f69799f01b2e06869403e701bbf0bd51' titanium-bin/titanium-sha.txt
          test -s "${{ inputs.teacher_openings }}"
          python training/teachers/titanium_collect.py \
            --titanium titanium-bin/titanium --openings "${{ inputs.teacher_openings }}" \
            --out-dir results/titanium-teacher \
            --movetime "${{ inputs.movetime_ms }}" --workers "${{ inputs.workers }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-lab-titanium-teacher-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: results/titanium-teacher/**
