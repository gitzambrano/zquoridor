name: Cleanup gameplay branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete merged gameplay branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/test/mobile-real-gameplay >/dev/null 2>&1; then
            git push origin --delete test/mobile-real-gameplay
          fi
