name: Full accumulator train and arena

on:
  push:
    branches: [exp/full-accumulator]
    paths: [.github/workflows/full-accumulator-train-arena-temp.yml]

permissions:
  contents: read
  actions: read

jobs:
  train-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/full-accumulator
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU training deps
        run: |
          python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check matplotlib

      - name: Restore validated baseline and 5000-game selfplay
        uses: actions/download-artifact@v4
        with:
          name: full-accumulator-candidate-34731228503
          path: /tmp/fullacc
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 34731228503

      - name: Apply and validate full-accumulator warm-start loader
        shell: bash
        run: |
          set -euo pipefail
          python tools/dev/fix_full_accumulator_loader.py
          python -m py_compile training/train_nnue.py
          test -s /tmp/fullacc/init/full.bin
          test -s /tmp/fullacc/init/full_int8.bin
          test "$(find /tmp/fullacc/selfplay -maxdepth 1 -name 'selfplay_*.bin' | wc -l)" -eq 4
          python training/audit_selfplay.py /tmp/fullacc/selfplay --fail-on-legacy
          python - <<'PY'
          from training.train_nnue import _load_raw_weights, HEAD_INPUT, POLICY_OUT
          r = _load_raw_weights('/tmp/fullacc/init/full.bin')
          assert r['wv1_wl'].shape == (HEAD_INPUT, 32), r['wv1_wl'].shape
          assert r['wp'].shape == (POLICY_OUT, HEAD_INPUT), r['wp'].shape
          print('warm-start loader OK:', r['wv1_wl'].shape, r['wp'].shape)
          PY

      - name: Build and verify migrated production baseline
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/fullacc/init/full.bin data/nnue/nnue_weights.bin
          cp /tmp/fullacc/init/full_int8.bin data/nnue/nnue_weights_int8.bin
          bash build/build_tests.sh
          ./bin/nnue_verify /tmp/fullacc/init/full.bin /tmp/fullacc/init/full_int8.bin
          ./bin/nnue_incremental_check /tmp/fullacc/init/full_int8.bin
          ./bin/nnue_sign_check /tmp/fullacc/init/full_int8.bin

      - name: Fine-tune full accumulator on saved modern selfplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fullacc/out /tmp/fullacc/ckpt
          python training/train_nnue.py \
            --fresh \
            --init-from /tmp/fullacc/init/full.bin \
            --data-sources '[{"path":"/tmp/fullacc/selfplay","frac":1.0,"k":0.65}]' \
            --out /tmp/fullacc/out/full.bin \
            --quant-out /tmp/fullacc/out/full_int8.bin \
            --ckpt-dir /tmp/fullacc/ckpt \
            --epochs 30 \
            --lr 5e-5 \
            --wl-gamma 0.99 \
            --device cpu

      - name: Verify trained candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fullacc/out/full.bin
          test -s /tmp/fullacc/out/full_int8.bin
          ./bin/nnue_verify /tmp/fullacc/out/full.bin /tmp/fullacc/out/full_int8.bin
          ./bin/nnue_incremental_check /tmp/fullacc/out/full_int8.bin
          ./bin/nnue_sign_check /tmp/fullacc/out/full_int8.bin

      - name: Arena candidate vs functionally identical production baseline
        shell: bash
        run: |
          set -euo pipefail
          python tools/arena/run_arena.py \
            --ref1 '' --ref2 '' \
            --games 200 \
            --time 200 \
            --threads 4 \
            --random-plies 4 \
            --e1-nnue /tmp/fullacc/out/full_int8.bin \
            --e2-nnue /tmp/fullacc/init/full_int8.bin \
            2>&1 | tee /tmp/fullacc/arena.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-accumulator-candidate-${{ github.run_id }}
          path: |
            /tmp/fullacc/init/full.bin
            /tmp/fullacc/init/full_int8.bin
            /tmp/fullacc/out/full.bin
            /tmp/fullacc/out/full_int8.bin
            /tmp/fullacc/arena.txt
            /tmp/fullacc/ckpt
            /tmp/fullacc/selfplay
          retention-days: 14
