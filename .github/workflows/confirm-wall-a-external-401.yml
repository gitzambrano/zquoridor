name: "ZQ 4.01 Variant A vs main - independent Claustrophobia and Titanium 200ms"
on:
  push:
    branches: [exp/wall-a-external-200-401-20261015]
    paths: [".github/workflows/confirm-wall-a-external-401.yml", "tools/make_external_confirm_openings.py", "src/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-opponent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - opponent: claustrophobia
            engine: main401
            family: normal
            book: tools/external/openings_normal_confirm_400.jsonl
          - opponent: claustrophobia
            engine: variant_a
            family: normal
            book: tools/external/openings_normal_confirm_400.jsonl
          - opponent: claustrophobia
            engine: main401
            family: center
            book: tools/external/openings_center_rush_sound_5k.jsonl
          - opponent: claustrophobia
            engine: variant_a
            family: center
            book: tools/external/openings_center_rush_sound_5k.jsonl
          - opponent: titanium
            engine: main401
            family: normal
            book: tools/external/openings_normal_confirm_400.jsonl
          - opponent: titanium
            engine: variant_a
            family: normal
            book: tools/external/openings_normal_confirm_400.jsonl
          - opponent: titanium
            engine: main401
            family: center
            book: tools/external/openings_center_rush_sound_5k.jsonl
          - opponent: titanium
            engine: variant_a
            family: center
            book: tools/external/openings_center_rush_sound_5k.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 806a50877f16d6e6f82b65e86d2a27a10916ad13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned bot checkpoint and Rust crates, not mutable checkouts
        uses: actions/cache@v4
        with:
          path: |
            candidate/external_bots/claustrophobia/champion.pt
            ~/.cargo/registry
            ~/.cargo/git
          key: a-external-401-${{ runner.os }}-${{ matrix.opponent }}-${{ hashFiles('candidate/tools/external/bot_setup.py', 'candidate/training/teachers/claustrophobia_inference_worker.py') }}
          restore-keys: |
            a-external-401-${{ runner.os }}-${{ matrix.opponent }}-
      - name: Install pinned-opponent CPU dependencies
        if: matrix.opponent == 'claustrophobia'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit-check A and build exactly matched engines
        run: |
          set -euo pipefail
          mkdir -p candidate/bin baseline/bin
          g++ -std=c++17 -O2 -I candidate/src candidate/tests/test_wall_order_distance_shortcut.cpp -o candidate/bin/test_shortcut
          (cd candidate && bin/test_shortcut)
          g++ -std=c++17 -O2 -DZQ_EXP_WALL_ORDER_PATH_SHORTCUT=1 -I candidate/src candidate/tests/test_move_ordering.cpp -o candidate/bin/test_ordering
          (cd candidate && bin/test_ordering)
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma \
            -DZQ_EXP_WALL_ORDER_PATH_SHORTCUT=1 \
            -I candidate/src candidate/tools/external/zquoridor_uci.cpp -o candidate/bin/zq_variant_a
          g++ -O3 -std=c++17 -march=native -mavx2 -mfma \
            -I baseline/src baseline/tools/external/zquoridor_uci.cpp -o baseline/bin/zq_main401
      - name: Prepare independent, referee-verified 100 paired openings
        run: |
          set -euo pipefail
          cd candidate
          mkdir -p results/benchmarks/confirm_a_external/books
          python -u tools/make_external_confirm_openings.py \
            --source ${{ matrix.book }} --pairs 100 \
            --exclude-seed 20261015 --exclude-pairs 25 \
            --seed 20261016 \
            --output results/benchmarks/confirm_a_external/books/book_${{ matrix.family }}.jsonl
      - name: Paired 200ms vs pinned external bot (200 games, both colors)
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if [ "${{ matrix.engine }}" = "variant_a" ]; then
            exe=bin/zq_variant_a
          else
            exe=../baseline/bin/zq_main401
          fi
          python -u tools/run_benchmark.py \
            --opponents "${{ matrix.opponent }}" \
            --pairs 100 --workers 1 --seed 20261016 \
            --openings results/benchmarks/confirm_a_external/books/book_${{ matrix.family }}.jsonl \
            --zq-executable "$exe" \
            --nnue data/nnue/nnue_weights_int8.bin \
            --zq-move-time-ms 200 \
            --titanium-move-time-ms 200 \
            --claustrophobia-move-time-ms 200 \
            --claustrophobia-device cpu \
            --clock-initial-ms 0 --max-plies 240 --bootstrap 10000 \
            --output results/benchmarks/confirm_a_external/${{ matrix.opponent }}/${{ matrix.engine }}/${{ matrix.family }}
      - name: Verify no invalid games, exact budgets and expected count
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("candidate/results/benchmarks/confirm_a_external/${{ matrix.opponent }}/${{ matrix.engine }}/${{ matrix.family }}/summary.json")
          report=json.loads(path.read_text())
          summ=report["summaries"]["${{ matrix.opponent }}"]
          assert report["clock"]["protocol"]=="fixed-movetime-v2"
          assert report["clock"]["initial_ms"]==0
          assert report["budgets"]["zquoridor"]["value"]==200
          assert report["budgets"]["${{ matrix.opponent }}"]["value"]==200
          assert summ["recorded_games"]==200 and summ["complete_pairs"]==100
          assert summ["failed_games"]==0
          print(f"PASS {path}: score={summ['score_pct']}%, 200 real movetime, 100 pairs, no failures")
          PY
      - name: Upload all game-by-game results for matched A/B comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-external-401-${{ matrix.opponent }}-${{ matrix.engine }}-${{ matrix.family }}
          path: candidate/results/benchmarks/confirm_a_external/
          if-no-files-found: warn
          retention-days: 21
