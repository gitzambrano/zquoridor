name: Cleanup merged mobile branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'gitzambrano/zquoridor'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete merged mobile work branches
        run: |
          set -euo pipefail
          for b in             ui/mobile-frontend-v2             ui/mobile-board-hud-fix             ui/mobile-final-hardening
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$b" >/dev/null 2>&1; then
              git push origin --delete "$b"
            fi
          done
