name: test-policy-reanalysis-finetune

on:
  push:
    branches: [exp/wall-reanalysis-gen13]
    paths:
      - 'training/finetune_policy_reanalysis.py'
      - '.github/workflows/test-policy-reanalysis-finetune.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/wall-reanalysis-gen13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax/import smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile training/finetune_policy_reanalysis.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'training')
          import finetune_policy_reanalysis
          print('policy reanalysis finetuner import PASS')
          PY
