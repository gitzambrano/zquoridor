name: test-policy-reanalysis-finetune

on:
  push:
    branches: [exp/wall-economy-gen11]
    paths:
      - 'training/finetune_policy_reanalysis.py'
      - '.github/workflows/test-policy-reanalysis-finetune.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/wall-economy-gen11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore Gen8 weights
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847
      - name: Restore old reanalysis-shaped V3 data
        uses: actions/download-artifact@v4
        with:
          name: wall-monotonic-olddata-control
          path: sample
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 34043824388
      - name: Syntax/import smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile training/finetune_policy_reanalysis.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'training')
          import finetune_policy_reanalysis as f
          print('policy reanalysis finetuner import PASS')
          PY
