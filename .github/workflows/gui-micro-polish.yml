name: GUI micro-polish

on:
  push:
    branches:
      - gui/micro-polish-2026-09

permissions:
  contents: write

jobs:
  polish-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gui/micro-polish-2026-09
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic GUI polish
        run: python tools/gui/apply_micro_polish.py

      - name: JavaScript syntax checks
        run: |
          node --check gui_web/app.js
          node --check gui_web/board.js

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild standalone and root Pages bundle
        run: python gui_web/build_standalone.py

      - name: Run GUI browser suites
        working-directory: gui_web
        run: |
          python test_gui_features.py
          python test_deep_click.py
          python test_features_e2e.py
          python test_wall_matrix.py
          python test_gameplay_sim.py
          python test_browser_full.py
          python test_standalone.py

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified GUI sources and bundles
        run: |
          git config user.name "zquoridor-gui-polish"
          git config user.email "actions@users.noreply.github.com"
          git add gui_web/style.html gui_web/app.js gui_web/board.js gui_web/zquoridor.html index.html
          git rm tools/gui/apply_micro_polish.py .github/workflows/gui-micro-polish.yml
          git commit -m "gui: apply verified micro-polish pass"
          git push origin HEAD:gui/micro-polish-2026-09
