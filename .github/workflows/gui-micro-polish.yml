name: GUI micro-polish

on:
  push:
    branches:
      - gui/micro-polish-2026-09

permissions:
  contents: write

jobs:
  polish-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gui/micro-polish-2026-09
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic GUI polish
        run: python tools/gui/apply_micro_polish.py

      - name: Preserve legacy setting API and fix theme test baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('gui_web/app.js')
          s = app.read_text(encoding='utf-8')
          old = """function setOpt(key, val) {\n  S[key] = val;\n  S.preset = 'custom';\n  saveSettings(); applySettings();\n}"""
          new = """function setOpt(key, val) {\n  S[key] = val;\n  // Schema-v4 style controls and the legacy boolean stay bidirectionally\n  // compatible so old stored settings/tests/integrations keep their meaning.\n  if (key === 'lastMoveStyle') S.lastMove = val !== 'off';\n  if (key === 'lastMove') S.lastMoveStyle = val ? 'subtle' : 'off';\n  S.preset = 'custom';\n  saveSettings(); applySettings();\n}"""
          if s.count(old) != 1:
              raise SystemExit('setOpt compatibility anchor drifted')
          app.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('gui_web/test_gui_features.py')
          t = test.read_text(encoding='utf-8')
          old = """            prev = board_hash_full()\n            seen = set()\n            for t in themes:\n                page.evaluate(f\"setOpt('board', '{t}')\")\n                page.wait_for_timeout(180)\n                h = board_hash_full()\n                check(f\"theme {t} repaints\", h != prev or t in seen)\n                seen.add(h)\n                prev = h"""
          new = """            prev = board_hash_full()\n            initial_theme = page.evaluate(\"document.documentElement.dataset.board\")\n            seen = set()\n            for t in themes:\n                page.evaluate(f\"setOpt('board', '{t}')\")\n                page.wait_for_timeout(180)\n                h = board_hash_full()\n                # Re-selecting the already-active initial theme is correctly a no-op.\n                check(f\"theme {t} repaints\", h != prev or t == initial_theme)\n                seen.add(h)\n                prev = h"""
          if t.count(old) != 1:
              raise SystemExit('theme-test baseline anchor drifted')
          test.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: JavaScript syntax checks
        run: |
          node --check gui_web/app.js
          node --check gui_web/board.js

      - name: Recover generated WASM from current standalone
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          p = Path('gui_web/zquoridor.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'const __QR_WASM_BYTES__ = __qr_b64ToBytes\("([A-Za-z0-9+/=]+)"\);', text)
          if not m:
              raise SystemExit('embedded WASM payload not found in gui_web/zquoridor.html')
          wasm = base64.b64decode(m.group(1))
          Path('gui_web/zquoridor.wasm').write_bytes(wasm)
          md = re.search(r'const __QR_DATA_BYTES__ = __qr_b64ToBytes\("([A-Za-z0-9+/=]+)"\)\.buffer;', text)
          if md:
              Path('gui_web/zquoridor.data').write_bytes(base64.b64decode(md.group(1)))
          print(f'recovered zquoridor.wasm ({len(wasm)} bytes)')
          PY

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild standalone and root Pages bundle
        run: python gui_web/build_standalone.py

      - name: Run GUI browser suites
        working-directory: gui_web
        run: |
          python test_gui_features.py
          python test_deep_click.py
          python test_features_e2e.py
          python test_wall_matrix.py
          python test_gameplay_sim.py
          python test_browser_full.py
          python test_standalone.py

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified GUI sources and bundles
        run: |
          git config user.name "zquoridor-gui-polish"
          git config user.email "actions@users.noreply.github.com"
          git add gui_web/style.html gui_web/app.js gui_web/board.js gui_web/test_gui_features.py gui_web/zquoridor.html index.html
          git rm tools/gui/apply_micro_polish.py .github/workflows/gui-micro-polish.yml
          git commit -m "gui: apply verified micro-polish pass"
          git push origin HEAD:gui/micro-polish-2026-09
