name: CR200k path-scratch confirmation 400+400

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mcab.hpp"
      - ".github/workflows/cr200k-pathscratch-confirm-v1.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BASE_SHA: "ea62cca1bf8dbdf8fed866c4606c4d56752a8a8e"
  OPENING_SEED: "2026092403"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen baseline and NNUE identity
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/zq-main "$BASE_SHA"
          cmp data/nnue/nnue_weights_int8.bin /tmp/zq-main/data/nnue/nnue_weights_int8.bin
          sha256sum data/nnue/nnue_weights_int8.bin /tmp/zq-main/data/nnue/nnue_weights_int8.bin
      - name: Native correctness gate
        shell: bash
        run: |
          set -euo pipefail
          bash build/build_tests.sh
          ./bin/test_rules_sanity
          ./bin/test_mcab_core
          ./bin/test_mcab_phase9
          ./bin/test_endgame_race_fuzz
          ./bin/test_policy_ab
      - name: Build production path-scratch and ablation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-bin
          g++ -O3 -DNDEBUG -std=c++17 -pthread             -I/tmp/zq-main/src /tmp/zq-main/tools/external/zquoridor_uci.cpp             -o gate-bin/pathscratch
          g++ -O3 -DNDEBUG -std=c++17 -pthread             -Isrc tools/external/zquoridor_uci.cpp             -o gate-bin/no-pathscratch
      - name: Fixed-node throughput sanity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,time,statistics,random,re
          from pathlib import Path
          ROOT=Path(".").resolve(); W=str((ROOT/"data/nnue/nnue_weights_int8.bin").resolve())
          exes={"pathscratch":str(ROOT/"gate-bin/pathscratch"),"no_pathscratch":str(ROOT/"gate-bin/no-pathscratch")}
          def one(exe):
              p=subprocess.Popen([exe,"--nnue",W,"--nodes","20000"],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
              def send(x): p.stdin.write(x+"\n"); p.stdin.flush()
              send("uci")
              while p.stdout.readline().strip()!="uciok": pass
              send("isready")
              while p.stdout.readline().strip()!="readyok": pass
              send("position startpos"); t0=time.perf_counter(); send("go movetime 0")
              best=""; info=""
              while True:
                  line=p.stdout.readline().strip()
                  if line.startswith("info "): info=line
                  if line.startswith("bestmove "): best=line.split()[1]; break
              ms=(time.perf_counter()-t0)*1000
              send("quit"); p.wait(timeout=5)
              return ms,best,info
          for e in exes.values():
              for _ in range(2): one(e)
          vals={k:[] for k in exes}; order=list(vals)*12
          random.Random(2026092403).shuffle(order)
          for k in order: vals[k].append(one(exes[k]))
          for k,v in vals.items():
              print(k,"median_ms",statistics.median(x[0] for x in v),"bestmoves",sorted(set(x[1] for x in v)))
          p=statistics.median(x[0] for x in vals["pathscratch"])
          n=statistics.median(x[0] for x in vals["no_pathscratch"])
          print("PATHSCRATCH_SPEEDUP_X",n/p,"TIME_REDUCTION_PCT",(1-p/n)*100)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pathscratch-binaries-${{ github.run_id }}
          retention-days: 7
          path: gate-bin/*

  h2h:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build shard-local native binaries
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/zq-main "$BASE_SHA"
          mkdir -p gate-bin
          g++ -O3 -DNDEBUG -std=c++17 -march=native -pthread -I/tmp/zq-main/src /tmp/zq-main/tools/external/zquoridor_uci.cpp -o gate-bin/pathscratch
          g++ -O3 -DNDEBUG -std=c++17 -march=native -pthread -Isrc tools/external/zquoridor_uci.cpp -o gate-bin/no-pathscratch
      - name: Play 100 H2H games
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gate-bin/pathscratch gate-bin/no-pathscratch
          mkdir -p benchmark_results/pathscratch/h2h
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          ROOT=Path(".").resolve(); sys.path.insert(0,str(ROOT))
          from tools import run_benchmark
          from tools.external import local_arena
          shard=int(os.environ["SHARD"]); seed=int(os.environ["OPENING_SEED"])
          total_pairs=200; per=50
          W=str((ROOT/"data/nnue/nnue_weights_int8.bin").resolve())
          cand=[str((ROOT/"gate-bin/pathscratch").resolve()),"--nnue",W]
          base=[str((ROOT/"gate-bin/no-pathscratch").resolve()),"--nnue",W]
          openings=run_benchmark._read_openings(ROOT/"tools/external/openings_confirmation_v1.jsonl",total_pairs,seed)[shard*per:(shard+1)*per]
          rows=[]
          for oi,op in openings:
              for side in (0,1):
                  row=local_arena.play_game(
                    opponent="no-pathscratch",opening_index=int(oi),opening=op,zq_player=side,
                    zq_factory=lambda cmd=cand: local_arena.UciPlayer(cmd,"pathscratch"),
                    opponent_factory=lambda cmd=base: local_arena.UciPlayer(cmd,"no-pathscratch"),
                    zq_budget=200,opponent_budget=200,move_timeout_s=30.0,max_plies=240,
                    run_id=f"pathscratch-h2h-{shard}")
                  rows.append(row)
          summary=local_arena.summarize_pairs(rows,bootstrap=20000,seed=seed+shard)
          p=ROOT/"benchmark_results/pathscratch/h2h"/f"shard-{shard}.json"
          p.write_text(json.dumps({"games":rows,"summary":summary},indent=2)+"\n")
          print("SHARD_SUMMARY",json.dumps(summary,sort_keys=True))
          if summary["failed_games"]: raise SystemExit(summary["failed_games"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pathscratch-h2h-${{ matrix.shard }}-${{ github.run_id }}
          path: benchmark_results/pathscratch/h2h/shard-${{ matrix.shard }}.json

  claustro:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build shard-local native candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-bin
          g++ -O3 -DNDEBUG -std=c++17 -march=native -pthread -I. -Isrc tools/external/zquoridor_uci.cpp -o gate-bin/pathscratch
      - name: Prepare runtime and pinned Claustrophobia
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gate-bin/pathscratch
          python -m pip install --disable-pip-version-check numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          from pathlib import Path
          from tools.external.bot_setup import ensure_bot,CLAUSTROPHOBIA_SHA,CLAUSTROPHOBIA_CHECKPOINT_SHA256
          print(ensure_bot("claustrophobia",root=Path("."),build=True))
          print(CLAUSTROPHOBIA_SHA,CLAUSTROPHOBIA_CHECKPOINT_SHA256)
          PY
      - name: Play 100 games vs Claustrophobia
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark_results/pathscratch/claustro
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          ROOT=Path(".").resolve(); sys.path.insert(0,str(ROOT))
          from tools import run_benchmark
          from tools.external import local_arena
          from tools.external.bot_setup import ensure_bot
          shard=int(os.environ["SHARD"]); seed=int(os.environ["OPENING_SEED"])
          total_pairs=200; per=50
          W=str((ROOT/"data/nnue/nnue_weights_int8.bin").resolve())
          cand=[str((ROOT/"gate-bin/pathscratch").resolve()),"--nnue",W]
          info=ensure_bot("claustrophobia",root=ROOT,build=False)
          openings=run_benchmark._read_openings(ROOT/"tools/external/openings_confirmation_v1.jsonl",total_pairs,seed)[shard*per:(shard+1)*per]
          rows=[]
          for oi,op in openings:
              for side in (0,1):
                  row=local_arena.play_game(
                    opponent="claustrophobia",opening_index=int(oi),opening=op,zq_player=side,
                    zq_factory=lambda cmd=cand: local_arena.UciPlayer(cmd,"pathscratch"),
                    opponent_factory=lambda: local_arena.ClaustrophobiaPlayer(
                      Path(info["benchmark_bridge"]),Path(info["checkpoint"]),
                      move_time_ms=200,max_sims=4096,cpuct=1.5,device="cpu"),
                    zq_budget=200,opponent_budget=200,move_timeout_s=30.0,max_plies=240,
                    run_id=f"pathscratch-claustro-{shard}")
                  rows.append(row)
          summary=local_arena.summarize_pairs(rows,bootstrap=20000,seed=seed+100+shard)
          p=ROOT/"benchmark_results/pathscratch/claustro"/f"shard-{shard}.json"
          p.write_text(json.dumps({"games":rows,"summary":summary},indent=2)+"\n")
          print("SHARD_SUMMARY",json.dumps(summary,sort_keys=True))
          if summary["failed_games"]: raise SystemExit(summary["failed_games"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pathscratch-claustro-${{ matrix.shard }}-${{ github.run_id }}
          path: benchmark_results/pathscratch/claustro/shard-${{ matrix.shard }}.json

  aggregate:
    needs: [h2h, claustro]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pathscratch-h2h-*-${{ github.run_id }}
          path: benchmark_results/pathscratch/all-h2h
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pathscratch-claustro-*-${{ github.run_id }}
          path: benchmark_results/pathscratch/all-claustro
          merge-multiple: true
      - name: Aggregate both 400-game gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys,os
          from pathlib import Path
          ROOT=Path(".").resolve(); sys.path.insert(0,str(ROOT))
          from tools.external import local_arena
          out={}
          for key,folder in (("pathscratch_vs_ablation","all-h2h"),("pathscratch_vs_claustrophobia","all-claustro")):
              rows=[]
              for p in sorted((ROOT/"benchmark_results/pathscratch"/folder).glob("shard-*.json")):
                  rows += json.loads(p.read_text())["games"]
              assert len(rows)==400,(key,len(rows))
              out[key]=local_arena.summarize_pairs(rows,bootstrap=100000,seed=int(os.environ["OPENING_SEED"]))
          print("FINAL_RESULT",json.dumps(out,sort_keys=True))
          p=ROOT/"benchmark_results/pathscratch/final.json"
          p.write_text(json.dumps(out,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pathscratch-final-${{ github.run_id }}
          path: benchmark_results/pathscratch/final.json
