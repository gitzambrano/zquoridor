name: vnext-race-value-500

on:
  workflow_dispatch:
  push:
    branches:
      - exp/vnext-search-2026-09
    paths:
      - ".github/workflows/vnext-race-value-500.yml"
      - "tools/experiments/apply_mcab_race_value.py"

jobs:
  validate:
    name: either-b20-500
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated Gen8 NNUE
        uses: actions/download-artifact@v4
        with:
          name: gen8-search-ci-completed
          path: bootstrap
          github-token: ${{ github.token }}
          repository: gitzambrano/zquoridor
          run-id: 33973129847

      - name: Materialize either-b20 candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/experiments/apply_mcab_race_value.py \
            --activation 'either-empty' \
            --blend '0.20' \
            --tempo-scale '1.5'
          git diff --check
          git config user.name "zquoridor-benchmark"
          git config user.email "benchmark@invalid.local"
          git add src/mcab.hpp
          git commit -m "exp(mcab): validate race-aware leaf value either-b20"

      - name: Direct head-to-head — 500 games at 200ms
        shell: bash
        env:
          W: ${{ github.workspace }}/bootstrap/nnue/candidates/gen8-search-ci/nnue_weights_int8.bin
        run: |
          set -euo pipefail
          test -s "$W"
          mkdir -p results
          python tools/arena/run_arena.py \
            --ref1 HEAD --ref2 HEAD^ \
            --games 500 --report-games 50 --time 200 --threads 14 \
            --seed 202609073 --random-plies 4 \
            --e1-nnue "$W" --e2-nnue "$W" \
            --e1-mcab-no-progressive-widening --e2-mcab-no-progressive-widening \
            2>&1 | tee results/either-b20-500.log

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-race-value-either-b20-500
          path: results/
          retention-days: 30
          if-no-files-found: warn
