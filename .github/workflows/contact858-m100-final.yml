name: Contact 858 M100 Final Confirmation

on:
  workflow_dispatch:
  push:
    branches: [exp/transform-search-v301-20261004]
    paths:
      - ".github/workflows/contact858-m100-final.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MAIN_SHA: 5044720a2fa1c3ef154cc9701a966ad67a07cde7
  CONTACT_WEIGHTS: results/experiments/contact_soup_tri_512/soup_tri_champion/student_int8.bin

jobs:
  h2h:
    name: h2h-${{ matrix.opponent }}-${{ matrix.book }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        opponent: [contact_base, production]
        book: [normal, central]
        include:
          - {book: normal, openings: tools/external/openings_normal_confirm_400.jsonl, pairs: 300, seed: 20261701}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 200, seed: 20261702}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build engines
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          (cd /tmp/zq-main && bash build/build_uci.sh)
          mkdir -p bin
          CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
          SF="-DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF tools/external/zquoridor_uci.cpp -o bin/contact_base
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/contact_m100
      - name: Run paired H2H
        shell: bash
        run: |
          if [ "${{ matrix.opponent }}" = "contact_base" ]; then
            OPP_EXE=bin/contact_base
            OPP_NNUE="/tmp/zq-main/$CONTACT_WEIGHTS"
          else
            OPP_EXE=/tmp/zq-main/bin/zquoridor
            OPP_NNUE=/tmp/zq-main/data/nnue/nnue_weights_int8.bin
          fi
          python -u tools/run_transform_search_confirmation.py             --gate main-fixed --name contact_m100             --engine-exe bin/contact_m100 --main-exe "$OPP_EXE"             --nnue "/tmp/zq-main/$CONTACT_WEIGHTS" --main-nnue "$OPP_NNUE"             --pairs "${{ matrix.pairs }}" --workers 2 --move-time-ms 200             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/contact858-m100-final/h2h/${{ matrix.opponent }}/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact858-m100-h2h-${{ matrix.opponent }}-${{ matrix.book }}
          path: results/contact858-m100-final/h2h/${{ matrix.opponent }}/${{ matrix.book }}
          retention-days: 14

  external:
    name: ext-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
    runs-on: ubuntu-latest
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        subject: [production, contact_base, contact_m100]
        opponent: [claustrophobia, titanium]
        book: [normal, central]
        include:
          - {book: normal, openings: tools/external/openings_normal_confirm_400.jsonl, seed: 20261711}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, seed: 20261712}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: |
            external_bots/claustrophobia/champion.pt
            ~/.cargo/registry
            ~/.cargo/git
          key: contact858-m100-final-${{ runner.os }}-${{ hashFiles('tools/external/bot_setup.py','tools/external/claustrophobia_benchmark_bridge.rs','training/teachers/claustrophobia_ipc_eval.rs','training/teachers/claustrophobia_inference_worker.py') }}
          restore-keys: |
            contact858-m100-final-${{ runner.os }}-
      - name: Install Claustrophobia runtime
        if: matrix.opponent == 'claustrophobia'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build subject
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p bin
          if [ "${{ matrix.subject }}" = "production" ]; then
            (cd /tmp/zq-main && bash build/build_uci.sh)
            cp /tmp/zq-main/bin/zquoridor bin/subject
            cp /tmp/zq-main/data/nnue/nnue_weights_int8.bin bin/subject.nnue
          else
            CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
            SF=""
            if [ "${{ matrix.subject }}" = "contact_m100" ]; then
              SF="-DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
            fi
            g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/subject
            cp "/tmp/zq-main/$CONTACT_WEIGHTS" bin/subject.nnue
          fi
      - name: External confirmation
        shell: bash
        run: |
          if [ "${{ matrix.opponent }}" = "claustrophobia" ]; then
            PAIRS=200
          else
            PAIRS=150
          fi
          if [ "${{ matrix.book }}" = "central" ]; then PAIRS=100; fi
          python -u tools/run_transform_search_confirmation.py             --gate external --name "${{ matrix.subject }}"             --engine-exe bin/subject --nnue bin/subject.nnue             --pairs "$PAIRS" --workers 1 --move-time-ms 200             --seed "${{ matrix.seed }}" --opponents "${{ matrix.opponent }}"             --openings "${{ matrix.openings }}"             --output "results/contact858-m100-final/external/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact858-m100-ext-${{ matrix.subject }}-${{ matrix.opponent }}-${{ matrix.book }}
          path: results/contact858-m100-final/external/${{ matrix.subject }}/${{ matrix.opponent }}/${{ matrix.book }}
          retention-days: 14

  clock:
    name: 3plus2-${{ matrix.book }}
    runs-on: ubuntu-latest
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {book: normal, openings: tools/external/openings_normal_confirm_400.jsonl, pairs: 30, seed: 20261721}
          - {book: central, openings: tools/external/openings_center_rush_sound_5k.jsonl, pairs: 20, seed: 20261722}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build Contact baseline and m100
        shell: bash
        run: |
          git worktree add /tmp/zq-main "$MAIN_SHA"
          mkdir -p bin
          CF="-DZQ_NNUE_RACE_FEATURES=1 -DZQ_NNUE_MULTIPATH_FEATURES=1 -DZQ_NNUE_MARGIN_REGIME_FEATURES=0 -DZQ_NNUE_PHASE_FEATURES=1 -DZQ_NNUE_CONTACT_FEATURES=1 -DZQ_NNUE_HIDDEN=512 -DZQ_NNUE_VALUE_BUCKETS=6 -DZQ_NNUE_VALUE_DEPTH=2"
          SF="-DZQ_EXP_RESIDUAL_PUCT=1 -DZQ_EXP_EDGE_ACC_CACHE=1 -DZQ_EXP_RESIDUAL_ROOT_INITIAL=16 -DZQ_EXP_RESIDUAL_INNER_INITIAL=8 -DZQ_EXP_RESIDUAL_MASS_PCT=100"
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF tools/external/zquoridor_uci.cpp -o bin/contact_base
          g++ -O3 -DNDEBUG -std=c++17 -pthread -Isrc $CF $SF tools/external/zquoridor_uci.cpp -o bin/contact_m100
      - name: 3+2 Contact delta
        run: |
          python -u tools/run_transform_search_confirmation.py             --gate main-clock --name contact_m100             --engine-exe bin/contact_m100 --main-exe bin/contact_base             --nnue "/tmp/zq-main/$CONTACT_WEIGHTS"             --main-nnue "/tmp/zq-main/$CONTACT_WEIGHTS"             --pairs "${{ matrix.pairs }}" --workers 1             --base-ms 180000 --increment-ms 2000 --move-overhead-ms 20             --seed "${{ matrix.seed }}" --openings "${{ matrix.openings }}"             --output "results/contact858-m100-final/clock/${{ matrix.book }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact858-m100-clock-${{ matrix.book }}
          path: results/contact858-m100-final/clock/${{ matrix.book }}
          retention-days: 14
